const endpoint="https://ibpffxzdjvgydnhmvmvc.supabase.co/functions/v1/site-access",key="privateSitesSession",original="\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cscript>(function(){const native=window.fetch.bind(window);window.fetch=function(input,init){const url=new URL(typeof input===\"string\"?input:input.url,location.href);if(url.origin===\"https://ibpffxzdjvgydnhmvmvc.supabase.co\"&&url.pathname.includes(\"/functions/v1/\")&&!url.pathname.endsWith(\"/site-access\")){const h=new Headers(init?.headers||(input instanceof Request?input.headers:undefined));h.set(\"x-site-access\",localStorage.getItem(\"privateSitesSession\")||\"\");init={...init,headers:h};}return native(input,init);};})();\u003c/script>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content\">\n\u003cmeta name=\"robots\" content=\"noindex,nofollow,noarchive\">\n\u003cmeta name=\"theme-color\" content=\"#f7f3fa\">\n\u003ctitle>妈妈专线 · 配置\u003c/title>\n\u003cstyle>\n:root{--bg:#f5f1f7;--card:#fff;--ink:#342e38;--muted:#827986;--line:#e8e0eb;--accent:#8f73b7}\n*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#e8ddf1,transparent 34%),var(--bg);font-family:system-ui,-apple-system,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;color:var(--ink)}\n.wrap{width:min(100% - 24px,560px);margin:0 auto;padding:26px 0 50px}h1{font-size:22px;margin:0}.sub{font-size:12px;color:var(--muted);margin:6px 0 18px;line-height:1.6}.card{background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 15px 44px rgba(70,56,80,.08)}label{display:block;margin:13px 0 0;font-size:12px;color:#756d79}input{display:block;width:100%;height:48px;margin-top:6px;padding:0 13px;border:1px solid #ded5e2;border-radius:14px;background:white;color:var(--ink);font:inherit}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}button{border:0;border-radius:14px;min-height:46px;background:#eee8f1;color:#5f5367;font:inherit;font-weight:750}button.primary{background:var(--accent);color:white}.status{margin-top:14px;padding:11px 12px;border-radius:13px;background:#f7f3f9;color:#716778;font-size:12px;line-height:1.55;white-space:pre-wrap}.note{margin-top:14px;color:var(--muted);font-size:11px;line-height:1.7}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n  \u003ch1>七｜妈妈专线 · 服务端配置\u003c/h1>\n  \u003cdiv class=\"sub\">这个页面只给玲用。阿姨的聊天页不会显示 API、模型或密钥。\u003c/div>\n  \u003cdiv class=\"card\">\n    \u003clabel>管理员口令\u003cinput id=\"admin\" type=\"password\" autocomplete=\"current-password\" placeholder=\"输入管理员口令\">\u003c/label>\n    \u003clabel>OpenAI 兼容 Base URL\u003cinput id=\"base\" placeholder=\"https://example.com/v1\" autocomplete=\"off\">\u003c/label>\n    \u003clabel>API Key\u003cinput id=\"key\" type=\"password\" placeholder=\"留空则保留服务端现有 Key\" autocomplete=\"off\">\u003c/label>\n    \u003clabel>模型\u003cinput id=\"model\" placeholder=\"例如 gpt-5.6\" autocomplete=\"off\">\u003c/label>\n    \u003cdiv class=\"actions\">\n      \u003cbutton id=\"load\">读取当前配置\u003c/button>\n      \u003cbutton class=\"primary\" id=\"save\">保存配置\u003c/button>\n      \u003cbutton id=\"test\">测试连接\u003c/button>\n      \u003cbutton id=\"open\">打开妈妈专线\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"status\" id=\"status\">还没有读取。\u003c/div>\n    \u003cdiv class=\"note\">API Key 只发给你的 Supabase Edge Function 并保存在服务端私有状态，不写进网页源码，也不会出现在妈妈的浏览器设置里。\u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003cscript>\nconst API='https://ibpffxzdjvgydnhmvmvc.supabase.co/functions/v1/mom-ai';\nconst $=s=>document.querySelector(s);\nfunction status(s){$('#status').textContent=s}\nasync function call(action,extra={}){\n  const admin_code=$('#admin').value.trim();\n  if(!admin_code)throw new Error('先填管理员口令');\n  const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,admin_code,...extra})});\n  const d=await r.json().catch(()=>({}));\n  if(!r.ok)throw new Error(d.message||d.error||('HTTP '+r.status));\n  return d;\n}\n$('#load').onclick=async()=>{status('读取中…');try{const d=await call('admin_status');$('#base').value=d.base_url||'';$('#model').value=d.model||'';status(d.configured?'已配置。API Key 已保存在服务端。':'还没完成配置。')}catch(e){status('读取失败：'+e.message)}};\n$('#save').onclick=async()=>{status('保存中…');try{await call('admin_setup',{base_url:$('#base').value.trim(),api_key:$('#key').value.trim(),model:$('#model').value.trim()});$('#key').value='';status('保存好了 ✓\\n接下来点“测试连接”。')}catch(e){status('保存失败：'+e.message)}};\n$('#test').onclick=async()=>{status('正在让模型回一句测试消息…');try{const d=await call('admin_test');status('测试成功 ✓\\n模型回复：'+d.reply)}catch(e){status('测试失败：'+e.message)}};\n$('#open').onclick=()=>location.href=location.pathname;\n\u003c/script>\n\u003c/body>\n\u003c/html>\n";
async function request(body){const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:AbortSignal.timeout(15000)});const d=await r.json();if(!r.ok)throw new Error(d.error||"暂时无法登录");return d;}
function openSite(token){localStorage.setItem(key,token);document.open();document.write(original);document.close();}
document.getElementById("gate").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("enter"),error=document.getElementById("error");b.disabled=true;error.textContent="正在登录…";try{const d=await request({action:"login",code:document.getElementById("code").value});openSite(d.token);}catch(e){error.textContent=e.name==="TimeoutError"?"连接超时，请再试一次":e.message;b.disabled=false;}};
(async()=>{const token=localStorage.getItem(key);if(!token){document.getElementById("error").textContent="";return;}try{await request({action:"verify",token});openSite(token);}catch(e){if(e.message.includes("过期"))localStorage.removeItem(key);document.getElementById("error").textContent="请重新输入访问码，或检查网络后刷新。";}})();
