<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>私人站点 · 登录</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f3fa;font:18px system-ui;color:#3d3447;display:grid;place-items:center;min-height:100dvh;padding:24px}main{width:min(100%,390px);background:white;border:1px solid #e5ddea;border-radius:24px;padding:30px;box-shadow:0 12px 50px #66507712}h1{font-size:24px}p{font-size:15px;line-height:1.7;color:#776c80}input,button{width:100%;font:inherit;padding:14px;border-radius:12px;border:1px solid #dcd1e4;margin-top:12px}button{background:#806292;color:white;cursor:pointer}button:disabled{opacity:.6}#error{color:#9d3654;min-height:24px;font-size:14px}label{font-size:16px}</style></head><body><main><h1>私人站点</h1><p>输入玲给你的访问码。登录后，这台设备会记住 30 天。</p><form id="gate"><label for="code">访问码</label><input id="code" type="password" autocomplete="current-password" required maxlength="120"><button id="enter">进入</button></form><p id="error" role="status">正在检查登录…</p></main><script>
const endpoint="https://ibpffxzdjvgydnhmvmvc.supabase.co/functions/v1/site-access",key="privateSitesSession",original="\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cscript>(function(){const native=window.fetch.bind(window);window.fetch=function(input,init){const url=new URL(typeof input===\"string\"?input:input.url,location.href);if(url.origin===\"https://ibpffxzdjvgydnhmvmvc.supabase.co\"&&[\"site-sync\",\"english-sync\",\"code-models\"].includes(url.pathname.split(\"/\").pop())){const h=new Headers(init?.headers||(input instanceof Request?input.headers:undefined));h.set(\"x-site-access\",localStorage.getItem(\"privateSitesSession\")||\"\");init={...init,headers:h};}return native(input,init);};})();\u003c/script>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content\">\n\u003cmeta name=\"robots\" content=\"noindex,nofollow,noarchive\">\n\u003cmeta name=\"theme-color\" content=\"#f7f3fa\">\n\u003ctitle>妈妈专线 · 配置\u003c/title>\n\u003cstyle>\n:root{--bg:#f5f1f7;--card:#fff;--ink:#342e38;--muted:#827986;--line:#e8e0eb;--accent:#8f73b7}\n*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#e8ddf1,transparent 34%),var(--bg);font-family:system-ui,-apple-system,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;color:var(--ink)}\n.wrap{width:min(100% - 24px,560px);margin:0 auto;padding:26px 0 50px}h1{font-size:22px;margin:0}.sub{font-size:12px;color:var(--muted);margin:6px 0 18px;line-height:1.6}.card{background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 15px 44px rgba(70,56,80,.08)}label{display:block;margin:13px 0 0;font-size:12px;color:#756d79}input{display:block;width:100%;height:48px;margin-top:6px;padding:0 13px;border:1px solid #ded5e2;border-radius:14px;background:white;color:var(--ink);font:inherit}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}button{border:0;border-radius:14px;min-height:46px;background:#eee8f1;color:#5f5367;font:inherit;font-weight:750}button.primary{background:var(--accent);color:white}.status{margin-top:14px;padding:11px 12px;border-radius:13px;background:#f7f3f9;color:#716778;font-size:12px;line-height:1.55;white-space:pre-wrap}.note{margin-top:14px;color:var(--muted);font-size:11px;line-height:1.7}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n  \u003ch1>七｜妈妈专线 · 服务端配置\u003c/h1>\n  \u003cdiv class=\"sub\">这个页面只给玲用。阿姨的聊天页不会显示 API、模型或密钥。\u003c/div>\n  \u003cdiv class=\"card\">\n    \u003clabel>OpenAI 兼容 Base URL\u003cinput id=\"base\" placeholder=\"https://example.com/v1\" autocomplete=\"off\">\u003c/label>\n    \u003clabel>API Key\u003cinput id=\"key\" type=\"password\" placeholder=\"留空则保留服务端现有 Key\" autocomplete=\"off\">\u003c/label>\n    \u003clabel>模型\u003cinput list=\"models\" id=\"model\" placeholder=\"先拉取模型，也可手动填写\" autocomplete=\"off\">\u003c/label>\u003cdatalist id=\"models\">\u003c/datalist>\n    \u003cdiv class=\"actions\">\n      \u003cbutton id=\"load\">读取云端配置\u003c/button>\u003cbutton id=\"modelsBtn\">拉取模型\u003c/button>\n      \u003cbutton class=\"primary\" id=\"save\">保存配置\u003c/button>\n      \u003cbutton id=\"test\">测试连接\u003c/button>\n      \u003cbutton id=\"open\">打开妈妈专线\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"status\" id=\"status\">还没有读取。\u003c/div>\n    \u003cdiv class=\"note\">API Key 只发给你的 Supabase Edge Function 并保存在服务端私有状态，不写进网页源码，也不会出现在妈妈的浏览器设置里。\u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003cscript>\nconst API='https://ibpffxzdjvgydnhmvmvc.supabase.co/functions/v1/mom-ai';\nconst $=s=>document.querySelector(s);\nlet loaded={};\nfunction status(s){$('#status').textContent=s}\nasync function call(action,extra={}){\n const site_token=localStorage.getItem('privateSitesSession')||'';\n if(!site_token)throw new Error('登录已过期，请刷新后重新登录');\n const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,site_token,...extra}),signal:AbortSignal.timeout(action==='admin_test'?125000:35000)});\n const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||d.error||('HTTP '+r.status));return d;\n}\nasync function run(task){document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await task();}catch(e){status('没有完成：'+e.message);}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}}\nasync function load(){status('读取云端配置…');loaded=await call('admin_status');$('#base').value=loaded.base_url||'';$('#model').value=loaded.model||'';$('#key').placeholder=loaded.has_key?'已存云端；留空保留，填入则更换':'填写 API Key';status(loaded.configured?'云端配置已恢复 ✓\\n这套接口供妈妈所有设备使用。':'还没配置。填地址和 Key → 拉取模型 → 保存 → 测试连接。');}\n$('#load').onclick=()=>run(load);\n$('#modelsBtn').onclick=()=>run(async()=>{status('正在拉取模型…');const d=await call('admin_models',{base_url:$('#base').value.trim(),api_key:$('#key').value.trim()});const ids=d.models||[];$('#models').replaceChildren(...ids.map(id=>new Option(id,id)));if(!$('#model').value&&ids.length)$('#model').value=ids[0];status('拉到 '+ids.length+' 个模型。点模型输入框选择，也可以手动填写。');});\n$('#save').onclick=()=>run(async()=>{if(!$('#base').value.trim()||!$('#model').value.trim())throw new Error('填写接口地址和模型');status('保存到云端…');await call('admin_setup',{base_url:$('#base').value.trim(),api_key:$('#key').value.trim(),model:$('#model').value.trim()});$('#key').value='';loaded={base_url:$('#base').value.trim(),model:$('#model').value.trim()};status('云端保存好了 ✓\\n妈妈换设备也不用重填。接下来点测试连接。');});\n$('#test').onclick=()=>run(async()=>{if($('#key').value.trim()||$('#base').value.trim()!==loaded.base_url||$('#model').value.trim()!==loaded.model)throw new Error('配置有改动，请先保存');status('正在测试连接…');const d=await call('admin_test');status('连接正常 ✓\\n模型回复：'+d.reply);});\n$('#open').onclick=()=>location.href='./';\nrun(load);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n";
async function request(body){const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:AbortSignal.timeout(15000)});const d=await r.json();if(!r.ok)throw new Error(d.error||"暂时无法登录");return d;}
function openSite(token){localStorage.setItem(key,token);document.open();document.write(original);document.close();}
document.getElementById("gate").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("enter"),error=document.getElementById("error");b.disabled=true;error.textContent="正在登录…";try{const d=await request({action:"login",code:document.getElementById("code").value});openSite(d.token);}catch(e){error.textContent=e.name==="TimeoutError"?"连接超时，请再试一次":e.message;b.disabled=false;}};
(async()=>{const token=localStorage.getItem(key);if(!token){document.getElementById("error").textContent="";return;}try{await request({action:"verify",token});openSite(token);}catch(e){if(e.message.includes("过期"))localStorage.removeItem(key);document.getElementById("error").textContent="请重新输入访问码，或检查网络后刷新。";}})();
</script></body></html>
