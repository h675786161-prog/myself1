const endpoint="https://ibpffxzdjvgydnhmvmvc.supabase.co/functions/v1/site-access",key="privateSitesSession",original="\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cscript>(function(){const native=window.fetch.bind(window);window.fetch=function(input,init){const url=new URL(typeof input===\"string\"?input:input.url,location.href);if(url.origin===\"https://ibpffxzdjvgydnhmvmvc.supabase.co\"&&[\"site-sync\",\"english-sync\",\"code-models\"].includes(url.pathname.split(\"/\").pop())){const h=new Headers(init?.headers||(input instanceof Request?input.headers:undefined));h.set(\"x-site-access\",localStorage.getItem(\"privateSitesSession\")||\"\");init={...init,headers:h};}return native(input,init);};})();\u003c/script>\n  \u003cmeta charset=\"utf-8\" />\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\" />\n  \u003cmeta name=\"theme-color\" content=\"#15121c\" />\n  \u003cmeta name=\"color-scheme\" content=\"dark light\" />\n  \u003ctitle>玲七 Code\u003c/title>\n  \u003clink rel=\"manifest\" href=\"./manifest.webmanifest\" />\n  \u003clink rel=\"icon\" href=\"./icon.svg\" type=\"image/svg+xml\" />\n  \u003clink rel=\"stylesheet\" href=\"./styles.css\" />\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"app-shell\">\n    \u003cheader class=\"topbar\">\n      \u003cbutton id=\"menuBtn\" class=\"icon-btn\" aria-label=\"打开项目面板\">☰\u003c/button>\n      \u003cdiv class=\"brand\">\n        \u003cstrong>玲七 Code\u003c/strong>\n        \u003cspan id=\"statusText\">未连接\u003c/span>\n      \u003c/div>\n      \u003cbutton id=\"settingsBtn\" class=\"icon-btn\" aria-label=\"设置\">⚙\u003c/button>\n    \u003c/header>\n\n    \u003cmain class=\"chat-pane\" id=\"chatPane\">\n      \u003csection class=\"hero\" id=\"hero\">\n        \u003cdiv class=\"hero-mark\">7\u003c/div>\n        \u003ch1>像聊天一样改仓库\u003c/h1>\n        \u003cp>选仓库，描述你想改什么。先看 Diff，再决定要不要提交。人类终于不用在六寸屏幕里假装自己有三块显示器了。\u003c/p>\n        \u003cdiv class=\"hero-actions\">\n          \u003cbutton id=\"quickSetupBtn\" class=\"primary-btn\">先连接仓库\u003c/button>\n          \u003cbutton id=\"openFilesBtn\" class=\"ghost-btn\">看看文件\u003c/button>\n        \u003c/div>\n      \u003c/section>\n      \u003cdiv id=\"messages\" class=\"messages\" aria-live=\"polite\">\u003c/div>\n    \u003c/main>\n\n    \u003cfooter class=\"composer-wrap\">\n      \u003cdiv id=\"contextBar\" class=\"context-bar hidden\">\u003c/div>\n      \u003cdiv class=\"composer\">\n        \u003ctextarea id=\"promptInput\" rows=\"1\" placeholder=\"比如：修一下手机端追问输入框，别动其他成熟功能\">\u003c/textarea>\n        \u003cbutton id=\"sendBtn\" class=\"send-btn\" aria-label=\"发送\">➤\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"composer-meta\">\n        \u003clabel>\u003cinput id=\"autoLocate\" type=\"checkbox\" checked /> 自动找相关文件\u003c/label>\n        \u003cspan id=\"modelBadge\">未选模型\u003c/span>\n      \u003c/div>\n    \u003c/footer>\n  \u003c/div>\n\n  \u003caside id=\"projectDrawer\" class=\"drawer left-drawer\" aria-hidden=\"true\">\n    \u003cdiv class=\"drawer-head\">\n      \u003cdiv>\n        \u003cstrong>项目\u003c/strong>\n        \u003csmall id=\"repoLabel\">未连接仓库\u003c/small>\n      \u003c/div>\n      \u003cbutton class=\"icon-btn close-drawer\" data-close=\"projectDrawer\">×\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"drawer-tools\">\n      \u003cinput id=\"fileSearch\" type=\"search\" placeholder=\"搜索文件…\" />\n      \u003cbutton id=\"refreshTreeBtn\" class=\"small-btn\">刷新\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"project-tabs\">\n      \u003cbutton class=\"tab-btn active\" data-project-tab=\"files\">文件\u003c/button>\n      \u003cbutton class=\"tab-btn\" data-project-tab=\"changes\">改动 \u003cspan id=\"changeCount\">0\u003c/span>\u003c/button>\n      \u003cbutton class=\"tab-btn\" data-project-tab=\"git\">Git\u003c/button>\n    \u003c/div>\n    \u003cdiv id=\"filesTab\" class=\"project-tab active\">\n      \u003cdiv id=\"fileList\" class=\"file-list empty-state\">连接仓库后显示文件\u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"changesTab\" class=\"project-tab\">\n      \u003cdiv id=\"changesList\" class=\"changes-list empty-state\">还没有待应用改动\u003c/div>\n      \u003cdiv class=\"drawer-bottom-actions\">\n        \u003cbutton id=\"discardChangesBtn\" class=\"danger-ghost\">全部丢弃\u003c/button>\n        \u003cbutton id=\"applyChangesBtn\" class=\"primary-btn\" disabled>应用到分支\u003c/button>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"gitTab\" class=\"project-tab\">\n      \u003clabel class=\"field\">工作分支\u003cinput id=\"workBranch\" placeholder=\"ai/mobile-workbench\" />\u003c/label>\n      \u003clabel class=\"field\">提交说明\u003cinput id=\"commitMessage\" value=\"feat: apply AI code changes\" />\u003c/label>\n      \u003cbutton id=\"createPrBtn\" class=\"primary-btn full\" disabled>创建 Draft Pull Request\u003c/button>\n      \u003cdiv id=\"gitLog\" class=\"git-log\">\u003c/div>\n    \u003c/div>\n  \u003c/aside>\n\n  \u003caside id=\"detailDrawer\" class=\"drawer right-drawer\" aria-hidden=\"true\">\n    \u003cdiv class=\"drawer-head\">\n      \u003cdiv>\n        \u003cstrong id=\"detailTitle\">文件\u003c/strong>\n        \u003csmall id=\"detailSubtitle\">\u003c/small>\n      \u003c/div>\n      \u003cbutton class=\"icon-btn close-drawer\" data-close=\"detailDrawer\">×\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"detail-toolbar\">\n      \u003cbutton id=\"addContextBtn\" class=\"small-btn\">加入上下文\u003c/button>\n      \u003cbutton id=\"removeContextBtn\" class=\"small-btn hidden\">移出上下文\u003c/button>\n    \u003c/div>\n    \u003cpre id=\"detailContent\" class=\"code-view\">\u003c/pre>\n  \u003c/aside>\n\n  \u003cdialog id=\"settingsDialog\" class=\"settings-dialog\">\n    \u003cform method=\"dialog\" id=\"settingsForm\">\n      \u003cdiv class=\"settings-head\">\n        \u003cdiv>\u003cstrong>连接设置\u003c/strong>\u003csmall>浏览器只保存工作台会话，不保存 API 密钥\u003c/small>\u003c/div>\n        \u003cbutton class=\"icon-btn\" value=\"cancel\">×\u003c/button>\n      \u003c/div>\n\n      \u003csection class=\"settings-section\">\n        \u003ch2>GitHub\u003c/h2>\n        \u003clabel class=\"field\">仓库\u003cinput id=\"repoInput\" placeholder=\"owner/repo，例如 h675786161-prog/myself\" autocomplete=\"off\" />\u003c/label>\n        \u003clabel class=\"field\">基础分支\u003cinput id=\"baseBranchInput\" value=\"main\" autocomplete=\"off\" />\u003c/label>\n        \u003clabel class=\"field\">GitHub Token\u003cinput id=\"githubTokenInput\" type=\"password\" placeholder=\"首次连接必填；之后留空即可\" autocomplete=\"off\" />\u003c/label>\n      \u003c/section>\n\n      \u003csection class=\"settings-section\">\n        \u003ch2>AI 接口\u003c/h2>\n        \u003clabel class=\"field\">Base URL\u003cinput id=\"aiBaseUrlInput\" placeholder=\"https://gensoukyou.xyz/ 或 https://example.com/v1\" autocomplete=\"off\" />\u003c/label>\n        \u003clabel class=\"field\">API Key\u003cinput id=\"aiKeyInput\" type=\"password\" placeholder=\"首次配置或换 Key 时填写\" autocomplete=\"off\" />\u003c/label>\n        \u003cdiv class=\"field-row\">\n          \u003clabel class=\"field grow\">模型\u003cselect id=\"modelSelect\">\u003coption value=\"\">先拉取模型\u003c/option>\u003c/select>\u003c/label>\n          \u003cbutton id=\"loadModelsBtn\" type=\"button\" class=\"small-btn align-end\">拉取模型\u003c/button>\n        \u003c/div>\n        \u003clabel class=\"field\">手动模型 ID\u003cinput id=\"manualModelInput\" placeholder=\"接口菜单抽风时可以直接手填\" autocomplete=\"off\" />\u003c/label>\n      \u003c/section>\n\n      \u003cp class=\"security-note\">Token 和 API Key 会发送到你自己的 Supabase 私有后端，由服务端代替手机访问 GitHub 与模型接口。建议 GitHub 使用 Fine-grained Token，只授权需要修改的仓库和最小权限。浏览器端只留下签名会话。\u003c/p>\n\n      \u003cdiv class=\"settings-actions\">\n        \u003cbutton value=\"cancel\" class=\"ghost-btn\">取消\u003c/button>\n        \u003cbutton id=\"saveSettingsBtn\" value=\"default\" class=\"primary-btn\">保存并连接\u003c/button>\n      \u003c/div>\n    \u003c/form>\n  \u003c/dialog>\n\n  \u003cdialog id=\"diffDialog\" class=\"diff-dialog\">\n    \u003cdiv class=\"diff-head\">\n      \u003cdiv>\u003cstrong id=\"diffTitle\">改动预览\u003c/strong>\u003csmall id=\"diffMeta\">\u003c/small>\u003c/div>\n      \u003cbutton id=\"closeDiffBtn\" class=\"icon-btn\">×\u003c/button>\n    \u003c/div>\n    \u003cpre id=\"diffContent\" class=\"diff-view\">\u003c/pre>\n  \u003c/dialog>\n\n  \u003cdiv id=\"toast\" class=\"toast\" role=\"status\">\u003c/div>\n  \u003cscript>\n  (() => {\n    const MODELS_API = 'https://ibpffxzdjvgydnhmvmvc.supabase.co/functions/v1/code-models';\n    const showToast = (message, ms = 3200) => {\n      const el = document.querySelector('#toast');\n      if (!el) return;\n      el.textContent = message;\n      el.classList.add('show');\n      clearTimeout(showToast.timer);\n      showToast.timer = setTimeout(() => el.classList.remove('show'), ms);\n    };\n\n    document.addEventListener('click', async (event) => {\n      const button = event.target?.closest?.('#loadModelsBtn');\n      if (!button) return;\n\n      const baseInput = document.querySelector('#aiBaseUrlInput');\n      const keyInput = document.querySelector('#aiKeyInput');\n      const select = document.querySelector('#modelSelect');\n      const baseUrl = baseInput?.value?.trim() || '';\n      const apiKey = keyInput?.value?.trim() || '';\n\n      // 已经登录且没有临时填写新接口时，交回主程序使用服务端已保存配置。\n      if (!baseUrl && !apiKey) return;\n\n      event.preventDefault();\n      event.stopPropagation();\n      event.stopImmediatePropagation();\n\n      if (!baseUrl || !apiKey) {\n        showToast('拉取模型只需要填 AI Base URL 和 API Key，两项都要有');\n        return;\n      }\n\n      const oldText = button.textContent;\n      button.disabled = true;\n      button.textContent = '拉取中…';\n      try {\n        const res = await fetch(MODELS_API, {\n          method: 'POST',\n          headers: {'Content-Type': 'application/json'},\n          body: JSON.stringify({base_url: baseUrl, api_key: apiKey})\n        });\n        const data = await res.json().catch(() => ({}));\n        if (!res.ok) throw new Error(data?.message || data?.error || `HTTP ${res.status}`);\n        const models = Array.isArray(data.models) ? data.models : [];\n        select.innerHTML = '\u003coption value=\"\">选择模型\u003c/option>';\n        for (const id of models) {\n          const option = document.createElement('option');\n          option.value = id;\n          option.textContent = id;\n          select.appendChild(option);\n        }\n        showToast(models.length ? `拉到 ${models.length} 个模型` : '接口返回成功，但模型列表是空的');\n      } catch (err) {\n        showToast(`拉取失败：${err?.message || err}`, 4200);\n      } finally {\n        button.disabled = false;\n        button.textContent = oldText || '拉取模型';\n      }\n    }, true);\n  })();\n  \u003c/script>\n  \u003cscript type=\"module\" src=\"./app-server.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n";
async function request(body){const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:AbortSignal.timeout(15000)});const d=await r.json();if(!r.ok)throw new Error(d.error||"暂时无法登录");return d;}
function openSite(token){localStorage.setItem(key,token);document.open();document.write(original);document.close();}
document.getElementById("gate").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("enter"),error=document.getElementById("error");b.disabled=true;error.textContent="正在登录…";try{const d=await request({action:"login",code:document.getElementById("code").value});openSite(d.token);}catch(e){error.textContent=e.name==="TimeoutError"?"连接超时，请再试一次":e.message;b.disabled=false;}};
