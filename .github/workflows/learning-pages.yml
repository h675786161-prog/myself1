name: Deploy self websites
on:
  push:
    branches: [main]
    paths:
      - 'english/**'
      - 'tax/**'
      - 'code/**'
      - 'mom-ai/**'
      - 'japanese/**'
      - 'image-lab/**'
      - 'index.html'
      - 'release.json'
      - '.github/workflows/learning-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: learning-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify release and prepare public files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil

          manifest = json.loads(Path('release.json').read_text())
          root = Path('_site')
          root.mkdir()
          allowed = {
              'image-lab/index.html',
              'image-lab/style.css',
              'image-lab/app.js',
              'image-lab/reference-cache.js',
              'english/index.html',
              'mom-ai/app.js',
              'mom-ai/styles.css',
              'mom-ai/icon.svg',
              'mom-ai/manifest.webmanifest',
              'mom-ai/sw.js',
              'japanese/index.html',
              'mom-ai/index.html',
              'mom-ai/setup.html',
              'index.html',
              'tax/index.html',
              'code/index.html',
              'code/styles.css',
              'code/app-server.js',
              'code/manifest.webmanifest',
              'code/sw.js',
              'code/icon.svg',
          }
          image_lab = {
              'image-lab/index.html',
              'image-lab/style.css',
              'image-lab/app.js',
              'image-lab/reference-cache.js',
          }
          for name, expected in manifest['files'].items():
              source = Path(name)
              assert name in allowed, name
              assert source.exists(), name
              assert hashlib.sha256(source.read_bytes()).hexdigest() == expected, name
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)

          # image-lab changes frequently while being tuned. Keep it on a strict
          # path allowlist, but publish the current committed files directly so
          # every small UI/API fix does not require hand-updating four hashes.
          for name in image_lab:
              source = Path(name)
              assert source.exists(), name
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)

          (root / '.nojekyll').touch()
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
