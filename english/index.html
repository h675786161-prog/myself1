Content='已生成并保存 '+rounds.length+' 题。';renderRound();\n    }catch(error){if(request===version)el('tutorGenerationStatus').textContent='未生成：'+error.message;}\n    finally{if(request===version){generation=null;el('tutorGenerate').disabled=false;el('tutorResume').disabled=!store().rounds.length;}}\n  }\n  function renderRound(){\n    const q=rounds[roundIndex],host=el('tutorRound');const old=el('tutorFeedback');if(old)cancel(old);host.hidden=false;roundActual=q.actual||'';\n    host.innerHTML='\u003cp class=\"small\">'+(roundIndex+1)+' / '+rounds.length+' · '+esc(q.source)+'\u003c/p>\u003cdiv class=\"tutorQuestion\">'+esc(q.prompt)+'\u003c/div>'+\n      (q.options?'\u003cdiv class=\"certOptions\">'+q.options.map((x,i)=>'\u003cbutton class=\"certOption\" data-tutor-option=\"'+i+'\">'+esc(x)+'\u003c/button>').join(''):'\u003ctextarea class=\"certInput\" id=\"tutorAnswer\" aria-label=\"本题答案\" placeholder=\"写下你的答案，七来检查\" spellcheck=\"false\">\u003c/textarea>')+\n      '\u003cdiv class=\"tutorToolbar\">\u003cbutton class=\"btn primary\" id=\"tutorCheck\">让 AI 批改\u003c/button>\u003cbutton class=\"btn\" id=\"tutorNext\">下一题 →\u003c/button>\u003cbutton class=\"btn\" id=\"tutorSpeak\" hidden>听参考答案\u003c/button>\u003c/div>\u003cdiv id=\"tutorFeedback\" hidden>\u003c/div>\u003cdiv id=\"tutorExplanation\" class=\"tutorResult\" hidden>\u003c/div>';\n    el('tutorSpeak').onclick=()=>window.englishSpeech.speak(q.answer[0],{kind:q.answer[0].includes(' ')?'sentence':'word'});\n    if(q.options)host.querySelectorAll('[data-tutor-option]').forEach(b=>{b.classList.toggle('selected',q.options[Number(b.dataset.tutorOption)]===roundActual);b.onclick=()=>{roundActual=q.options[Number(b.dataset.tutorOption)];q.actual=roundActual;q.checked=false;save();cancel(el('tutorFeedback'));el('tutorFeedback').hidden=true;el('tutorExplanation').hidden=true;host.querySelectorAll('[data-tutor-option]').forEach(x=>x.classList.toggle('selected',x===b));};});\n    else{el('tutorAnswer').value=roundActual;el('tutorAnswer').oninput=e=>{roundActual=e.target.value;q.actual=roundActual;q.checked=false;save();cancel(el('tutorFeedback'));el('tutorFeedback').hidden=true;el('tutorExplanation').hidden=true;};}\n    el('tutorCheck').onclick=async()=>{\n      const actual=roundActual.trim();if(!actual){toast('先作答，再检查');return;}const at=roundIndex;el('tutorCheck').disabled=true;\n      const data=await review({host:el('tutorFeedback'),expected:q.answer[0],alternatives:q.answer.slice(1),actual,meaning:q.meaning,context:q.prompt,isCurrent:()=>dialog.open&&roundIndex===at&&roundActual.trim()===actual});\n      if(roundIndex!==at||!dialog.open)return;el('tutorCheck').disabled=false;\n      if(data){q.checked=true;save();el('tutorSpeak').hidden=false;el('tutorExplanation').hidden=false;el('tutorExplanation').textContent='参考答案：'+q.answer.join(' / ')+'\\n'+q.explanation;}\n    };\n    el('tutorNext').onclick=()=>{if(roundIndex+1\u003crounds.length){roundIndex++;renderRound();}else{el('tutorGenerationStatus').textContent='这一组练完了，可以结合错题再出一组。';toast('到最后一题了，可以再出一组');}};\n  }\n  function open(source='current'){if(!dialog.open)dialog.showModal();shell();el('tutorSource').value=source;el('tutorGenerate').focus();}\n  window.englishTutor={review,cancel,configured,canvasImage,open,diff,validate};\n})();\n\n\n\u003c/script>\n\u003c!-- END tutor.js -->\n\u003c!-- BEGIN issues.js -->\n\u003cscript>\n/* User-submitted issue reports. Only explicit submissions leave this device. */\n(()=>{\n  'use strict';\n  const endpoint='https://ibpffxzdjvgydnhmvmvc.supabase.co/functions/v1/english-private-api?asset=issue-report';\n  const revision='english-issues-20261003-1',draftKey='lazyEnglishIssueDraft-v1',historyKey='lazyEnglishIssueHistory-v1';\n  const el=id=>document.getElementById(id),clip=(v,n=4000)=>String(v||'').slice(0,n);\n  const labels={audio:'没有声音 / 发音不对',input:'输入或按钮失灵',content:'释义 / 题目有问题',layout:'显示不全 / 排版问题',other:'其他问题'};\n  const read=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))||fallback;}catch{return fallback;}};\n  const write=(key,value)=>{try{localStorage.setItem(key,JSON.stringify(value));}catch{}};\n  // Reports have a narrow allowlist. No settings, API configuration or AI conversation is read.\n  function snapshot(){\n    let ctx={};try{ctx=window.englishAssistant?.context?.()||{};}catch{}\n    let word;try{word=window.certificateUI?.currentWord?.();}catch{}\n    const lookup=el('wordSheet')?.open?el('wordMain')?.textContent:'';\n    return {revision,view:clip(ctx.view,40),goal:clip(ctx.goal,20),label:clip(ctx.label,150),content:clip(ctx.content),word:clip(lookup||word?.word,120),example:clip(word?.example,500),speech:window.englishSpeech?.diagnostics?.()||null,device:{browser:clip(navigator.userAgent,240),width:innerWidth,height:innerHeight,online:navigator.onLine!==false}};\n  }\n  const uuid=()=>crypto.randomUUID?.()||'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const n=crypto.getRandomValues(new Uint8Array(1))[0]&15;return(c==='x'?n:(n&3)|8).toString(16);});\n  const dialog=document.createElement('dialog');dialog.id='issueDialog';dialog.className='issueDialog';dialog.setAttribute('aria-label','上报网站问题');\n  dialog.innerHTML='\u003cdiv class=\"issueHeading\">\u003ch2>上报问题\u003c/h2>\u003cbutton class=\"issueClose\" id=\"issueClose\" aria-label=\"关闭问题上报\">×\u003c/button>\u003c/div>\u003cdiv class=\"issueHint\" id=\"issueContextLabel\">\u003c/div>\u003clabel for=\"issueType\">遇到什么问题？\u003c/label>\u003cselect id=\"issueType\">'+Object.entries(labels).map(([value,label])=>'\u003coption value=\"'+value+'\">'+label+'\u003c/option>').join('')+'\u003c/select>\u003clabel for=\"issueDescription\">补充说明（可不填）\u003c/label>\u003ctextarea id=\"issueDescription\" maxlength=\"1000\" placeholder=\"例如：点了听一下没有声音。具体单词会自动附上。\">\u003c/textarea>\u003cdetails>\u003csummary>查看自动附上的内容\u003c/summary>\u003cpre id=\"issuePreview\">\u003c/pre>\u003c/details>\u003cp class=\"issueHint\">会附上当前练习、相关单词、播放记录和浏览器信息。提交到网站的问题记录，不消耗 AI 额度。\u003c/p>\u003cdiv class=\"issueStatus\" id=\"issueStatus\" role=\"status\" aria-live=\"polite\">\u003c/div>\u003cdiv class=\"issueActions\">\u003cbutton class=\"btn primary\" id=\"issueSubmit\">提交问题\u003c/button>\u003cbutton class=\"btn\" id=\"issueReset\">改报当前内容\u003c/button>\u003c/div>\u003cdetails>\u003csummary>这台设备的上报记录\u003c/summary>\u003cdiv id=\"issueHistory\">\u003c/div>\u003c/details>';\n  document.body.append(dialog);\n  const fab=document.createElement('button');fab.id='issueFab';fab.className='issueFab';fab.type='button';fab.textContent='🐞 报错';fab.setAttribute('aria-label','上报当前页面问题');document.body.append(fab);\n  let pending=read(draftKey,null),busy=false;\n  function status(message,state=''){el('issueStatus').textContent=message;el('issueStatus').dataset.state=state;}\n  function history(){const node=el('issueHistory');node.replaceChildren();const records=read(historyKey,[]);if(!Array.isArray(records)||!records.length){node.textContent='还没有已提交的记录。';return;}for(const r of records){const row=document.createElement('div');row.className='issueHistoryItem';row.textContent=new Date(r.at).toLocaleString()+' · '+(labels[r.category]||'问题')+(r.word?' · '+r.word:'')+'\\n已提交 · '+r.id.slice(0,8);node.append(row);}}\n  function preview(){if(!pending)return;pending.category=el('issueType').value;pending.description=el('issueDescription').value.trim();write(draftKey,pending);el('issuePreview').textContent=JSON.stringify(pending.context,null,2);}\n  function renderDraft(resuming=false){el('issueType').value=pending.category;el('issueDescription').value=pending.description||'';el('issueContextLabel').textContent=(resuming?'继续上次未提交的问题 · ':'已附上 · ')+(pending.context.label||'当前学习页面')+(pending.context.word?' · '+pending.context.word:'');el('issuePreview').textContent=JSON.stringify(pending.context,null,2);status(resuming?'上次的内容已保留，可以继续提交。':'');el('issueSubmit').textContent='提交问题';el('issueSubmit').disabled=busy;history();}\n  function fresh(category){pending={id:uuid(),category:category||'other',description:'',createdAt:new Date().toISOString(),context:snapshot()};write(draftKey,pending);renderDraft();}\n  function open(category){if(busy)return;if(!pending?.id||!pending.context){const d=window.englishSpeech?.diagnostics?.();fresh(category||(d?.events?.at(-1)?.stage==='error'?'audio':'other'));}else renderDraft(true);if(!dialog.open)dialog.showModal();el('issueType').focus();}\n  async function submit(){\n    if(busy||!pending)return;preview();busy=true;el('issueSubmit').disabled=true;el('issueReset').disabled=true;status('正在提交…');\n    const body=JSON.stringify(pending),id=pending.id,controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);\n    try{\n      const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body,signal:controller.signal});\n      const data=await response.json();if(!response.ok||data.saved!==true||data.id!==id)throw Error('not-saved');\n      const records=read(historyKey,[]),list=Array.isArray(records)?records:[];\n      write(historyKey,[{id,category:pending.category,word:pending.context.word,at:new Date().toISOString()},...list.filter(r=>r.id!==id)].slice(0,20));\n      pending=null;write(draftKey,null);status('已提交，编号 '+id.slice(0,8)+'。七后续可以直接读取这条记录排查。','saved');el('issueSubmit').textContent='已提交';history();\n    }catch{status('未确认提交成功，内容已保留。可以再点一次重试，不会重复生成报告。','error');el('issueSubmit').textContent='重试提交';}\n    finally{clearTimeout(timer);busy=false;el('issueSubmit').disabled=!pending;el('issueReset').disabled=false;}\n  }\n  const inline=(parent,id,label,category)=>{if(!parent||el(id))return;const button=document.createElement('button');button.type='button';button.id=id;button.className='btn issueInline';button.textContent=label;button.onclick=()=>open(category);parent.append(button);return button;};\n  fab.onclick=()=>open();el('issueClose').onclick=()=>dialog.close();el('issueSubmit').onclick=submit;el('issueReset').onclick=()=>{if(!busy){fresh(el('issueType').value);el('issueSubmit').disabled=false;}};\n  el('issueType').onchange=preview;el('issueDescription').oninput=preview;\n  inline(document.querySelector('#wordSheet .wordActions')||el('wordDeep')?.parentElement,'issueWord','🐞 上报这个词','audio');\n  inline(document.querySelector('.assistantHeader'),'issueAssistant','报错','input');\n  const audioButton=inline(el('speechStatus')?.parentElement,'issueSpeech','上报这次发音问题','audio');if(audioButton)audioButton.hidden=true;\n  window.addEventListener('englishspeechdiagnostic',event=>{if(audioButton)audioButton.hidden=event.detail?.events?.at(-1)?.stage!=='error';});\n  window.englishIssues={open};\n})();\n\n\n\u003c/script>\n\u003c!-- END issues.js -->\n\u003c!-- BEGIN full-vocab-v3.js -->\n\u003cscript>\n/* Complete CEFR bank. Source: myself; home is a generated mirror. */\n(()=>{\n  'use strict';\n  if(window.__englishFullVocabV3)return;\n  const API='https://ibpffxzdjvgydnhmvmvc.supabase.co/functions/v1/english';\n  const FILES={A1:'cefr_a1.json',A2:'cefr_a2.json',B1:'cefr_b1.json',B2:'cefr_b2.json',C1:'cefr_c1.json',C2:'cefr_c2.json'};\n  const TARGETS={B1:['A1','A2','B1'],B2:['A1','A2','B1','B2'],C1:['A1','A2','B1','B2','C1'],C2:['A1','A2','B1','B2','C1','C2']};\n  const EXPECTED={A1:1063,A2:1352,B1:2354,B2:2691,C1:1009,C2:972};\n  const starter={},levels=new Map(),pendingLevels=new Map(),pendingTargets=new Map(),targets={};\n  const diagnostic=window.__englishFullVocabV3={version:'3.2',state:'booting',levels:{},targets,refreshes:[],events:[]};\n  const $=id=>document.getElementById(id),norm=v=>String(v||'').toLowerCase().replace(/[’‘]/g,\"'\").replace(/\\s+/g,' ').trim();\n  const current=()=>String($('certificateSelect')?.value||'C1').toUpperCase();\n  const safe=v=>norm(v).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,80)||'entry';\n  function record(stage,target,detail){diagnostic.events.push({stage,target,detail,at:Date.now()});diagnostic.events=diagnostic.events.slice(-20);}\n  try{for(const t of Object.keys(TARGETS)){if(!Array.isArray(CERT_VOCAB[t]))throw new Error('Missing base bank '+t);starter[t]=CERT_VOCAB[t].slice();targets[t]={state:'idle',count:starter[t].length};}}\n  catch(error){diagnostic.state='no-base-bank';diagnostic.error=String(error.message||error);console.error('[english vocab]',error);return;}\n  function snapshot(){return {...diagnostic,load:undefined,count:undefined,loaded:undefined,snapshot:undefined,selected:current(),counts:Object.fromEntries(Object.keys(TARGETS).map(t=>[t,CERT_VOCAB[t].length])),progress:Object.fromEntries(Object.keys(TARGETS).map(t=>{const p=state.certificates?.[t]||{};return [t,{learned:Object.keys(p.learned||{}).length,review:Object.keys(p.review||{}).length,writes:p.writes||0,attempts:p.attempts?.length||0}];})),ui:{view:window.certificateUI?.currentView?.(),pool:document.querySelector('.vocabPoolCount')?.textContent||'',hero:$('certFocus')?.textContent||''}};}\n  function publish(){\n    const t=current(),s=targets[t];diagnostic.state=s?.state||'idle';diagnostic.lastCount=CERT_VOCAB[t]?.length||0;\n    const row=document.querySelector('.vocabFilterRow');\n    if(row){let b=$('fullVocabStatus');if(!b){b=document.createElement('button');b.id='fullVocabStatus';b.type='button';b.style.cssText='border:0;background:transparent;padding:4px 0;color:#756b80;font:inherit;font-size:12px;cursor:pointer';b.onclick=()=>load(current(),true);row.append(b);}\n      const text=s?.state==='ready'?'📚 完整词库 '+s.count.toLocaleString()+' 条':s?.state==='error'?'⚠ 完整词库加载失败 · 点我重试':'📥 正在补全 '+t+' 词库…';\n      if(b.textContent!==text)b.textContent=text;b.dataset.state=s?.state||'idle';}\n    let node=$('englishVocabDiagnostics');if(!node){node=document.createElement('script');node.type='application/json';node.id='englishVocabDiagnostics';document.body.append(node);}\n    const json=JSON.stringify(snapshot());if(node.textContent!==json)node.textContent=json;\n  }\n  function entry(target,source,item){\n    const word=String(item?.word||'').trim();if(!word)return null;\n    const ex=Array.isArray(item?.examples)?item.examples.find(x=>x?.sentence)||item.examples[0]:null;\n    return {id:target+':cefr:'+source+':'+safe(word),word,meaning:String(item?.translation_cn||item?.translation||'').trim()||'（待补释义）',example:String(ex?.sentence||item?.example||'').trim(),translation:String(ex?.translation_cn||ex?.translation||'').trim(),chunk:'',topic:'CEFR '+source,phonetic:String(item?.phonetic||'').trim(),partOfSpeech:String(item?.part_of_speech||'').trim(),cefrLevel:String(item?.cefr_level||source),source:'WordMaster CEFR / CEFR-J / Octanove'};\n  }\n  async function fetchLevel(level,force){\n    if(pendingLevels.has(level))return pendingLevels.get(level);if(levels.has(level)&&!force)return levels.get(level);\n    const task=(async()=>{let error;for(let attempt=1;attempt\u003c=2;attempt++){\n      const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);\n      try{const response=await fetch(API+'?asset=cefr&file='+FILES[level],{cache:force?'reload':'force-cache',signal:controller.signal});diagnostic.levels[level]={status:response.status,attempt};if(!response.ok)throw new Error(level+' HTTP '+response.status);\n        const data=await response.json(),words=Array.isArray(data?.words)?data.words:[];if(words.length\u003cMath.max(50,Math.floor(EXPECTED[level]*.7)))throw new Error(level+' 数据不完整，仅 '+words.length+' 条');\n        diagnostic.levels[level].count=words.length;levels.set(level,words);record('level-ready',level,words.length);publish();return words;\n      }catch(e){error=e;record('level-error',level,String(e.message||e));}finally{clearTimeout(timer);}}\n      throw error;})();pendingLevels.set(level,task);try{return await task;}finally{pendingLevels.delete(level);}\n  }\n  function merge(target,parts){\n    const map=new Map();for(const [source,words] of parts)for(const raw of words){const w=entry(target,source,raw),key=norm(w?.word);if(w&&key&&!map.has(key))map.set(key,w);}\n    // Keep IDs referenced by learned, review, flow and four-pass progress.\n    for(const local of starter[target]){const key=norm(local.word);if(!key)continue;const remote=map.get(key);map.set(key,remote?{...remote,...local,phonetic:remote.phonetic,partOfSpeech:remote.partOfSpeech,cefrLevel:remote.cefrLevel,source:'本地精选卡 + CEFR 完整词库'}:{...local,source:local.source||'本地考试词块'});}return [...map.values()];\n  }\n  function refresh(target){\n    if(current()!==target)return;const result={target,at:Date.now(),called:false,ok:false};diagnostic.refreshes.push(result);diagnostic.refreshes=diagnostic.refreshes.slice(-10);\n    try{if(typeof window.certificateUI?.refresh!=='function')throw new Error('certificateUI.refresh unavailable');result.called=true;window.certificateUI.refresh();result.ok=true;}\n    catch(error){result.error=String(error.message||error);console.error('[english vocab] UI refresh failed',error);}\n    publish();window.dispatchEvent(new CustomEvent('englishvocabularchange',{detail:{target,count:CERT_VOCAB[target].length}}));\n  }\n  async function load(target=current(),force=false){\n    target=String(target).toUpperCase();if(!TARGETS[target])return;if(pendingTargets.has(target))return pendingTargets.get(target);if(targets[target].state==='ready'&&!force){publish();return;}\n    const task=(async()=>{targets[target]={...targets[target],state:'loading',error:null};record('target-start',target,starter[target].length);publish();\n      try{const parts=await Promise.all(TARGETS[target].map(async l=>[l,await fetchLevel(l,force)])),merged=merge(target,parts);const floor=Math.max(500,Math.floor(Math.max(...TARGETS[target].map(l=>EXPECTED[l]))*.45));if(merged.length\u003cfloor)throw new Error('合并后仅 '+merged.length+' 条');\n        CERT_VOCAB[target]=merged;targets[target]={state:'ready',count:merged.length};record('target-ready',target,merged.length);refresh(target);\n      }catch(error){targets[target]={state:CERT_VOCAB[target].length>starter[target].length?'ready':'error',count:CERT_VOCAB[target].length,error:String(error.message||error)};record('target-error',target,targets[target].error);console.error('[english vocab]',error);publish();}\n    })();pendingTargets.set(target,task);try{return await task;}finally{pendingTargets.delete(target);}\n  }\n  Object.assign(diagnostic,{load,count:()=>CERT_VOCAB[current()]?.length||0,loaded:t=>targets[String(t||current()).toUpperCase()]?.state==='ready',snapshot});window.englishFullVocab=diagnostic;\n  // Explicit render events replace the self-triggering DOM observer.\n  window.addEventListener('englishcertificaterender',()=>{publish();if(targets[current()]?.state==='idle')load(current());});\n  document.addEventListener('change',e=>{if(e.target?.id==='certificateSelect')setTimeout(()=>load(current()),0);},true);\n  window.addEventListener('online',()=>load(current()));publish();load(current());\n})();\n\n\n\u003c/script>\n\u003c!-- END full-vocab-v3.js -->\n\u003c!-- BEGIN smart-practice.js -->\n\u003cscript>\n/* Adaptive practice layer: spaced resurfacing, confusion drills, slot drills, dictation and a 10-minute lazy session. */\n(()=>{\n  'use strict';\n  if(window.__englishSmartPractice)return;\n  window.__englishSmartPractice=1;\n\n  const $=id=>document.getElementById(id);\n  const esc=value=>typeof escapeHtml==='function'?escapeHtml(String(value??'')):String(value??'').replace(/[&\u003c>\"']/g,ch=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[ch]));\n  const now=()=>Date.now();\n  const norm=value=>String(value||'').toLowerCase().replace(/[’‘]/g,\"'\").replace(/[^a-z0-9' ]+/g,' ').replace(/\\s+/g,' ').trim();\n  const level=()=>String($('certificateSelect')?.value||'C1');\n  const allBank=()=>Object.values(typeof CERT_VOCAB==='object'&&CERT_VOCAB||{}).flat().filter(Boolean);\n  const bank=()=>Array.isArray(CERT_VOCAB?.[level()])?CERT_VOCAB[level()]:[];\n  const wordByText=text=>allBank().find(w=>norm(w.word)===norm(text));\n  const shuffle=list=>{const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};\n\n  function smart(){\n    state.smartPractice=state.smartPractice||{items:{},confusions:{},stats:{}};\n    state.smartPractice.items=state.smartPractice.items||{};\n    state.smartPractice.confusions=state.smartPractice.confusions||{};\n    state.smartPractice.stats=state.smartPractice.stats||{};\n    return state.smartPractice;\n  }\n  function persist(){try{save();}catch{}}\n  const keyFor=w=>level()+':'+w.id;\n  function progress(){\n    state.certificates=state.certificates||{};\n    const p=state.certificates[level()]=state.certificates[level()]||{};\n    p.learned=p.learned||{};p.review=p.review||{};return p;\n  }\n  function record(w,ok,mode='practice',wrongText='',helped=false,undo=false,token=null){\n    if(!w?.id)return;\n    const s=smart(),key=keyFor(w),r=s.items[key]=s.items[key]||{correct:0,wrong:0,streak:0,last:0,nextAt:0,modes:{}};\n    r.last=now();if(!undo)r.modes[mode]=(Number(r.modes[mode])||0)+1;\n    const p=progress();\n    if(ok){\n      r.correct=(Number(r.correct)||0)+1;r.streak=(Number(r.streak)||0)+1;\n      const gaps=[10*60e3,24*60*60e3,3*24*60*60e3,7*24*60*60e3,14*24*60*60e3];\n      r.nextAt=now()+gaps[Math.min(r.streak-1,gaps.length-1)];\n      if(r.streak>=2)delete p.review[w.id];\n    }else{\n      if(!helped)r.wrong=(Number(r.wrong)||0)+1;else r.looks=(Number(r.looks)||0)+1;if(undo)r.correct=Math.max(0,(Number(r.correct)||0)-1);r.streak=0;r.nextAt=now()+3*60e3;\n      p.review[w.id]=true;delete p.learned[w.id];\n      const wrong=norm(wrongText);\n      if(wrong&&wrong!==norm(w.word)){\n        const pair=[String(w.word||'').trim(),String(wrongText||'').trim()].sort((a,b)=>a.localeCompare(b));\n        const pairKey=pair.join('\\u0000');\n        const c=s.confusions[pairKey]=s.confusions[pairKey]||{a:pair[0],b:pair[1],count:0,last:0};\n        c.count++;c.last=now();\n      }\n    }\n    if(window.StudyMemory){if(undo)window.StudyMemory.downgrade(p,w.id);else window.StudyMemory.review(p,w.id,ok&&!helped,token||('practice:'+now()+':'+Math.random()));r.nextAt=window.StudyMemory.dueAt(p,w.id);}\n    persist();updateBadge();\n  }\n  function promoteDue(){\n    const s=smart(),p=progress(),prefix=level()+':',t=now();let changed=false;\n    for(const [key,r] of Object.entries(s.items)){\n      if(!key.startsWith(prefix)||!r?.nextAt||r.nextAt>t)continue;\n      const id=key.slice(prefix.length);\n      if(!p.review[id]){p.review[id]=true;changed=true;}\n    }\n    if(changed)persist();updateBadge();\n  }\n  function dueCount(){\n    const p=progress();return bank().filter(w=>window.StudyMemory?.due(p,w.id)||(!p.spacedMemory?.cards?.[w.id]&&p.review[w.id])||(p.recognitionQueue?.[w.id]?.due\u003c=(p.recognitionTurns||0)&&!p.spacedMemory?.cards?.[w.id]?.ok)).length;\n  }\n\n  let smartRecent=[];\n  function score(w){\n    const r=smart().items[keyFor(w)]||{};\n    const p=progress();\n    let value=(Number(r.wrong)||0)*4-(Number(r.correct)||0)*.8;\n    if(!r.last)value+=11;\n    if(p.review[w.id])value+=7;\n    if(r.nextAt&&r.nextAt\u003c=now())value+=8;\n    if(!p.learned[w.id])value+=4;\n    if(r.last)value+=Math.min(6,Math.max(0,(now()-r.last)/(6*60*60e3)));\n    value+=Math.random()*4;\n    return value;\n  }\n  function pickWeighted(list=bank(),exclude=''){\n    const pool=list.filter(w=>w?.id&&w.id!==exclude);\n    if(!pool.length)return list[0]||null;\n    const recentLimit=Math.min(8,Math.max(3,Math.floor(list.length*.28)));\n    const fresh=pool.filter(w=>!smartRecent.includes(w.id));\n    const candidates=fresh.length>=Math.min(3,pool.length)?fresh:pool;\n    const sorted=[...candidates].sort((a,b)=>score(b)-score(a));\n    const top=sorted.slice(0,Math.max(5,Math.ceil(sorted.length*.65)));\n    const chosen=top[Math.floor(Math.random()*top.length)]||sorted[0];\n    if(chosen?.id){smartRecent.push(chosen.id);smartRecent=smartRecent.slice(-recentLimit);}\n    return chosen;\n  }\n  function distractors(w,field,count=3){\n    return shuffle(bank().filter(x=>x.id!==w.id&&String(x?.[field]||'').trim()).map(x=>String(x[field]).trim()).filter((v,i,a)=>a.indexOf(v)===i)).slice(0,count);\n  }\n\n  const curated=[\n    ['affect','effect','affect 常作动词“影响”；effect 常作名词“效果 / 影响”。'],\n    ['advice','advise','advice 是名词“建议”；advise 是动词“建议”。'],\n    ['accept','except','accept 是“接受”；except 是“除……之外”。'],\n    ['borrow','lend','borrow 是“借入”；lend 是“借出”。'],\n    ['raise','rise','raise 通常要接宾语；rise 通常是不及物的“上升”。'],\n    ['economic','economical','economic 偏“经济的”；economical 偏“节省的 / 实惠的”。'],\n    ['sensible','sensitive','sensible 是“明智的”；sensitive 是“敏感的”。'],\n    ['compliment','complement','compliment 是“赞美”；complement 是“补充 / 相配”。']\n  ];\n  const curatedMeaning={\n    affect:'影响（动词）',effect:'效果；影响（名词）',advice:'建议（名词）',advise:'建议（动词）',accept:'接受',except:'除……之外',borrow:'借入',lend:'借出',raise:'提高；举起（及物）',rise:'上升（不及物）',economic:'经济的',economical:'节省的；实惠的',sensible:'明智的',sensitive:'敏感的',compliment:'赞美',complement:'补充；相配'\n  };\n  function confusionPool(){\n    const dynamic=Object.values(smart().confusions||{}).sort((a,b)=>(b.count||0)-(a.count||0)).map(c=>[c.a,c.b,'你最近把这两个选项混过，先把差别压实。']);\n    const merged=[...dynamic,...curated];\n    const seen=new Set();return merged.filter(pair=>{const k=[norm(pair[0]),norm(pair[1])].sort().join('|');if(seen.has(k))return false;seen.add(k);return true;});\n  }\n  function meaningOf(term){return wordByText(term)?.meaning||curatedMeaning[norm(term)]||'查看上下文判断';}\n\n  function ensureDialog(){\n    let d=$('smartPracticeDialog');if(d)return d;\n    d=document.createElement('dialog');d.id='smartPracticeDialog';d.className='smartPracticeDialog';document.body.append(d);return d;\n  }\n  function closeDialog(){const d=$('smartPracticeDialog');if(d?.open)d.close();window.englishSpeech?.stop?.();}\n  function shell(title,sub=''){\n    const d=ensureDialog();d.innerHTML='\u003cdiv class=\"smartTop\">\u003cdiv>\u003ch3>'+esc(title)+'\u003c/h3>'+(sub?'\u003cp>'+esc(sub)+'\u003c/p>':'')+'\u003c/div>\u003cbutton class=\"btn\" id=\"smartClose\">关闭\u003c/button>\u003c/div>\u003cdiv id=\"smartBody\">\u003c/div>';d.showModal();$('smartClose').onclick=closeDialog;return $('smartBody');\n  }\n  function speak(text,kind='sentence'){window.englishSpeech?.speak?.(text,{kind});}\n\n  function openDictation(){\n    let kind=localStorage.getItem('lazyEnglishDictationKind')||'word',current=null;\n    const body=shell('🎧 听写模式','听完再核对，答案会停下来等你。');\n    const render=()=>{\n      const list=bank().filter(w=>kind==='word'?String(w.word||'').trim().split(/\\s+/).length===1:kind==='phrase'?String(w.word||'').trim().split(/\\s+/).length>1:!!w.example);\n      current=pickWeighted(list,current?.id);if(!current){body.innerHTML='\u003cp>这一类暂时没内容。\u003c/p>';return;}\n      const target=kind==='sentence'?current.example:current.word,meaning=kind==='sentence'?current.translation:current.meaning;\n      body.innerHTML='\u003cdiv class=\"smartChips\">\u003cbutton data-k=\"word\">单词\u003c/button>\u003cbutton data-k=\"phrase\">短语\u003c/button>\u003cbutton data-k=\"sentence\">句子\u003c/button>\u003c/div>\u003cdiv class=\"smartPrompt\">🔊 听完写下来\u003c/div>\u003cp class=\"smartHint\">'+esc(meaning||'先听，不偷看文字')+'\u003c/p>\u003cdiv class=\"smartActions\">\u003cbutton class=\"btn primary\" id=\"smartPlay\">▶ 播放\u003c/button>\u003cbutton class=\"btn\" id=\"smartSlow\">再听一次\u003c/button>\u003c/div>\u003cinput class=\"certInput smartInput\" id=\"smartInput\" placeholder=\"输入你听到的英文\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\">\u003cbutton class=\"btn primary smartFull\" id=\"smartCheck\">核对\u003c/button>\u003cdiv id=\"smartFeedback\" class=\"smartFeedback\" hidden>\u003c/div>';\n      body.querySelectorAll('[data-k]').forEach(b=>{b.classList.toggle('active',b.dataset.k===kind);b.onclick=()=>{kind=b.dataset.k;localStorage.setItem('lazyEnglishDictationKind',kind);current=null;render();};});\n      $('smartPlay').onclick=()=>speak(target,kind==='sentence'?'sentence':'word');$('smartSlow').onclick=$('smartPlay').onclick;\n      const check=()=>{\n        const actual=$('smartInput').value.trim();if(!actual||$('smartCheck').disabled)return;\n        const ok=norm(actual)===norm(target),fb=$('smartFeedback');fb.hidden=false;fb.className='smartFeedback '+(ok?'good':'bad');\n        $('smartCheck').disabled=true;$('smartInput').disabled=true;record(current,ok,'dictation');\n        fb.innerHTML=(ok?'✓ 对上了。':'再听一眼，答案是：')+'\u003cb>'+esc(target)+'\u003c/b>\u003cp>'+esc(meaning||'')+'\u003c/p>\u003cdiv class=\"smartActions\">\u003cbutton class=\"btn\" id=\"smartReplay\">再听\u003c/button>\u003cbutton class=\"btn primary\" id=\"smartNext\">下一条\u003c/button>\u003c/div>';\n        $('smartReplay').onclick=()=>speak(target,kind==='sentence'?'sentence':'word');$('smartNext').onclick=render;\n      };\n      $('smartCheck').onclick=check;$('smartInput').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)check();};\n\n    };render();\n  }\n\n  function openSlots(){\n    const items=bank().filter(w=>w.word&&w.example&&String(w.example).toLowerCase().includes(String(w.word).toLowerCase()));let current=null;\n    const body=shell('🧩 句型槽位','把词 / 短语放回句子里，核对后再继续。');\n    const render=()=>{\n      current=pickWeighted(items,current?.id);if(!current){body.innerHTML='\u003cp>当前词库里还没有足够的可挖空例句。\u003c/p>';return;}\n      const re=new RegExp(String(current.word).replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&'),'i');\n      const prompt=String(current.example).replace(re,'_____');\n      const opts=shuffle([current.word,...distractors(current,'word',3)]).slice(0,4);\n      body.innerHTML='\u003cdiv class=\"smartPrompt smartSentence\">'+esc(prompt)+'\u003c/div>\u003cp class=\"smartHint\">'+esc(current.translation||'')+'\u003c/p>\u003cdiv class=\"smartOptions\">'+opts.map(x=>'\u003cbutton data-answer=\"'+esc(x)+'\">'+esc(x)+'\u003c/button>').join('')+'\u003c/div>\u003cdiv id=\"smartFeedback\" class=\"smartFeedback\" hidden>\u003c/div>';\n      body.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{\n        const ok=norm(b.dataset.answer)===norm(current.word),fb=$('smartFeedback');fb.hidden=false;b.classList.add(ok?'correct':'wrong');\n        body.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);\n        record(current,false,'slot',ok?'':b.dataset.answer,true);\n        fb.innerHTML='\u003cb>'+esc(current.word)+'\u003c/b> · '+esc(current.meaning)+'\u003cp>'+esc(current.example)+'\u003c/p>\u003cp>'+esc(current.translation||'')+'\u003c/p>\u003cdetails>\u003csummary>其他选项的意思\u003c/summary>'+opts.filter(x=>x!==current.word).map(x=>'\u003cp>'+esc(x)+' · '+esc(meaningOf(x))+'\u003c/p>').join('')+'\u003c/details>\u003cbutton class=\"btn primary\" id=\"smartNext\">下一条\u003c/button>';$('smartNext').onclick=render;\n      });\n    };render();\n  }\n\n  function openConfusion(){\n    const pairs=confusionPool();let index=0;\n    const body=shell('⚡ 易混专项','优先练你自己混过的词，再补一组常见易混项。');\n    const render=()=>{\n      const pair=pairs[index++%pairs.length],target=Math.random()\u003c.5?pair[0]:pair[1],other=target===pair[0]?pair[1]:pair[0],opts=shuffle([target,other]);\n      body.innerHTML='\u003cdiv class=\"smartPrompt\">哪个是「'+esc(meaningOf(target))+'」？\u003c/div>\u003cdiv class=\"smartOptions\">'+opts.map(x=>'\u003cbutton data-answer=\"'+esc(x)+'\">'+esc(x)+'\u003c/button>').join('')+'\u003c/div>\u003cdiv id=\"smartFeedback\" class=\"smartFeedback\" hidden>\u003c/div>';\n      body.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{\n        const ok=norm(b.dataset.answer)===norm(target),fb=$('smartFeedback');fb.hidden=false;b.classList.add(ok?'correct':'wrong');\n        body.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);const w=wordByText(target);if(w)record(w,false,'confusion',ok?'':b.dataset.answer,true);\n        fb.innerHTML='\u003cb>'+esc(target)+'\u003c/b>：'+esc(meaningOf(target))+'\u003cbr>\u003cb>'+esc(other)+'\u003c/b>：'+esc(meaningOf(other))+'\u003cp>'+esc(pair[2]||'')+'\u003c/p>\u003cbutton class=\"btn primary\" id=\"smartNext\">下一条\u003c/button>';$('smartNext').onclick=render;\n      });\n    };render();\n  }\n\n  function openLazy(){\n    const body=shell('轻松学一会儿','先看懂，再慢慢记住。随时可以停。'),p=progress();let current=bank().find(w=>w.id===p.studyFlowTurn?.id);\n    const render=(extra=false)=>{\n      if(window.EnglishLearningFlow.waitForResume(body,p,bank(),level(),()=>{current=bank().find(w=>w.id===p.studyFlowTurn?.id);render()}))return;\n      current=current||window.EnglishLearningFlow.pick(p,bank(),null,extra);\n      if(!current){window.EnglishLearningFlow.rest(body,()=>render(true));return;}\n      window.certificateUI?.resumeWord?.(current.id);\n      window.EnglishLearningFlow.mount({host:body,word:current,bank:bank(),progress:p,save:persist,activity:()=>{touchStreak();const today=dayKey();state.dailyDone[today]=state.dailyDone[today]||{};state.dailyDone[today]['vocab-flow:'+current.id]=true;},next:()=>{current=window.EnglishLearningFlow.pick(p,bank(),current.id);render()}});\n    };\n    const loaded=()=>{if(ensureDialog().open&&body.isConnected){current=bank().find(w=>w.id===p.studyFlowTurn?.id)||current;render()}};window.addEventListener('englishvocabularchange',loaded);\n    ensureDialog().addEventListener('close',()=>{window.removeEventListener('englishvocabularchange',loaded);window.certificateUI?.refresh()},{once:true});render();\n  }\n\n  function updateBadge(){const badge=$('smartAdaptiveBadge');if(badge){const text='🧠 今天到期 '+dueCount();if(badge.textContent!==text)badge.textContent=text;}}\n  function installBar(){\n    if(window.certificateUI?.currentView?.()!=='vocab')return;\n    const row=document.querySelector('.vocabFilterRow');if(!row||$('smartPracticeBar'))return;\n    const bar=document.createElement('div');bar.id='smartPracticeBar';bar.className='smartPracticeBar';\n    bar.innerHTML='\u003cbutton class=\"btn primary\" id=\"smartLazy\">轻松学一会儿\u003c/button>\u003cbutton class=\"btn\" id=\"smartDictation\">🎧 听写\u003c/button>\u003cbutton class=\"btn\" id=\"smartSlots\">🧩 句型槽位\u003c/button>\u003cbutton class=\"btn\" id=\"smartConfusion\">⚡ 易混专项\u003c/button>\u003cspan id=\"smartAdaptiveBadge\">🧠 自适应回流\u003c/span>';\n    row.after(bar);$('smartLazy').onclick=openLazy;$('smartDictation').onclick=openDictation;$('smartSlots').onclick=openSlots;$('smartConfusion').onclick=openConfusion;updateBadge();\n  }\n\n  window.addEventListener('englishrecognition',event=>{const d=event.detail;record(d.word,d.ok,'recognition:'+d.kind,d.wrongWord||'',!!d.helped,!!d.undo,d.token);});\n  document.addEventListener('click',event=>{\n    const w=window.certificateUI?.currentWord?.();if(!w)return;\n    const choice=event.target.closest?.('.vocabSwipeChoice');\n    if(choice){const ok=choice.dataset.correct==='true';const wrong=ok?'':choice.textContent.replace(/^\\s*(?:←\\s*左|右\\s*→)\\s*/,'').trim();record(w,ok,'flow',wrong);return;}\n    if(event.target.closest?.('#vocabReview')){record(w,false,'manual-review');return;}\n    if(event.target.closest?.('#vocabKnown')){record(w,true,'known');return;}\n    if(event.target.closest?.('#vocabCheck')){\n      const id=w.id;setTimeout(()=>{const current=window.certificateUI?.currentWord?.();if(current?.id!==id)return;const fb=$('vocabFeedback');if(!fb||fb.hidden)return;if(fb.classList.contains('good'))record(w,true,'spell');else if(fb.classList.contains('bad'))record(w,false,'spell');},450);\n    }\n  },true);\n\n  const style=document.createElement('style');style.textContent=`\n  .smartPracticeBar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 14px}.smartPracticeBar .btn{min-height:38px}.smartPracticeBar span{font-size:12px;color:#756b80;margin-left:auto}\n  .smartPracticeDialog{width:min(680px,calc(100vw - 24px));max-height:min(82vh,760px);border:0;border-radius:22px;padding:0;background:#fbf9fd;color:inherit;box-shadow:0 24px 80px rgba(42,26,58,.25)}.smartPracticeDialog::backdrop{background:rgba(35,24,44,.34);backdrop-filter:blur(3px)}\n  .smartTop{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;padding:18px 18px 10px}.smartTop h3{margin:0;font-size:20px}.smartTop p{margin:5px 0 0;color:#796e82;font-size:13px}#smartBody{padding:8px 18px 20px}\n  .smartPrompt{font-size:clamp(26px,6vw,42px);font-weight:750;line-height:1.3;text-align:center;padding:28px 12px 16px}.smartPrompt.smartSentence{font-size:clamp(20px,4.2vw,30px);text-align:left}.smartHint{text-align:center;color:#7a6f82;min-height:22px}.smartMiniLabel{text-align:center;font-size:12px;color:#7a6f82;margin-top:8px}\n  .smartOptions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.smartOptions button,.smartChips button{border:1px solid rgba(126,96,158,.18);background:#fff;color:inherit;border-radius:14px;padding:13px 12px;font:inherit}.smartOptions button.correct{background:#edf8ef;border-color:#8cc69a}.smartOptions button.wrong{background:#fff0f2;border-color:#dc9da8}.smartOptions button:disabled{opacity:.78}.smartChips{display:flex;gap:8px;flex-wrap:wrap}.smartChips button{padding:8px 12px;border-radius:999px}.smartChips button.active{background:#805ad5;color:#fff;border-color:#805ad5}\n  .smartActions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}.smartFull{width:100%;margin-top:10px}.smartInput{margin-top:10px}.smartFeedback{margin-top:12px;padding:12px;border-radius:14px;background:#f1edf5}.smartFeedback.good{background:#edf8ef}.smartFeedback.bad{background:#fff0f2}.smartSessionMeta{display:flex;justify-content:space-between;color:#6f6477;font-size:13px}.smartFinish{text-align:center;padding:30px 8px}.smartFinish b{font-size:24px}\n  @media(max-width:540px){.smartOptions{grid-template-columns:1fr}.smartPracticeBar span{width:100%;margin-left:0}.smartPracticeDialog{border-radius:18px}}\n  `;document.head.append(style);\n\n  window.englishSmartPractice={openLazy,openDictation,openSlots,openConfusion,promoteDue,dueCount};\n  window.addEventListener('englishcertificaterender',()=>{installBar();promoteDue();});\n  setInterval(promoteDue,60000);setTimeout(()=>{promoteDue();installBar();},120);\n})();\n\n\n\u003c/script>\n\u003c!-- END smart-practice.js -->\n\u003c!-- BEGIN learning-coach.js -->\n\u003cscript>\n/* Proactive learning coach: turns progress + exam plan into one concrete next route. */\n(()=>{\n  'use strict';\n  if(window.__englishLearningCoach)return;\n  window.__englishLearningCoach=1;\n\n  const INTENSITY={\n    low:{label:'轻松一点',newCap:5,reviewCap:12,note:'今天少认识几个，随时可以停。'},\n    normal:{label:'正常',newCap:10,reviewCap:24,note:'先回顾到期内容，再认识几个新词。'},\n    high:{label:'多学一点',newCap:20,reviewCap:40,note:'有余力就多认识几个，复习仍然优先。'}\n  };\n  const KEY='lazyEnglishCoachIntensity';\n  const $=id=>document.getElementById(id);\n  const esc=value=>String(value??'').replace(/[&\u003c>\"']/g,ch=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[ch]));\n  const goal=()=>{try{return typeof getGoal==='function'?getGoal():String($('certificateSelect')?.value||'C1');}catch{return 'C1';}};\n  const todayKey=()=>new Date().toLocaleDateString('sv-SE');\n  const intensity=()=>INTENSITY[localStorage.getItem(KEY)]?localStorage.getItem(KEY):'normal';\n\n  function examPlan(){\n    try{return typeof loadExamPlan==='function'?(loadExamPlan()||{}):{};}catch{return {};}\n  }\n  function daysLeft(date){\n    if(!date)return null;\n    try{return typeof daysUntil==='function'?daysUntil(date):Math.ceil((new Date(date+'T00:00:00')-new Date().setHours(0,0,0,0))/86400000);}catch{return null;}\n  }\n  function progress(){\n    const level=goal();\n    const bank=Array.isArray(CERT_VOCAB?.[level])?CERT_VOCAB[level]:[];\n    const p=state?.certificates?.[level]||{};\n    const learned=p.learned||{},review=p.review||{};\n    const known=bank.reduce((n,w)=>n+(learned[w.id]?1:0),0);\n    const due=bank.filter(w=>window.StudyMemory?.due(p,w.id)||(!p.spacedMemory?.cards?.[w.id]&&review[w.id])).length;\n    const seenIds=new Set(Object.keys(state?.smartPractice?.items||{}).filter(k=>k.startsWith(level+':')).map(k=>k.slice(level.length+1)));\n    const practiced=bank.filter(w=>seenIds.has(w.id)||p.flow?.[w.id]?.introduced).length;\n    const today=Object.keys(state?.dailyDone?.[todayKey()]||{}).length;\n    const fullReady=!!(window.englishFullVocab?.loaded?.(level)||bank.length>100);\n    return {level,bank,total:bank.length,known,due,practiced,today,fullReady,p};\n  }\n  function weakWords(s){\n    const items=state?.smartPractice?.items||{};\n    const prefix=s.level+':';\n    const ranked=Object.entries(items)\n      .filter(([k,r])=>k.startsWith(prefix)&&Number(r?.wrong||0)>0)\n      .sort((a,b)=>(Number(b[1]?.wrong||0)-Number(a[1]?.wrong||0))||((Number(b[1]?.last||0))-(Number(a[1]?.last||0))))\n      .slice(0,3)\n      .map(([k])=>{\n        const id=k.slice(prefix.length);return s.bank.find(w=>w.id===id)?.word||'';\n      }).filter(Boolean);\n    return ranked;\n  }\n  function route(s){\n    const mode=INTENSITY[intensity()];const plan=examPlan();const left=daysLeft(plan.targetDate);\n    const remaining=Math.max(0,s.total-s.practiced);\n    let newTarget=mode.newCap;\n    if(left!==null&&left>0&&s.fullReady){\n      const learningDays=Math.max(1,Math.floor(left*.65));\n      newTarget=Math.min(mode.newCap,Math.max(4,Math.ceil(remaining/learningDays)));\n    }\n    const reviewTarget=Math.min(mode.reviewCap,s.due);\n    const weak=weakWords(s);\n    const steps=[];\n    if(reviewTarget>0)steps.push({icon:'🧠',title:'先回流 '+reviewTarget+' 个',sub:'先遇见今天该回顾的，想不起来就看提示。'});\n    else steps.push({icon:'🌊',title:'先刷 '+newTarget+' 个新内容',sub:s.fullReady?'先看意思和例句，过几张再试着想起来。':'完整词库还在后台补，先维持手感。'});\n    steps.push({icon:'🎧',title:'有余力，再听一听',sub:'这是可选练习，不用每次都做。'});\n    if(plan.registered||((left??999)\u003c=60))steps.push({icon:'📝',title:'加一段考试输出',sub:'想检验应用时，再做一道模拟题或练一小段写作。'});\n    else steps.push({icon:'🧩',title:'做句型槽位 / 易混专项',sub:'遇到容易混的词，再比较它们的意思。'});\n    return {mode,plan,left,newTarget,reviewTarget,weak,steps};\n  }\n\n  function install(){\n    if($('learningCoach'))return $('learningCoach');\n    const nav=document.querySelector('.learningNav');if(!nav)return null;\n    const box=document.createElement('section');box.id='learningCoach';box.className='learningCoach';nav.after(box);return box;\n  }\n  function openGoalPlanner(){\n    const panel=$('goalPanel');if(panel){panel.classList.add('show');panel.scrollIntoView({behavior:'smooth',block:'start'});}\n  }\n  function openVocab(){\n    const tab=document.querySelector('#learningTabs [data-view=\"vocab\"]');tab?.click();\n  }\n  function startMain(s,r){\n    openVocab();\n    setTimeout(()=>{\n      const api=window.englishSmartPractice;\n      if(api?.openLazy){api.openLazy();return;}\n      const flow=document.querySelector('[data-vocab-mode=\"flow\"]');flow?.click();\n      try{toast?.('先从词流开始，专项模块加载好后会自动出现');}catch{}\n    },80);\n  }\n  function bind(box,s,r){\n    box.querySelectorAll('[data-intensity]').forEach(button=>button.onclick=()=>{\n      localStorage.setItem(KEY,button.dataset.intensity);render(true);\n    });\n    box.querySelector('[data-coach-start]')?.addEventListener('click',()=>startMain(s,r));\n    box.querySelector('[data-coach-dictation]')?.addEventListener('click',()=>{openVocab();setTimeout(()=>window.englishSmartPractice?.openDictation?.(),80);});\n    box.querySelector('[data-coach-plan]')?.addEventListener('click',openGoalPlanner);\n    box.querySelector('[data-coach-refresh]')?.addEventListener('click',()=>render(true));\n    const details=box.querySelector('.coachDetails');\n    if(details)details.ontoggle=()=>localStorage.setItem('lazyEnglishCoachExpanded',details.open?'1':'0');\n  }\n  function render(force=false){\n    const box=install();if(!box)return;\n    const s=progress(),r=route(s),modeKey=intensity();\n    const coverage=s.total?Math.round(s.known/s.total*100):0;\n    const exam=r.plan.targetDate?(r.left===null?'考试日已设':r.left>0?'距考试 '+r.left+' 天':r.left===0?'今天考试':'考试日期已过'):'还没锁考试日';\n    const weak=r.weak.length?'最近可以再认认：'+r.weak.join(' · '):'暂时没有形成明显的顽固错词。';\n    const signature=[s.level,s.total,s.known,s.due,s.today,r.left,r.plan.registered,modeKey,r.weak.join('|'),window.englishFullVocab?.loaded?.(s.level)].join(':');\n    if(!force&&box.dataset.signature===signature)return;box.dataset.signature=signature;\n    const expanded=box.querySelector('.coachDetails')?.open??(localStorage.getItem('lazyEnglishCoachExpanded')==='1');\n    box.innerHTML=`\n      \u003cdiv class=\"coachHead\">\u003cdiv>\u003cb>🧭 七的学习教练\u003c/b>\u003cspan>${esc(s.level)} · ${esc(exam)}\u003c/span>\u003c/div>\u003cbutton type=\"button\" class=\"coachGhost\" data-coach-refresh aria-label=\"刷新今日学习路线\">↻\u003c/button>\u003c/div>\n      \u003cdiv class=\"coachCompact\">\u003cp>\u003cstrong>${s.total.toLocaleString()} 个词 / 词块\u003c/strong>\u003cspan>今天到期 ${s.due} · 多次回忆 ${coverage}% · 今天新认识 ${s.p.studyDay?.date===todayKey()?s.p.studyDay.newIds.length:0} · 自己想起 ${s.p.studyDay?.date===todayKey()?s.p.studyDay.recalled:0}\u003c/span>\u003c/p>\u003cbutton type=\"button\" class=\"btn primary\" data-coach-start>学一小会儿\u003c/button>\u003c/div>\n      \u003cdetails class=\"coachDetails\" ${expanded?'open':''}>\u003csummary>今日路线 / 学习强度 \u003cspan>${esc(r.mode.label)}\u003c/span>\u003c/summary>\n      \u003cdiv class=\"coachIntensity\">\u003cspan>今天强度\u003c/span>${Object.entries(INTENSITY).map(([k,v])=>`\u003cbutton type=\"button\" data-intensity=\"${k}\" class=\"${k===modeKey?'active':''}\">${esc(v.label)}\u003c/button>`).join('')}\u003c/div>\n      \u003cp class=\"coachNote\">${esc(r.mode.note)} ${esc(weak)}\u003c/p>\n      \u003cdiv class=\"coachRoute\">${r.steps.map((x,i)=>`\u003cdiv class=\"coachStep\">\u003ci>${i+1}\u003c/i>\u003cspan>${x.icon}\u003c/span>\u003cdiv>\u003cb>${esc(x.title)}\u003c/b>\u003csmall>${esc(x.sub)}\u003c/small>\u003c/div>\u003c/div>`).join('')}\u003c/div>\n      \u003cdiv class=\"coachActions\">\u003cbutton type=\"button\" class=\"btn\" data-coach-dictation>🎧 直接听写\u003c/button>\u003cbutton type=\"button\" class=\"btn\" data-coach-plan>${r.plan.targetDate?'📅 调整考试计划':'📅 先定考试日'}\u003c/button>\u003c/div>\n      \u003cdiv class=\"coachFoot\">${s.fullReady?'完整词库已接入今日规划。':'词库正在补全，先练当前内容。'}\u003c/div>\u003c/details>`;\n    bind(box,s,r);\n  }\n\n  const style=document.createElement('style');style.textContent=`\n    .learningCoach{background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(246,240,253,.96));border:1px solid #eadff2;border-radius:20px;padding:14px;margin:0 0 13px;box-shadow:0 8px 24px rgba(70,48,95,.07)}\n    .coachHead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.coachHead b{display:block;font-size:15px}.coachHead span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.coachGhost{border:0;background:#f1eaf7;color:#705786;border-radius:999px;width:34px;height:34px;font-size:14px}\n    .coachSummary{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:11px 0}.coachSummary div{background:#fff;border:1px solid #eee7f4;border-radius:12px;padding:8px;text-align:center}.coachSummary strong{display:block;font-size:14px}.coachSummary span{display:block;font-size:10px;color:var(--muted);margin-top:2px}\n    .coachIntensity{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.coachIntensity>span{font-size:11px;color:var(--muted);margin-right:2px}.coachIntensity button{border:1px solid #e6dced;background:#fff;color:#6c5878;border-radius:999px;padding:7px 9px;font:inherit;font-size:11px}.coachIntensity button.active{background:#765a92;color:#fff;border-color:#765a92}.coachNote{font-size:11px!important;line-height:1.55!important;color:#74677d;margin:9px 0!important}\n    .coachRoute{display:grid;gap:7px}.coachStep{display:grid;grid-template-columns:25px 24px 1fr;align-items:center;gap:7px;background:rgba(255,255,255,.72);border:1px solid #eee7f4;border-radius:13px;padding:8px}.coachStep i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#eee5f7;color:#6b5182;font:700 11px system-ui;font-style:normal}.coachStep>span{font-size:18px}.coachStep b{display:block;font-size:12px}.coachStep small{display:block;color:var(--muted);font-size:10px;line-height:1.4;margin-top:2px}\n    .coachActions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.coachActions .btn{min-height:40px;padding:8px 10px;font-size:11px;flex:1;min-width:120px}.coachFoot{font-size:10px;color:#8a7d91;margin-top:8px}\n    .coachHead span{font-size:13px}.coachGhost{width:40px;height:40px}.coachCompact{display:flex;align-items:center;gap:14px;margin:8px 0}.coachCompact p{margin:0!important;flex:1;line-height:1.6!important;font-size:14px!important}.coachCompact strong,.coachCompact span{display:block}.coachCompact span{color:var(--muted);font-size:13px}.coachCompact .btn{font-size:14px;min-height:44px;white-space:nowrap}\n    .coachDetails{border-top:1px solid #eadff2;margin-top:10px}.coachDetails summary{cursor:pointer;min-height:42px;padding:10px 0;font-size:14px;color:#675078}.coachDetails summary>span{float:right;color:var(--muted);font-size:13px}.coachDetails .coachIntensity{margin-top:7px}.coachIntensity button{font-size:14px;min-height:40px}.coachIntensity>span{font-size:14px}.coachNote{font-size:14px!important}.coachStep b{font-size:14px}.coachStep small{font-size:13px;line-height:1.6}.coachActions .btn{font-size:14px;min-height:44px}.coachFoot{font-size:12px}\n    @media(max-width:520px){.coachSummary{grid-template-columns:1fr 1fr}.coachActions .btn{min-width:45%}}\n  `;document.head.append(style);\n\n  document.addEventListener('click',event=>{\n    if(event.target.closest?.('#vocabKnown,#vocabReview,#vocabFlowNext,.vocabSwipeChoice,#smartCheck,#smartLazyNext,#mockSubmit,#registerExam,#chooseExam'))setTimeout(()=>render(true),350);\n  },true);\n  document.addEventListener('change',event=>{if(event.target?.id==='certificateSelect')setTimeout(()=>render(true),180);},true);\n  window.addEventListener('online',()=>setTimeout(()=>render(true),600));\n  window.addEventListener('englishvocabularchange',()=>render(true));\n  setInterval(()=>render(false),5000);\n  setTimeout(()=>render(true),250);\n})();\n\n\n\u003c/script>\n\u003c!-- END learning-coach.js -->\n\u003c/body>\n\u003c/html>\n\n\n";
async function request(body){const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:AbortSignal.timeout(15000)});const d=await r.json();if(!r.ok)throw new Error(d.error||"暂时无法登录");return d;}
function openSite(token){localStorage.setItem(key,token);document.open();document.write(original);document.close();}
document.getElementById("gate").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("enter"),error=document.getElementById("error");b.disabled=true;error.textContent="正在登录…";try{const d=await request({action:"login",code:document.getElementById("code").value});openSite(d.token);}catch(e){error.textContent=e.name==="TimeoutError"?"连接超时，请再试一次":e.message;b.disabled=false;}};
(async()=>{const token=localStorage.getItem(key);if(!token){document.getElementById("error").textContent="";return;}try{await request({action:"verify",token});openSite(token);}catch(e){if(e.message.includes("过期"))localStorage.removeItem(key);document.getElementById("error").textContent="请重新输入访问码，或检查网络后刷新。";}})();
</script></body></html>
