tant}.vocabHead .btn{min-height:44px;font-size:14px}\n.vocabAITools{position:relative}.vocabAITools summary{cursor:pointer;border:1px solid #e7dfee;border-radius:12px;background:#f6f1fa;padding:11px;font-size:14px;min-height:44px;box-sizing:border-box}.vocabAITools>div{position:absolute;right:0;top:calc(100% + 6px);z-index:12;background:#fff;border:1px solid #e7dfee;border-radius:14px;padding:9px;box-shadow:0 10px 28px #59406b24;min-width:220px;display:grid;gap:8px}\n.vocabModeChip{font-size:14px;min-height:44px}.vocabFilterRow{flex-wrap:wrap;gap:8px}.vocabFilterRow select{font-size:14px;min-height:44px}.vocabPoolCount{font-size:13px}.vocabFlowMiniTools .btn{font-size:13px;min-height:44px}.vocabFlowStage{font-size:13px}.vocabFlowSub{font-size:14px!important}.vocabFlowReveal small{font-size:13px}.vocabFlowReveal p{font-size:15px!important}\n.vocabBrowser{padding:14px;margin:12px 0 16px;background:#f8f4fc;border:1px solid #e6dceb;border-radius:16px}.vocabBrowserHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.vocabBrowserHead label{font-size:15px;font-weight:700}.vocabBrowserHead .btn{min-height:40px;padding:8px 13px;font-size:14px}\n.vocabSearchRow{display:flex;gap:8px}.vocabSearchRow input,.vocabSearchRow select{font:inherit;font-size:14px;border:1px solid #dcd0e5;border-radius:11px;padding:11px;background:#fff;min-height:44px;color:var(--ink)}.vocabSearchRow input{flex:1;min-width:0}.vocabSearchRow select{max-width:145px}\n#vocabSearchCount{font-size:13px;line-height:1.5;color:var(--muted);margin:9px 0}.vocabBrowser .certList{max-height:320px;overscroll-behavior:contain;gap:8px}.vocabBrowser #vocabResults{display:grid;gap:8px}.vocabBrowser [data-vocab]{display:grid;grid-template-columns:minmax(110px,1fr) 1.3fr;gap:12px;align-items:center;width:100%;font:14px/1.5 system-ui;padding:11px;background:#fff}.vocabBrowser [data-vocab] b{font-size:16px;overflow-wrap:anywhere}.vocabBrowser [data-vocab] small{display:block;font-size:12px;color:var(--muted);margin-top:2px}.vocabSearchEmpty{font-size:14px!important;line-height:1.65!important;padding:9px}\n.vocabBrowser button:focus-visible,.vocabSearchRow input:focus-visible,.vocabSearchRow select:focus-visible,.vocabModeChip:focus-visible,.coachDetails summary:focus-visible{outline:3px solid #a68bd0;outline-offset:2px}#vocabContent:focus{outline:none}\n@media(max-width:520px){.vocabBrowser{padding:11px}.vocabSearchRow{flex-direction:column}.vocabSearchRow select{max-width:none;width:100%}.vocabHead>div:first-child{flex-basis:100%}.vocabAITools{margin-left:auto}.vocabBrowser [data-vocab]{grid-template-columns:1fr;gap:4px}.vocabModeTabs{grid-template-columns:repeat(4,1fr)}.vocabModeChip{padding:10px 3px;font-size:13px}}\n\n\n\u003c/style>\n\u003c!-- END study-ui.css -->\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n  \u003cdiv class=\"top\">\n    \u003cdiv>\n      \u003ch1>懒人英语语言包 🚬\u003c/h1>\n      \u003cdiv class=\"sub\">日常能用，考证能练。按你的节奏来。\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"topActions\">\n      \u003cbutton class=\"iconBtn\" id=\"cloudToggle\">☁ 同步\u003c/button>\n      \u003cbutton class=\"iconBtn\" id=\"goalToggle\">🏆 C1\u003c/button>\n      \u003cbutton class=\"iconBtn\" id=\"chunkToggle\">📦 零件箱\u003c/button>\n      \u003cbutton class=\"iconBtn\" id=\"speechToggle\" aria-expanded=\"false\" aria-controls=\"speechPanel\">🔊 发音\u003c/button>\n      \u003cbutton class=\"iconBtn\" id=\"apiToggle\">⚙ API\u003c/button>\n      \u003cdiv class=\"badge\" id=\"streak\">🔥 0 天\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"panel\" id=\"speechPanel\">\n    \u003ch3>🔊 英语发音\u003c/h3>\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"speechWords\">单词发音\u003c/label>\n      \u003cselect id=\"speechWords\">\u003coption value=\"recording\">优先词典录音（推荐）\u003c/option>\u003coption value=\"system\">只用设备朗读\u003c/option>\u003c/select>\n    \u003c/div>\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"speechAccent\">口音\u003c/label>\n      \u003cselect id=\"speechAccent\">\u003coption value=\"auto\">自动选择\u003c/option>\u003coption value=\"en-GB\">英式英语\u003c/option>\u003coption value=\"en-US\">美式英语\u003c/option>\u003c/select>\n    \u003c/div>\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"speechVoice\">词块 / 整句声音\u003c/label>\n      \u003cselect id=\"speechVoice\" style=\"width:100%;min-width:0;text-overflow:ellipsis\">\u003coption value=\"\">自动选择（推荐）\u003c/option>\u003c/select>\n    \u003c/div>\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"speechRate\">句子语速（单词会稍慢一点）\u003c/label>\n      \u003cselect id=\"speechRate\">\u003coption value=\"0.85\">慢速 · 0.85×\u003c/option>\u003coption value=\"0.95\" selected>清晰 · 0.95×\u003c/option>\u003coption value=\"1.05\">自然练习 · 1.05×\u003c/option>\u003c/select>\n    \u003c/div>\n    \u003cdiv class=\"syncButtons\">\n      \u003cbutton class=\"btn\" id=\"speechPreviewWord\">试听单词\u003c/button>\n      \u003cbutton class=\"btn primary\" id=\"speechPreviewSentence\">试听整句\u003c/button>\n      \u003cbutton class=\"btn\" id=\"speechStop\">停止播放\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"settingNote\" id=\"speechCurrent\">\u003c/div>\n    \u003cdiv class=\"settingNote\">单词优先按原速播放词典录音；词块、整句和录音暂不可用时，只使用设备提供的英语声音。设置保存在这台设备，不消耗你配置的 AI 额度。\u003c/div>\n    \u003cdiv class=\"settingNote\" id=\"speechStatus\" role=\"status\" aria-live=\"polite\">\u003c/div>\n    \u003ca class=\"settingNote\" id=\"speechRecordingSource\" target=\"_blank\" rel=\"noopener noreferrer\" hidden>录音来源\u003c/a>\n  \u003c/div>\n\n  \u003cdiv class=\"panel\" id=\"cloudPanel\">\n    \u003ch3>☁ 学习进度云同步\u003c/h3>\n    \u003cdiv class=\"cloudStatus\">\n      \u003cb id=\"cloudState\">还没开云同步\u003c/b>\n      \u003cspan id=\"cloudLast\">仅同步学习数据\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"field\">\n      \u003clabel>同步码（另一台设备填同一个码，就能接上同一份进度）\u003c/label>\n      \u003cdiv class=\"syncCodeRow\">\n        \u003cinput id=\"syncCode\" placeholder=\"点击生成，或者粘贴已有同步码\" autocomplete=\"off\">\n        \u003cbutton class=\"btn\" id=\"generateSync\">生成\u003c/button>\n        \u003cbutton class=\"btn\" id=\"copySync\">复制\u003c/button>\n      \u003c/div>\n    \u003c/div>\n    \u003clabel class=\"syncAuto\">\u003cinput id=\"autoSync\" type=\"checkbox\" checked> 自动同步：学习记录变化后悄悄上传，打开网页时自动对一下云端\u003c/label>\n    \u003cdiv class=\"syncButtons\">\n      \u003cbutton class=\"btn primary\" id=\"syncNow\">☁ 立即同步\u003c/button>\n      \u003cbutton class=\"btn\" id=\"pullCloud\">⬇ 云端覆盖本机\u003c/button>\n      \u003cbutton class=\"btn\" id=\"pushCloud\">⬆ 本机覆盖云端\u003c/button>\n      \u003cbutton class=\"btn bad\" id=\"disableCloud\">停用本机同步\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"settingNote\">会同步：手写次数、复习状态、词块、考证目标和报名计划。不会同步 API Key。同步码相当于这份数据的钥匙，别随手发群里，除非你想体验多人协作背英语这种新型灾难。\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"panel\" id=\"goalPanel\">\n    \u003ch3>🏆 考证装逼主线\u003c/h3>\n    \u003cdiv class=\"goalHero\">\n      \u003cdiv class=\"goalTop\">\n        \u003cdiv>\n          \u003cdiv class=\"goalTitle\" id=\"goalTitle\">C1 Advanced\u003c/div>\n          \u003cdiv class=\"goalSub\" id=\"goalSubtitle\">目标：学到能优雅地只报证书名，不解释。\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"goalPercent\" id=\"goalPercent\">0%\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"goalBar\">\u003cdiv class=\"goalFill\" id=\"goalFill\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"goalStages\">\n        \u003cbutton class=\"goalStage\" data-goal=\"B1\">B1\u003c/button>\n        \u003cbutton class=\"goalStage\" data-goal=\"B2\">B2 First\u003c/button>\n        \u003cbutton class=\"goalStage active\" data-goal=\"C1\">C1 Advanced\u003c/button>\n        \u003cbutton class=\"goalStage\" data-goal=\"C2\">C2 Proficiency\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"goalGrid\">\n        \u003cdiv class=\"goalMetric\">\u003cb id=\"goalWrites\">0\u003c/b>\u003cspan>累计练习\u003c/span>\u003c/div>\n        \u003cdiv class=\"goalMetric\">\u003cb id=\"goalChunks\">0\u003c/b>\u003cspan>词块积累\u003c/span>\u003c/div>\n        \u003cdiv class=\"goalMetric\">\u003cb id=\"goalCoverage\">0%\u003c/b>\u003cspan>当前题库覆盖\u003c/span>\u003c/div>\n        \u003cdiv class=\"goalMetric\">\u003cb id=\"goalStreak\">0 天\u003c/b>\u003cspan>连续学习\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"goalDisclaimer\">这是你的学习进度条，不是官方 CEFR 能力估分。真要判断等级，最后还得靠对应考试或完整模拟题。人类可以虚荣，但统计口径不能胡来。\u003c/div>\n\n      \u003cdiv class=\"examBox\">\n        \u003cdiv class=\"examHead\">\n          \u003cb>📅 报考雷达\u003c/b>\n          \u003cspan class=\"examSync\" id=\"examSync\">正在读取官方日期…\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"examNext\" id=\"examNext\">加载中\u003c/div>\n        \u003cdiv class=\"examDates\" id=\"examDates\">\u003c/div>\n        \u003cdiv class=\"examActions\">\n          \u003cbutton class=\"btn\" id=\"chooseExam\">🎯 设为目标场次\u003c/button>\n          \u003cbutton class=\"btn\" id=\"calendarExam\">🗓 导入日历提醒\u003c/button>\n          \u003cbutton class=\"btn primary\" id=\"registerExam\">✅ 我已经报名\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"examMeta\" id=\"examMeta\">报名截止通常由授权考试中心决定，不能拿全球考试日历硬猜。\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"trainingBox\" id=\"trainingBox\">\n        \u003cdiv class=\"examHead\">\n          \u003cb>🔥 已报名 · 考试特训\u003c/b>\n          \u003cspan class=\"examSync\" id=\"examCountdown\">\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"trainingGrid\">\n          \u003cbutton class=\"trainBtn\" data-train=\"use\">\u003cb>Reading & Use of English\u003c/b>\u003cspan>词块、完形、构词、句型转换\u003c/span>\u003c/button>\n          \u003cbutton class=\"trainBtn\" data-train=\"writing\">\u003cb>Writing\u003c/b>\u003cspan>限时审题、结构和表达\u003c/span>\u003c/button>\n          \u003cbutton class=\"trainBtn\" data-train=\"listening\">\u003cb>Listening\u003c/b>\u003cspan>听辨态度、细节和信息\u003c/span>\u003c/button>\n          \u003cbutton class=\"trainBtn\" data-train=\"speaking\">\u003cb>Speaking\u003c/b>\u003cspan>1 分钟长答、比较和协作\u003c/span>\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"trainOutput\" id=\"trainOutput\">\u003c/div>\n        \u003cbutton class=\"btn\" id=\"trainingMemory\" style=\"margin-top:10px\">选一句特训表达，练四遍\u003c/button>\n        \u003cdiv class=\"examMeta\">C1 Advanced 当前官方结构是 4 个部分：Reading & Use of English 90 分钟、Writing 90 分钟、Listening 约 40 分钟、Speaking 通常两人约 15 分钟。特训会优先按你选的目标等级生成。\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"panel\" id=\"apiPanel\">\n    \u003ch3>\u003cspan class=\"statusDot\" id=\"apiDot\">\u003c/span>外接 API\u003c/h3>\n    \u003cdiv class=\"field\">\n      \u003clabel>Base URL（OpenAI 兼容，例如 https://xxx/v1）\u003c/label>\n      \u003cinput id=\"apiBase\" placeholder=\"https://example.com/v1\" autocomplete=\"off\">\n    \u003c/div>\n    \u003cdiv class=\"fieldRow\">\n      \u003cdiv class=\"field\">\n        \u003clabel>API Key\u003c/label>\n        \u003cinput id=\"apiKey\" type=\"password\" placeholder=\"sk-...\" autocomplete=\"off\">\n      \u003c/div>\n      \u003cdiv class=\"field\">\n        \u003clabel>模型\u003c/label>\n        \u003cdiv class=\"modelStack\">\n          \u003cinput id=\"modelSearch\" placeholder=\"筛选已拉取的模型…\" aria-label=\"筛选模型\" type=\"search\" autocomplete=\"off\">\n          \u003cselect id=\"apiModelSelect\">\n            \u003coption value=\"\">先点「拉取模型」\u003c/option>\n          \u003c/select>\n          \u003cinput id=\"apiModel\" placeholder=\"也可以手动填模型名\" autocomplete=\"off\">\n        \u003c/div>\n        \u003cdiv class=\"modelHint\" id=\"modelHint\">拉取后从上面的下拉框直接选，手机端也能正常点。\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"row\">\n      \u003cbutton class=\"btn primary\" id=\"saveApi\">💾 保存到本机\u003c/button>\n      \u003cbutton class=\"btn\" id=\"fetchModels\">↻ 拉取模型\u003c/button>\n      \u003cbutton class=\"btn\" id=\"testApi\">🧪 测试\u003c/button>\n      \u003cbutton class=\"btn bad\" id=\"clearApi\">清除\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"settingNote\">配置只保存在当前浏览器的 localStorage，不会写进 GitHub 仓库。点「拉取模型」会请求 Base URL 的 /models；公益站需要允许浏览器跨域访问（CORS）。\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"panel\" id=\"chunkPanel\">\n    \u003ch3>📦 语言零件箱\u003c/h3>\n    \u003cdiv class=\"chunkList\" id=\"chunkList\">\u003c/div>\n    \u003cdiv class=\"settingNote\">这里收的是你真正遇到过的词块，不是把整本词典塞进脑子里折磨自己。\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"learningNav\">\n    \u003cdiv class=\"field\">\u003clabel for=\"certificateSelect\">当前考证目标\u003c/label>\u003cselect id=\"certificateSelect\">\u003coption value=\"B1\">B1 Preliminary\u003c/option>\u003coption value=\"B2\">B2 First\u003c/option>\u003coption value=\"C1\">C1 Advanced\u003c/option>\u003coption value=\"C2\">C2 Proficiency\u003c/option>\u003c/select>\u003c/div>\n    \u003cdiv class=\"tabs\" id=\"learningTabs\" aria-label=\"学习板块\">\n      \u003cbutton class=\"tab active\" data-view=\"daily\">日常句子\u003c/button>\n      \u003cbutton class=\"tab\" data-view=\"vocab\">考证词库\u003c/button>\n      \u003cbutton class=\"tab\" data-view=\"mock\">模拟题\u003c/button>\n      \u003cbutton class=\"tab\" data-view=\"writing\">写作训练\u003c/button>\n      \u003cbutton class=\"tab\" data-view=\"resources\">样题/导入\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  \u003csection id=\"certHub\" hidden>\n    \u003cdiv class=\"certHero\">\u003cdiv>\u003cdiv class=\"kicker\">我的考证路线\u003c/div>\u003ch2 id=\"certTitle\">\u003c/h2>\u003cp id=\"certFocus\">\u003c/p>\u003c/div>\u003cdiv class=\"certMetrics\" id=\"certMetrics\">\u003c/div>\u003c/div>\n    \u003cdiv id=\"certBody\">\u003c/div>\n    \u003cdiv class=\"settingNote\">本地首批词库按目标等级分开训练，进度分证书保存；内置迷你卷是原创题型练习，官方公开样题在「样题 / 导入」。\u003c/div>\n  \u003c/section>\n  \u003cdiv id=\"dailyArea\">\n  \u003cdiv class=\"tabs\" id=\"tabs\">\u003c/div>\n\n  \u003cdiv class=\"daily\">\n    \u003cdiv class=\"dailyTop\">\n      \u003cb>今天学一点 ✍️\u003c/b>\n      \u003cspan id=\"dailyText\">0 / 5 项\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"dailyBar\">\u003cdiv class=\"dailyFill\" id=\"dailyFill\">\u003c/div>\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"reviewEmpty\" id=\"reviewEmpty\" hidden>\n    \u003cb>待复习清空了 ✓\u003c/b>\n    \u003cp>卡住的句子会放到这里。现在可以继续看新句子。\u003c/p>\n    \u003cbutton class=\"btn primary\" id=\"backToAll\">继续学新句子 →\u003c/button>\n  \u003c/div>\n  \u003csection class=\"card\">\n    \u003cdiv class=\"sentenceMeta\">\u003cdiv class=\"kicker\" id=\"cat\">今日一条\u003c/div>\u003cspan class=\"sentenceCount\" id=\"sentenceCount\">\u003c/span>\u003c/div>\n    \u003cdiv class=\"en\" id=\"en\">Loading...\u003c/div>\n    \u003cdiv class=\"wordHint\">点任意英文单词，直接看意思。\u003c/div>\n    \u003cdiv class=\"zh\" id=\"zh\">加载中\u003c/div>\n\n    \u003cdiv class=\"replyBox\" id=\"replyBox\">\n      \u003cdiv class=\"small\">顺手学个回复\u003c/div>\n      \u003cdiv class=\"replyEn\" id=\"replyEn\">\u003c/div>\n      \u003cbutton class=\"btn\" id=\"replyMemory\" style=\"margin-top:10px\">这句回话，练四遍\u003c/button>\n      \u003cdiv class=\"replyZh\" id=\"replyZh\">\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"sentenceTools\">\n      \u003cbutton class=\"btn\" id=\"sentenceSpeak\">🔊 听一下\u003c/button>\n      \u003cbutton class=\"btn\" id=\"showZh\">👀 中文\u003c/button>\n      \u003cbutton class=\"btn\" id=\"showReply\">💬 回复\u003c/button>\n      \u003cbutton class=\"btn\" id=\"sentenceChoice\">☝️ 选一选\u003c/button>\n    \u003c/div>\n\n    \u003cdetails class=\"aiBox\" id=\"aiBox\">\n      \u003csummary>🧩 看不懂？拆开问七\u003c/summary>\n      \u003cdiv class=\"aiHead\">\n        \u003cdiv class=\"aiTitle\">🧩 拆开看看\u003c/div>\n        \u003cdiv class=\"aiStatus\" id=\"aiStatus\">配置 API 后可用\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"aiTools\">\n        \u003cbutton class=\"aiTool\" data-ai=\"logic\">为什么这样说\u003c/button>\n        \u003cbutton class=\"aiTool\" data-ai=\"chunks\">词块积累\u003c/button>\n        \u003cbutton class=\"aiTool\" data-ai=\"feel\">语感一下\u003c/button>\n        \u003cbutton class=\"aiTool\" data-ai=\"variants\">换几个说法\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"aiAsk\">\n        \u003cinput id=\"aiAskInput\" placeholder=\"直接问：为什么这里用这个词？还能怎么说？\">\n        \u003cbutton id=\"aiAskSend\">问一下\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"aiResult\" id=\"aiResult\" aria-live=\"polite\">\u003c/div>\n      \u003cbutton class=\"btn\" id=\"aiMemory\" style=\"margin:10px 0\">选一句英文，练四遍\u003c/button>\n      \u003cdiv class=\"followup\" id=\"followup\">\n        \u003cinput id=\"followupInput\" placeholder=\"继续追问：为什么这里不能换成……\">\n        \u003cbutton id=\"followupSend\">追问\u003c/button>\n      \u003c/div>\n    \u003c/details>\n\n    \u003cdiv class=\"practice\" id=\"practice\">\n      \u003cdiv class=\"practiceHead\">\n        \u003cdiv class=\"practiceTitle\">✍️ 烂笔头区\u003c/div>\n        \u003cdiv class=\"modeSwitch\" id=\"stagePills\">\n          \u003cspan class=\"stagePill active\">1 描\u003c/span>\n          \u003cspan class=\"stagePill\">2 抄\u003c/span>\n          \u003cspan class=\"stagePill\">3 补\u003c/span>\n          \u003cspan class=\"stagePill\">4 默\u003c/span>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"practiceModeBar\">\n        \u003cbutton class=\"practiceModeBtn active\" data-practice-mode=\"write\">✍️ 手写\u003c/button>\n        \u003cbutton class=\"practiceModeBtn\" data-practice-mode=\"type\">⌨️ 输入核对\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"practiceTask\" id=\"practiceTask\">\u003cb>这一遍：\u003c/b>\u003cspan id=\"practiceTaskText\">沿着淡字描一遍英文。\u003c/span>\u003c/div>\n      \u003cdiv id=\"writeMode\">\n        \u003cdiv class=\"paperWrap\" id=\"paperWrap\">\n          \u003cdiv class=\"traceText\" id=\"traceText\">\u003c/div>\n          \u003ccanvas id=\"writeCanvas\">\u003c/canvas>\n        \u003c/div>\n        \u003cdiv class=\"practiceTools\">\n          \u003cbutton class=\"btn\" id=\"clearCanvas\">🧽 擦掉\u003c/button>\n          \u003cbutton class=\"btn\" id=\"practiceSpeak\">🔊 再听一遍\u003c/button>\n          \u003cbutton class=\"btn\" id=\"revealAnswer\">👀 看答案\u003c/button>\n          \u003cbutton class=\"btn primary\" id=\"checkHandwriting\">AI 核对手写\u003c/button>\n        \u003c/div>\n        \u003cdiv id=\"handwritingResult\" hidden>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"typeWrap\" id=\"typeMode\">\n        \u003cdiv class=\"typeTarget\">\u003cspan id=\"typeTargetHint\">本轮输入目标\u003c/span>\u003cb id=\"typeTargetLabel\">英文整句\u003c/b>\u003c/div>\n        \u003ctextarea class=\"typeAnswer\" id=\"typedAnswer\" placeholder=\"输入英文…\" autocomplete=\"off\" autocorrect=\"off\" autocapitalize=\"off\" spellcheck=\"false\">\u003c/textarea>\n        \u003cdiv class=\"typeActions\">\n          \u003cbutton class=\"btn\" id=\"clearTyped\">清空\u003c/button>\n          \u003cbutton class=\"btn\" id=\"typeSpeak\">🔊 听一下\u003c/button>\n          \u003cbutton class=\"btn primary\" id=\"checkTyped\">✓ 核对答案\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"typeResult\" id=\"typeResult\" aria-live=\"polite\">\u003c/div>\n        \u003cbutton class=\"mistakeHelp\" id=\"askMistake\">❓ 有疑问，让 AI 解释哪里不对\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"practiceHint\" id=\"practiceHint\">照着淡字描一遍。写得丑没关系，肌肉记忆不挑字体。\u003c/div>\n      \u003cdiv class=\"practiceDecision\">\n        \u003cbutton class=\"btn bad\" id=\"forget\">🧠 卡住 / 先记复习\u003c/button>\n        \u003cbutton class=\"btn ok\" id=\"know\">✍️ 写完这一遍 →\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003cdiv class=\"stats\">\n    \u003cdiv class=\"stat\">\u003cb id=\"seen\">0\u003c/b>\u003cspan>练习遍数\u003c/span>\u003c/div>\n    \u003cdiv class=\"stat\">\u003cb id=\"known\">0\u003c/b>\u003cspan>今天完成\u003c/span>\u003c/div>\n    \u003cdiv class=\"stat\">\u003cb id=\"review\">0\u003c/b>\u003cspan>待复习\u003c/span>\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"tip\">一条只走四遍：描/看抄 → 再写 → 补空 → 默写。练习区里处理“卡住”和“完成这一遍”；屏幕底部只负责“这句我熟，直接下一条”。答错又不服就点“有疑问”，让 API 当场解释。\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"bottom\">\n  \u003cdiv class=\"inner\">\n    \u003cbutton class=\"btn primary\" id=\"next\">熟悉，下一条 →\u003c/button>\n    \u003cspan class=\"bottomHint\">计入今天的学习 ✓\u003c/span>\n  \u003c/div>\n\u003c/div>\n\u003cdialog class=\"wordSheet\" id=\"wordSheet\" aria-labelledby=\"wordMain\">\n  \u003cdiv class=\"wordSheetTop\">\n    \u003cdiv>\n      \u003cdiv class=\"wordMain\" id=\"wordMain\">word\u003c/div>\n      \u003cdiv class=\"wordMeta\" id=\"wordContext\">正在查这个词在当前句子里的意思…\u003c/div>\n    \u003c/div>\n    \u003cbutton class=\"wordClose\" id=\"wordClose\" aria-label=\"关闭单词释义\">×\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"wordMeaning\" id=\"wordMeaning\" aria-live=\"polite\">加载中…\u003c/div>\n  \u003cdiv class=\"wordMeta\" id=\"wordStatus\">\u003c/div>\n  \u003cdiv class=\"wordActions\">\n    \u003cbutton class=\"btn\" id=\"wordSpeak\">🔊 发音\u003c/button>\n    \u003cbutton class=\"btn\" id=\"wordMemory\">✍ 这个词，练四遍\u003c/button>\n    \u003cbutton class=\"btn\" id=\"wordSave\">📦 收进零件箱\u003c/button>\n    \u003cbutton class=\"btn\" id=\"wordDeep\">🧩 再拆一下\u003c/button>\n    \u003cbutton class=\"btn\" id=\"wordRetry\" hidden>重试\u003c/button>\n  \u003c/div>\n\u003c/dialog>\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\">\u003c/div>\n\n\u003c!-- BEGIN markdown.js -->\n\u003cscript>\n// Small, escaped renderer for study explanations. Raw HTML is displayed as text.\nfunction markdownInline(value){\n  const tokens=[];\n  const hold=html=>'\\u0000'+(tokens.push(html)-1)+'\\u0000';\n  let s=String(value).replace(/`([^`\\n]+)`/g,(_,code)=>hold('\u003ccode>'+escapeHtml(code)+'\u003c/code>'));\n  s=escapeHtml(s);\n  s=s.replace(/\\[([^\\]\\n]+)\\]\\((https?:\\/\\/[^\\s)]+)\\)/g,(_,label,url)=>hold('\u003ca href=\"'+url+'\" target=\"_blank\" rel=\"noopener noreferrer\">'+label+'\u003c/a>'));\n  s=s.replace(/\\*\\*([^*\\n]+)\\*\\*|__([^_\\n]+)__/g,(_,a,b)=>'\u003cstrong>'+(a||b)+'\u003c/strong>');\n  s=s.replace(/(^|[\\s(])\\*([^*\\n]+)\\*|(^|[\\s(])_([^_\\n]+)_/g,(_,a,b,c,d)=>(a||c||'')+'\u003cem>'+(b||d)+'\u003c/em>');\n  s=s.replace(/~~([^~\\n]+)~~/g,'\u003cdel>$1\u003c/del>');\n  return s.replace(/\\u0000(\\d+)\\u0000/g,(_,i)=>tokens[Number(i)]||'');\n}\nfunction markdownHTML(value){\n  const lines=String(value||'').replace(/\\u0000/g,'').replace(/\\r\\n?/g,'\\n').split('\\n');\n  const out=[];\n  const cellRow=s=>s.trim().replace(/^\\|/,'').replace(/\\|$/,'').split('|').map(x=>x.trim());\n  const divider=s=>/^\\s*\\|?\\s*:?-{3,}:?\\s*(\\|\\s*:?-{3,}:?\\s*)+\\|?\\s*$/.test(s);\n  const special=(s,i)=>/^\\s*$|^\\s*(```|~~~)|^#{1,6}\\s|^\\s*>|^\\s*(?:[-+*]|\\d+[.)])\\s|^\\s*(?:---+|\\*\\*\\*+|___+)\\s*$/.test(s)||(s.includes('|')&&divider(lines[i+1]||''));\n  for(let i=0;i\u003clines.length;){\n    const line=lines[i];\n    if(!line.trim()){i++;continue;}\n    const fence=line.match(/^\\s*(```|~~~)/);\n    if(fence){\n      const code=[];i++;\n      while(i\u003clines.length&&!lines[i].trim().startsWith(fence[1])) code.push(lines[i++]);\n      if(i\u003clines.length)i++;\n      out.push('\u003cpre>\u003ccode>'+escapeHtml(code.join('\\n'))+'\u003c/code>\u003c/pre>');continue;\n    }\n    const heading=line.match(/^(#{1,6})\\s+(.+?)\\s*#*$/);\n    if(heading){const n=Math.min(5,heading[1].length+2);out.push('\u003ch'+n+'>'+markdownInline(heading[2])+'\u003c/h'+n+'>');i++;continue;}\n    if(/^\\s*(?:---+|\\*\\*\\*+|___+)\\s*$/.test(line)){out.push('\u003chr>');i++;continue;}\n    if(line.includes('|')&&divider(lines[i+1]||'')){\n      const headers=cellRow(line);i+=2;\n      let html='\u003cdiv class=\"tableScroll\">\u003ctable>\u003cthead>\u003ctr>'+headers.map(c=>'\u003cth>'+markdownInline(c)+'\u003c/th>').join('')+'\u003c/tr>\u003c/thead>\u003ctbody>';\n      while(i\u003clines.length&&lines[i].includes('|')&&lines[i].trim()){\n        const cells=cellRow(lines[i++]);html+='\u003ctr>'+headers.map((_,j)=>'\u003ctd>'+markdownInline(cells[j]||'')+'\u003c/td>').join('')+'\u003c/tr>';\n      }\n      out.push(html+'\u003c/tbody>\u003c/table>\u003c/div>');continue;\n    }\n    if(/^\\s*>/.test(line)){\n      const quote=[];\n      while(i\u003clines.length&&/^\\s*>/.test(lines[i]))quote.push(lines[i++].replace(/^\\s*>\\s?/,''));\n      out.push('\u003cblockquote>'+markdownHTML(quote.join('\\n'))+'\u003c/blockquote>');continue;\n    }\n    const item=line.match(/^\\s*(?:([-+*])|(\\d+)[.)])\\s+(.+)$/);\n    if(item){\n      const ordered=!!item[2],tag=ordered?'ol':'ul',items=[];\n      while(i\u003clines.length){\n        const match=lines[i].match(/^\\s*(?:([-+*])|(\\d+)[.)])\\s+(.+)$/);\n        if(!match||!!match[2]!==ordered)break;\n        items.push('\u003cli>'+markdownInline(match[3])+'\u003c/li>');i++;\n      }\n      out.push('\u003c'+tag+(ordered?' start=\"'+Number(item[2])+'\"':'')+'>'+items.join('')+'\u003c/'+tag+'>');continue;\n    }\n    const paragraph=[line];i++;\n    while(i\u003clines.length&&!special(lines[i],i))paragraph.push(lines[i++]);\n    out.push('\u003cp>'+paragraph.map(markdownInline).join('\u003cbr>')+'\u003c/p>');\n  }\n  return out.join('');\n}\nfunction renderMarkdown(element,value){\n  element.classList.add('markdown');\n  element.innerHTML=markdownHTML(value);\n}\n\n\n\u003c/script>\n\u003c!-- END markdown.js -->\n\u003c!-- BEGIN certificate-data.js -->\n\u003cscript>\n// Starter vocabulary selected for practice at each target level; not an official exhaustive list.\nconst CERT_INFO={\n  B1:{name:'B1 Preliminary',focus:'日常沟通 · 阅读细节 · 常用词块',slug:'preliminary',writingRange:'约 100 词',writingTask:'Write an email to your friend Alex. Alex wants to visit your city this weekend. Suggest a place to meet, explain how to get there, and say what you can do together.'},\n  B2:{name:'B2 First',focus:'搭配辨析 · 构词 · 句型转换',slug:'first',writingRange:'140–190 词',writingTask:'Your English class has discussed whether cities should provide more public transport. Write an essay using these notes: 1. the environment; 2. cost; 3. your own idea. Explain your opinion and give reasons.'},\n  C1:{name:'C1 Advanced',focus:'准确表达 · 论证 · 态度与推断',slug:'advanced',writingRange:'220–260 词',writingTask:'Your class has discussed ways to improve access to education: online courses, public libraries, and workplace training. Write an essay discussing two of these ways. Explain which is more effective and justify your opinion.'},\n  C2:{name:'C2 Proficiency',focus:'细微语义 · 语域 · 综合评价',slug:'proficiency',writingRange:'240–280 词',writingTask:'Write an essay summarising and evaluating the key ideas in BOTH texts. Add your own views.\\n\\nText 1: Flexible work allows employees to organise their day around periods of concentration and family responsibilities. Removing a long commute can return valuable time to workers and reduce pressure on city transport. Yet flexibility only produces these benefits if employees can genuinely control their schedules. When employers expect an immediate response at all hours, the office has merely been replaced by a permanent digital presence.\\n\\nText 2: Shared workplaces provide more than desks. Informal conversations can help colleagues exchange knowledge, notice difficulties and develop trust. These encounters are particularly valuable for people joining a profession. However, attendance alone does not guarantee meaningful collaboration. A noisy open office can obstruct careful thinking. Organisations should decide which activities benefit from physical contact instead of assuming that all work improves when people occupy the same building.'}\n};\nconst CERT_VOCAB_TEXT={\nB1:`journey|旅行；行程|The journey takes two hours.|这段旅程需要两小时。|a long journey|出行\ndeparture|出发；离开|Check the departure time before you leave.|离开前检查出发时间。|departure time|出行\naccommodation|住宿|We need to find affordable accommodation.|我们需要找到负担得起的住宿。|book accommodation|出行\navailable|可获得的；有空的|Is a double room available tonight?|今晚有双人房吗？|be available|出行\ndirections|路线指引|Could you give me directions to the station?|能告诉我去车站怎么走吗？| t=>/^[A-Za-z]+(?:['’-][A-Za-z]+)*$/.test(text);\n  // Both spellings are valid; lookup/engine support can differ by device.\n  const speechSpelling=text=>String(text).replace(/\\bemphasise\\b/gi,'emphasize');\n  const language=v=>String(v.lang||'').replace(/_/g,'-');\n  const identity=v=>(v.voiceURI||v.name)+'|'+language(v);\n  // Names are only a preference heuristic; quality varies by OS and browser.\n  const quality=v=>{\n    const n=v.name.toLowerCase();\n    return (/natural|neural|premium|enhanced/.test(n)?100:0)+\n      (/google/.test(n)?45:0)+(/microsoft/.test(n)?15:0)+\n      (/samantha|daniel|ava|serena|karen/.test(n)?10:0)+(v.default?2:0);\n  };\n  const ranked=list=>list.slice().sort((a,b)=>quality(b)-quality(a)||a.name.localeCompare(b.name));\n  const candidates=()=>settings.accent==='auto'?voices:voices.filter(v=>language(v).toLowerCase()===settings.accent.toLowerCase());\n  function selectedVoice(){\n    const list=candidates();\n    return list.find(v=>identity(v)===settings.voice)||ranked(list)[0]||ranked(voices)[0]||null;\n  }\n  function save(){try{localStorage.setItem(key,JSON.stringify(settings));}catch{}}\n  function refresh(){\n    if(supported){\n      try{voices=synth.getVoices().filter(v=>/^en(?:-|_|$)/i.test(v.lang||''));}catch{voices=[];}\n    }\n    const list=ranked(candidates()),select=el('speechVoice');\n    select.replaceChildren(new Option('自动选择（推荐）',''));\n    for(const v of list)select.add(new Option(v.name+' · '+language(v),identity(v)));\n    select.value=list.some(v=>identity(v)===settings.voice)?settings.voice:'';\n    const voice=selectedVoice();\n    let note='当前整句声音：'+(voice?voice.name+' · '+language(voice):'设备尚未提供英语声音');\n    if(!supported)note='当前浏览器不支持发音，请换一个支持语音朗读的浏览器。';\n    else if(!voices.length)note+='；设备尚未提供可选英语声音，稍后会自动更新。';\n    else if(settings.accent!=='auto'&&!list.length)note+='；设备没有所选口音，已使用可用的英语声音。';\n    if(!recordingSupported)note+='；当前浏览器没有提供录音播放接口。';\n    el('speechCurrent').textContent=note;\n    select. ent});\n        credit(cached||{source:recordingEndpoint.replace('asset=word-audio','asset=recording-source')+query,license:'查看出处与许可'});\n        el('speechStatus').textContent=(cached?'备用词典录音':'词典录音')+' · 完整单词 · 原速';el('speechStatus').dataset.source=cached?'dictionary-backup':'recording';\n        return true;\n      }catch(error){\n        if(request!==serial)return false;\n        if(error.name==='NotAllowedError'){clearTimeout(loadTimer);loadTimer=null;failed=true;player.onerror=null;player.onended=null;player.pause();inform('浏览器阻止了录音播放，请再点一次原来的播放按钮','gesture-blocked',{source:'recording',text:clean[index]});return false;}\n        return fallback('录音未能播放','media-play-error');\n      }\n    }\n    return play(0);\n  }\n  window.englishSpeech={speak:(text,options)=>speakParts([text],options),speakParts,stop,diagnostics};\n  el('speechAccent').value=settings.accent;el('speechRate').value=String(settings.rate);\n  if(el('speechWords')){el('speechWords').value=settings.words;el('speechWords').onchange=()=>{stop();settings.words=el('speechWords').value;save();};}\n  el('speechToggle').onclick=()=>{\n    const open=el('speechPanel').classList.toggle('show');\n    el('speechToggle').setAttribute('aria-expanded',String(open));refresh();\n  };\n  el('speechAccent').onchange=()=>{stop();settings.accent=el('speechAccent').value;settings.voice='';save();refresh();};\n  el('speechVoice').onchange=()=>{stop();settings.voice=el('speechVoice').value;save();refresh();};\n  el('speechRate').onchange=()=>{stop();settings.rate=Number(el('speechRate').value);save();};\n  el('speechPreviewWord').onclick=()=>speakParts(['pronunciation'],{kind:'word'});\n  el('speechPreviewSentence').onclick=()=>speakParts(['Could you explain that a little more clearly?']);\n  el('speechStop').onclick=()=>{stop();el('speechStatus').textContent='已停止';};\n  if(supported)synth.addEventListener?.('voiceschanged',refresh);\n  window.addEventListener('pagehide',stop);\n  refresh();\n})();\n\n\n\n\u003c/script>\n\u003c!-- END speech.js -->\n\u003c!-- BEGIN recognition.js -->\n\u003cscript>\n/* Meaning recognition shared by the word stream, short sessions and four-pass choices. */\n(()=>{\n  const norm=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/[’‘]/g,\"'\").replace(/\\s+/g,' ').trim();\n  const esc=s=>escapeHtml(String(s||''));\n  const shuffle=list=>{const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};\n  const valid=w=>w&&/[a-z]/i.test(w.word||'')&&/[\\u3400-\\u9fff]/.test(w.meaning||'')&&!/待补|暂无|未提供/.test(w.meaning);\n  const senses=s=>String(s||'').replace(/（[^）]*）|\\([^)]*\\)/g,'').split(/[；;、，,/]/).map(norm).filter(Boolean);\n  const pos=w=>norm(w.partOfSpeech).replace(/\\./g,'');\n  function round(w,kind='en-zh',bank=[]){\n    if(!valid(w))return null;\n    const seen=new Set([norm(w.word)]),meanings=senses(w.meaning),phrase=norm(w.word).includes(' ');\n    const pool=bank.filter(x=>{\n      const key=norm(x?.word);if(!valid(x)||seen.has(key)||norm(x.meaning)===norm(w.meaning)||senses(x.meaning).some(s=>meanings.includes(s)))return false;\n      seen.add(key);return true;\n    });\n    const ranked=shuffle(pool).map(x=>({x,score:(pos(w)&&pos(x)===pos(w)?8:0)+(x.topic===w.topic?3:0)+(norm(x.word).includes(' ')===phrase?2:0)})).sort((a,b)=>b.score-a.score);\n    const selected=[w],usedSenses=new Set(meanings),usedMeanings=new Set([norm(w.meaning)]);\n    for(const {x} of ranked){\n      const parts=senses(x.meaning);if(usedMeanings.has(norm(x.meaning))||parts.some(s=>usedSenses.has(s)))continue;\n      selected.push(x);usedMeanings.add(norm(x.meaning));parts.forEach(s=>usedSenses.add(s));if(selected.length===4)break;\n    }\n    const pairs=shuffle(selected);\n    const direction=['zh-en','listen'].includes(kind)?'zh-en':'en-zh';\n    return {kind,direction,pairs,prompt:kind==='listen'?'听发音，认出这个词':kind==='context'&&w.example?w.example:direction==='en-zh'?w.word:w.meaning,\n      answer:direction==='en-zh'?w.meaning:w.word,options:pairs.map(x=>direction==='en-zh'?x.meaning:x.word),\n      label:{'en-zh':'英文选中文','zh-en':'中文选英文',context:'句子里认词义',listen:'听音认词'}[kind]||'英文选中文'};\n  }\n  function comparisons(pairs,target){\n    return '\u003csection class=\"recognitionComparisons\" aria-label=\"全部选项的中英对照\">\u003cdiv class=\"recognitionCaption\">一起认一眼\u003c/div>'+pairs.map((x,i)=>'\u003cdiv class=\"recognitionPair '+(norm(x.word)===norm(target.word)?'target':'')+'\">\u003cdiv>\u003cbutton type=\"button\" class=\"wordTap\" data-word=\"'+esc(x.word)+'\">'+esc(x.word)+'\u003c/button>\u003cspan>'+esc(x.meaning)+'\u003c/span>\u003c/div>\u003cbutton type=\"button\" class=\"btn recognitionAudio\" data-recognition-audio=\"'+i+'\" aria-label=\"播放 '+esc(x.word)+'\">听\u003c/button>\u003c/div>').join('')+'\u003c/section>';\n  }\n  function detail(w){return '\u003cdiv class=\"recognitionExample\">'+(w.chunk?'\u003cdiv>'+tokenizeClickable(w.chunk)+'\u003c/div>':'')+(w.example?'\u003cp>'+tokenizeClickable(w.example)+'\u003c/p>\u003cp class=\"recognitionTranslation\">'+esc(w.translation||'这条例句暂缺中文翻译，可点英文查词。')+'\u003c/p>':'')+'\u003c/div>';}\n  function bind(host,pairs,target){\n    bindWordTaps(host,target.example||target.word);\n    host.querySelectorAll('[data-recognition-audio]').forEach(b=>b.onclick=()=>{const w=pairs[Number(b.dataset.recognitionAudio)];if(w)window.englishSpeech?.speak(w.word,{kind:w.word.trim().includes(' ')?'sentence':'word'});});\n  }\n  function schedule(p,target,pairs,ok){\n    p.recognitionTurns=(Number(p.recognitionTurns)||0)+1;\n    p.recognitionQueue=p.recognitionQueue||{};\n    p.recognitionRecent=[...(p.recognitionRecent||[]),target.id].filter(Boolean).slice(-3);\n    pairs=[target,...pairs.filter(x=>x.id!==target.id)];\n    pairs.forEach((x,i)=>{if(!x.id)return;const own=x.id===target.id;if(own&&ok){delete p.recognitionQueue[x.id];return;}const old=p.recognitionQueue[x.id];if(!own&&old)return;p.recognitionQueue[x.id]={due:p.recognitionTurns+(own?(ok?8:3):5+i),priority:own?0:1};});\n    const keep=Object.entries(p.recognitionQueue).sort((a,b)=>a[1].priority-b[1].priority||a[1].due-b[1].due).slice(0,32);\n    p.recognitionQueue=Object.fromEntries(keep);\n  }\n  function sooner(p,w){if(!w.id)return;p.recognitionQueue=p.recognitionQueue||{};p.recognitionQueue[w.id]={due:(p.recognitionTurns||0)+3,priority:0};}\n  function next(p,pool,exclude){\n    const ids=new Map(pool.map(w=>[w.id,w]));\n    const due=Object.entries(p.recognitionQueue||{}).filter(([id,r])=>id!==exclude&&ids.has(id)&&!(p.recognitionRecent||[]).includes(id)&&r.due\u003c=(p.recognitionTurns||0)).sort((a,b)=>a[1].due-b[1].due||a[1].priority-b[1].priority);\n    return ids.get(due[0]?.[0])||null;\n  }\n  window.englishRecognition={round,comparisons,detail,bind,valid,schedule,sooner,next};\n})();\n\n\u003c/script>\n\u003c!-- END recognition.js -->\n\u003c!-- BEGIN memory.js -->\n\u003cscript>\n/* Reusable four-pass practice for words, examples, corrected answers and writing. */\n(()=>{\n  const dialog=document.createElement('dialog');dialog.id='memoryDialog';dialog.className='memoryDialog';dialog.setAttribute('aria-labelledby','memoryTitle');document.body.append(dialog);\n  const el=id=>document.getElementById(id);\n  const esc=text=>escapeHtml(String(text||''));\n  let session=null,selected=0,revision=0,revealTimer=null,advanceUntil=0,container=dialog;\n  let mode=localStorage.getItem('lazyEnglishMemoryMode')||(localStorage.getItem('lazyEnglishPracticeMode')==='type'?'type':'hand');\n  if(!['hand','type','paper','choice'].includes(mode))mode='hand';\n  let choiceDirection=localStorage.getItem('lazyEnglishChoiceDirection')||'mixed';\n  if(!['mixed','en-zh','zh-en'].includes(choiceDirection))choiceDirection='mixed';\n  let strokes=[],stroke=null,context=null,checked=null,reviewEpoch=0;\n  function cancelReview(){reviewEpoch++;const box=el('memoryFeedback');if(box)window.englishTutor?.cancel(box);}\n  const item=()=>session.items[selected];\n  const itemKey=()=>JSON.stringify([session.scope,item().id,item().text]);\n  function record(){\n    state.memoryPractice=state.memoryPractice||{};\n    const key=itemKey();\n    const r=state.memoryPractice[key]=state.memoryPractice[key]||{stage:0,writes:0,choices:0,cycles:0,review:false};\n    r.stage=Math.max(0,Math.min(4,Number(r.stage)||0));\n    r.choices=Number(r.choices)||0;\n    return r;\n  }\n  function choicePairs(){\n    const pairs=[];\n    const add=(text,meaning)=>{\n      text=String(text||'').trim();meaning=String(meaning||'').trim();\n      if(text&&meaning&&/[A-Za-z]/.test(text))pairs.push({text,meaning});\n    };\n    for(const x of session?.items||[])add(x.text,x.meaning);\n    try{\n      if(typeof DATA!=='undefined'&&Array.isArray(DATA))for(const x of DATA){add(x.en,x.zh);add(x.reply,x.reply_zh);}\n    }catch{}\n    try{\n      if(typeof CERT_VOCAB!=='undefined')for(const bank of Object.values(CERT_VOCAB||{}))for(const x of bank||[]){add(x.word,x.meaning);add(x.example,x.translation);}\n    }catch{}\n    const seen=new Set();\n    return pairs.filter(x=>{const k=x.text+'\\u0000'+x.meaning;if(seen.has(k))return false;seen.add(k);return true;});\n  }\n  function shuffleChoices(values){\n    const copy=[...values];\n    for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]];}\n    return copy;\n  }\n  function choiceRound(target,r,stage){\n    const direction=choiceDirection==='mixed'?(((stage+(Number(r.cycles)||0)+selected)%2===0)?'en-zh':'zh-en'):choiceDirection;\n    const correct=direction==='en-zh'?String(target.meaning||'').trim():String(target.text||'').trim();\n    const prompt=direction==='en-zh'?target.text:target.meaning;\n    const round=window.englishRecognition.round({word:target.text,meaning:target.meaning},direction,choicePairs().map(x=>({word:x.text,meaning:x.meaning})));\n    if(round)return {...round,prompt,correct};\n    return {direction,prompt,correct,options:[correct],pairs:[]};\n  }\n  function saveProgress(){const r=record();r.updatedAt=Date.now();r.text=item().text;r.meaning=item().meaning||'';r.scope=session.scope;save();window.certificateUI?.renderHero();}\n  function clozeTarget(text){\n    const result=makeCloze(text);\n    if(result.blanks.length)return result;\n    const match=text.match(/[A-Za-z]+(?:['’][A-Za-z]+)*/);\n    if(!match)return {display:'____',blanks:[text]};\n    return {display:text.replace(match[0],match[0].length>1?match[0][0]+'＿'.repeat(Math.min(6,match[0].length-1)):'＿'),blanks:[match[0]]};\n  }\n  function close(){\n    cancelReview();\n    const onClose=session?.onClose;\n    revision++;clearTimeout(revealTimer);window.englishSpeech?.stop();\n    session=null;stroke=null;strokes=[];checked=null;dialog.close();container.replaceChildren();container=dialog;\n    onClose?.();\n  }\n  function open(options){\n    if(session||dialog.open)close();container=dialog;\n    const items=(options.items||[]).map((x,i)=>({...x,id:String(x.id||i),text:String(x.text||'').trim()})).filter(x=>x.text&&x.text.length\u003c=500);\n    if(!items.length){toast('选择一句不超过 500 字的英文，再来练四遍');return;}\n    session={...options,scope:String(options.scope||'custom'),items};selected=0;revision++;advanceUntil=0;checked=null;\n    if(options.startMode&&['hand','type','paper','choice'].includes(options.startMode))mode=options.startMode;\n    render();dialog.showModal();resize();el('memoryClose').focus();\n  }\n  function mount(options,host){\n    if(session||dialog.open)close();\n    const items=(options.items||[]).map((x,i)=>({...x,id:String(x.id||i),text:String(x.text||'').trim()})).filter(x=>x.text&&x.text.length\u003c=500);\n    if(!items.length)return;\n    container=host;container.classList.add('memoryEmbedded');session={...options,scope:String(options.scope||'custom'),items};selected=0;advanceUntil=0;\n    if(options.startMode&&['hand','type','paper','choice'].includes(options.startMode))mode=options.startMode;\n    render();resize();\n  }\n  function resize(){\n    const canvas=el('memoryCanvas');if(!canvas||(!dialog.open&&container===dialog)||!container.isConnected)return;\n    const rect=canvas.getBoundingClientRect(),dpr=Math.max(1,window.devicePixelRatio||1);\n    canvas.width=Math.max(1,Math.round(rect.width*dpr));canvas.height=Math.max(1,Math.round(rect.height*dpr));\n    context=canvas.getContext('2d');if(!context)return;\n    context.setTransform(dpr,0,0,dpr,0,0);context.lineCap='round';context.lineJoin='round';context.strokeStyle='#5f5270';context.lineWidth=3;\n    for(const points of strokes){context.beginPath();for(let i=0;i\u003cpoints.length;i++){const x=points[i].x*rect.width,y=points[i].y*rect.height;if(i)context.lineTo(x,y);else context.moveTo(x,y);}context.stroke();}\n  }\n  function feedback(text,good){const box=el('memoryFeedback');box.hidden=false;box.textContent=text;box.className='memoryFeedback '+(good?'good':'bad');}\n  function renderTarget(text){el('memoryTarget').innerHTML=tokenizeClickable(text);bindWordTaps(el('memoryTarget'),item().text);}\n  async function check(){\n    const input=el('memoryInput'),actual=input.value.trim(),r=record();\n    if(!actual){toast('先写一点，再核对');return false;}\n    const targets=[item().text];if(r.stage===2)targets.push(clozeTarget(item().text).blanks.join(' '));\n    if(window.englishTutor?.configured()){\n      const version=revision,epoch=reviewEpoch;\n      const data=await window.englishTutor.review({host:el('memoryFeedback'),expected:targets[0],alternatives:targets.slice(1),actual,meaning:item().meaning,context:'四遍记忆，第 '+(r.stage+1)+' 遍；抄写 / 默写给定英文。'+(session.context||''),isCurrent:()=>revision===version&&reviewEpoch===epoch&&el('memoryInput')?.value.trim()===actual});\n      if(revision!==version||reviewEpoch!==epoch)return false;\n      checked=data?.correct===true?actual:null;return data?.correct===true;\n    }\n    const ok=targets.some(text=>looseTyped(text)===looseTyped(actual));checked=ok?actual:null;\n    feedback(ok?'✓ 对上了。这一遍可以记完成。':'还没对上，可以偷看后再写。参考答案：'+item().text,ok);\n    return ok;\n  }\n  async function checkHand(){\n    if(!strokes.some(points=>points.length>1)){toast('先写一遍，再让 AI 检查');return false;}\n    const version=revision,epoch=reviewEpoch;\n    const data=await window.englishTutor.review({host:el('memoryFeedback'),expected:item().text,alternatives:record().stage===2?[clozeTarget(item().text).blanks.join(' ')]:[],meaning:item().meaning,context:'四遍记忆：检查是否写对给定英文。'+(session.context||''),image:window.englishTutor.canvasImage(el('memoryCanvas')),isCurrent:()=>revision===version&&reviewEpoch===epoch});\n    if(revision!==version||reviewEpoch!==epoch)return false;\n    checked=data?.correct===true?'self-ok':null;return data?.correct===true;\n  }\n  async function complete(){\n    if(Date.now()\u003cadvanceUntil||!session)return;\n    const r=record();if(r.stage>=4)return;\n    if(mode==='type'){\n      if(!el('memoryInput').value.trim()){toast('先写一遍，再核对答案');return;}\n      if(checked!==el('memoryInput').value.trim()&&!await check()){toast('还没核对通过，这一遍先不算');return;}\n    }\n    if(mode==='hand'){\n      if(!strokes.some(points=>points.length>1)){toast('先写一遍；在纸上写的话，可以切到「纸笔」');return;}\n      if(checked!=='self-ok'&&window.englishTutor?.configured()){if(!await checkHand())return;}\n      if(checked!=='self-ok'){toast('先核对这一遍，再确认有没有写对');return;}\n    }\n    if(mode==='paper'&&checked!=='self-ok'){toast('先对照答案核对这一遍');return;}\n    advanceUntil=Date.now()+300;\n    r.stage++;touchStreak();\n    if(mode==='choice')r.choices=(Number(r.choices)||0)+1;\n    else{\n      r.writes=(Number(r.writes)||0)+1;\n      if(session.level){\n        state.certificates=state.certificates||{};\n        const p=state.certificates[session.level]=state.certificates[session.level]||{};p.writes=(Number(p.writes)||0)+1;\n      }\n    }\n    if(r.stage===4){\n      r.cycles=(Number(r.cycles)||0)+1;\n      const today=dayKey();state.dailyDone[today]=state.dailyDone[today]||{};state.dailyDone[today]['memory:'+itemKey()]=true;\n    }\n    saveProgress();render();\n    if(mode==='type')el('memoryInput')?.focus({preventScroll:true});\n  }\n  function beginSelfCheck(){\n    if(!session)return;\n    const target=item(),box=el('memorySelfCheck');\n    if(!box)return;\n    box.hidden=false;\n    box.innerHTML='\u003cdiv class=\"memorySelfAnswer\">\u003cb>标准答案\u003c/b>\u003cdiv>'+esc(target.text)+'\u003c/div>'+(target.meaning?'\u003cspan>'+esc(target.meaning)+'\u003c/span>':'')+'\u003c/div>\u003cdiv class=\"memorySelfActions\">\u003cbutton class=\"btn bad\" id=\"memorySelfWrong\">有错，重来\u003c/button>\u003cbutton class=\"btn ok\" id=\"memorySelfRight\">✓ 我写对了\u003c/button>\u003c/div>';\n    checked=null;\n    el('memorySelfRight').onclick=()=>{checked='self-ok';feedback('✓ 核对过了，这一遍可以记完成。',true);el('memorySelfRight').disabled=true;};\n    el('memorySelfWrong').onclick=()=>{checked=null;strokes=[];stroke=null;if(mode==='hand')resize();box.hidden=true;feedback('这遍不算，重新写一次再核对。',false);};\n  }\n  function render(){\n    if(!session)return;\n    cancelReview();\n    revision++;clearTimeout(revealTimer);revealTimer=null;strokes=[];stroke=null;checked=null;\n    const target=item(),r=record(),stage=r.stage,done=stage===4,choice=mode==='choice';\n    const instructions=['照着淡字描一遍；输入模式下照着原文写一遍。','看着原文，再独立写一遍。','补全被挖掉的词，也可以写完整英文。','只看意思或听发音，凭记忆写出英文。'];\n    const displayed=stage===2?clozeTarget(target.text).display:target.text;\n    const round=choice&&!done?choiceRound(target,r,stage):null;\n    const choiceReady=!!(round?.correct&&round?.prompt&&round.options.length>=2);\n    const stageNames=choice?['1 认','2 认','3 认','4 认']:['1 描 / 看抄','2 再写','3 补空','4 默写'];\n    const mainPrompt=choice&&!done\n      ? '\u003cdiv class=\"memoryChoiceDirection\">'+(round.direction==='en-zh'?'英文 → 选中文':'中文 → 选英文')+'\u003c/div>\u003cdiv class=\"memoryChoicePrompt\">'+esc(round.prompt||'')+'\u003c/div>'\n      : '\u003cdiv class=\"memoryTarget\" id=\"memoryTarget\" '+(stage===3?'hidden':'')+'>'+esc(displ
