dient(45deg,#e7e7e7 25%,transparent 25%),linear-gradient(-45deg,#e7e7e7 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e7e7e7 75%),linear-gradient(-45deg,transparent 75%,#e7e7e7 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#f7f7f7}\n.gridOverlay{position:absolute;inset:0;pointer-events:none;z-index:9997;background-image:linear-gradient(rgba(90,120,170,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(90,120,170,.16) 1px,transparent 1px);background-size:20px 20px;display:none}.stage.grid .gridOverlay{display:block}\n.item{position:absolute;user-select:none;touch-action:none;transform-origin:center center}.item.hide{display:none}.item.selected{outline:2px solid #69cfff;outline-offset:2px}.item.locked:after{content:\"🔒\";position:absolute;right:-10px;top:-12px;font-size:14px}.item img{width:100%;height:100%;display:block;object-fit:fill;pointer-events:none}.handle{display:none;position:absolute;z-index:4}.selected .handle{display:block}.resize{right:-7px;bottom:-7px;width:13px;height:13px;border-radius:4px;background:#fff;border:2px solid #68cfff;cursor:nwse-resize}.rotate{left:50%;top:-29px;transform:translateX(-50%);width:13px;height:13px;border-radius:50%;background:#a994ff;border:2px solid white;cursor:grab}.rotate:after{content:\"\";position:absolute;width:1px;height:16px;background:#79d5ff;left:4px;top:10px}\n.guide{display:none;position:absolute;background:#5ed2ff;z-index:9999;pointer-events:none}.guide.v{top:0;bottom:0;width:1px}.guide.h{left:0;right:0;height:1px}\n.floater{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:20;display:flex;gap:6px;padding:6px;border:1px solid #3c455b;border-radius:12px;background:#121722dd;backdrop-filter:blur(10px)}.zoom{padding:7px 8px;font-size:11px;color:#cfd7e9}\n.field{display:grid;grid-template-columns:82px 1fr;gap:8px;align-items:center;margin:8px 0}.field label{font-size:11px;color:#aeb8cc}.field input,.field select{width:100%;bord sition:fixed;right:0;top:58px;bottom:0;width:285px;z-index:40;box-shadow:-18px 0 50px rgba(0,0,0,.35)}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"app\">\n\u003cheader class=\"top\">\n  \u003cdiv class=\"brand\">酒馆美化拼拼乐 \u003csmall>素材拼图台\u003c/small>\u003c/div>\n  \u003cbutton class=\"btn icon\" id=\"undo\">↶\u003c/button>\u003cbutton class=\"btn icon\" id=\"redo\">↷\u003c/button>\n  \u003cbutton class=\"btn\" id=\"dup\">复制\u003c/button>\u003cbutton class=\"btn danger\" id=\"del\">删除\u003c/button>\n  \u003cdiv class=\"spacer\">\u003c/div>\n  \u003cbutton class=\"btn\" id=\"projectOut\">保存工程\u003c/button>\u003cbutton class=\"btn\" id=\"projectIn\">读取工程\u003c/button>\n  \u003cbutton class=\"btn primary\" id=\"pngOut\">导出 PNG\u003c/button>\n\u003c/header>\n\n\u003caside class=\"side left\">\n  \u003csection class=\"section\">\n    \u003ch3>导入你的素材\u003c/h3>\n    \u003cdiv class=\"dropzone\" id=\"dropzone\">\u003cb>＋ 扔素材进来\u003c/b>\u003cdiv class=\"hint\">PNG / WebP / JPG / SVG / GIF\u003cbr>可多选，也可直接拖文件到这里\u003c/div>\u003c/div>\n    \u003cinput id=\"fileInput\" type=\"file\" accept=\"image/*,.svg\" multiple hidden>\n    \u003cdiv class=\"assetgrid\" id=\"assetgrid\">\u003c/div>\n  \u003c/section>\n  \u003csection class=\"section\">\n    \u003ch3>画布预设\u003c/h3>\n    \u003cdiv class=\"presets\">\n      \u003cbutton class=\"preset\" data-size=\"1030,460\">\u003cb>横幅\u003c/b>\u003csmall>1030×460\u003c/small>\u003c/button>\n      \u003cbutton class=\"preset\" data-size=\"700,860\">\u003cb>聊天区\u003c/b>\u003csmall>700×860\u003c/small>\u003c/button>\n      \u003cbutton class=\"preset\" data-size=\"440,700\">\u003cb>手机\u003c/b>\u003csmall>440×700\u003c/small>\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"row2\" style=\"margin-top:8px\">\n      \u003cdiv class=\"field\">\u003clabel>宽\u003c/label>\u003cinput id=\"cw\" type=\"number\" value=\"1030\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel>高\u003c/label>\u003cinput id=\"ch\" type=\"number\" value=\"460\">\u003c/div>\n    \u003c/div>\n  \u003c/section>\n  \u003csection class=\"section\">\n    \u003ch3>玩法\u003c/h3>\n    \u003cdiv class=\"hint\">把左侧缩略图拖到画布，也可以直接点素材添加。选中后拖动；右下角缩放；顶部紫点旋转。\u003cbr>\u003cbr>Del 删除，Ctrl/Cmd+D 复制，方向键微调，Shift+方向键每次 8px。\u003c/div>\n  \u003c/section>\n\u003c/aside>\n\n\u003cmain class=\"workspace\" id=\"workspace\">\n  \u003cdiv class=\"stageShell\">\n    \u003cdiv class=\"floater\">\n      \u003cbutton class=\"btn icon\" id=\"zoomMinus\">−\u003c/button>\u003cspan class=\"zoom\" id=\"zoomText\">100%\u003c/span>\u003cbutton class=\"btn icon\" id=\"zoomPlus\">＋\u003c/button>\n      \u003cbutton class=\"btn\" id=\"fit\">适配\u003c/button>\u003cbutton class=\"btn\" id=\"gridBtn\">网格\u003c/button>\u003cbutton class=\"btn active\" id=\"snapBtn\">吸附\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"stage checker\" id=\"stage\">\n      \u003cdiv class=\"gridOverlay\">\u003c/div>\u003cdiv class=\"guide v\" id=\"gv\">\u003c/div>\u003cdiv class=\"guide h\" id=\"gh\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/main>\n\n\u003caside class=\"side right\">\n  \u003csection class=\"section\">\n    \u003ch3>画布\u003c/h3>\n    \u003cdiv class=\"field\">\u003clabel>底色\u003c/label>\u003cinput id=\"bgColor\" type=\"color\" value=\"#ffffff\">\u003c/div>\n    \u003cdiv class=\"tags\">\u003cbutton class=\"tag on\" id=\"transparentBtn\">透明底\u003c/button>\u003cbutton class=\"tag\" id=\"checkerBtn\">棋盘预览\u003c/button>\u003c/div>\n  \u003c/section>\n  \u003csection class=\"section\">\n    \u003ch3>选中素材\u003c/h3>\n    \u003cdiv class=\"empty\" id=\"empty\">抓一个素材过来。\u003cbr>让它接受图层社会的残酷教育。\u003c/div>\n    \u003cdiv id=\"props\" style=\"display:none\">\n      \u003cdiv class=\"field\">\u003clabel>名称\u003c/label>\u003cinput id=\"pname\">\u003c/div>\n      \u003cdiv class=\"row2\">\u003cdiv class=\"field\">\u003clabel>X\u003c/label>\u003cinput id=\"px\" type=\"number\">\u003c/div>\u003cdiv class=\"field\">\u003clabel>Y\u003c/label>\u003cinput id=\"py\" type=\"number\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"row2\">\u003cdiv class=\"field\">\u003clabel>宽\u003c/label>\u003cinput id=\"pw\" type=\"number\">\u003c/div>\u003cdiv class=\"field\">\u003clabel>高\u003c/label>\u003cinput id=\"ph\" type=\"number\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"row2\">\u003cdiv class=\"field\">\u003clabel>旋转\u003c/label>\u003cinput id=\"prot\" type=\"number\">\u003c/div>\u003cdiv class=\"field\">\u003clabel>透明\u003c/label>\u003cinput id=\"pop\" type=\"number\" min=\"0\" max=\"1\" step=\".05\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel>混合\u003c/label>\u003cselect id=\"blend\">\u003coption>normal\u003c/option>\u003coption>multiply\u003c/option>\u003coption>screen\u003c/option>\u003coption>overlay\u003c/option>\u003coption>soft-light\u003c/option>\u003coption>hard-light\u003c/option>\u003coption>lighten\u003c/option>\u003coption>darken\u003c/option>\u003c/select>\u003c/div>\n      \u003cdiv class=\"tags\">\n        \u003cbutton class=\"tag\" id=\"flipX\">水平镜像\u003c/button>\u003cbutton class=\"tag\" id=\"flipY\">垂直镜像\u003c/button>\u003cbutton class=\"tag\" id=\"lock\">锁定\u003c/button>\n        \u003cbutton class=\"tag\" id=\"up\">上移一层\u003c/button>\u003cbutton class=\"tag\" id=\"down\">下移一层\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n  \u003csection class=\"section\">\n    \u003ch3>图层\u003c/h3>\n    \u003cdiv class=\"layers\" id=\"layers\">\u003c/div>\n  \u003c/section>\n\u003c/aside>\n\u003c/div>\n\n\u003cdiv class=\"toast\" id=\"toast\">\u003c/div>\n\u003cdiv class=\"modal\" id=\"sizeModal\">\u003cdiv class=\"card\">\u003ch2>工程文件\u003c/h2>\u003cdiv class=\"hint\">工程会把素材本体一起存进 JSON，所以文件可能会胖得相当坦率。\u003c/div>\u003cdiv style=\"height:12px\">\u003c/div>\u003cbutton class=\"btn primary\" id=\"exportProjectNow\">下载 .json 工程\u003c/button>\u003cbutton class=\"btn\" id=\"closeModal\">关闭\u003c/button>\u003c/div>\u003c/div>\n\u003cinput id=\"projectFile\" type=\"file\" accept=\".json,application/json\" hidden>\n\n\u003cscript>\n(function(){\n'use strict';\nvar $=function(s){return document.querySelector(s)}, $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};\nvar stage=$('#stage'),workspace=$('#workspace');\nvar st={assets:[],items:[],selected:null,w:1030,h:460,zoom:1,bg:'#ffffff',transparent:true,checker:true,grid:false,snap:true,history:[],future:[],counter:1};\nfunction id(p){return p+'_'+Date.now().toString(36)+'_'+(st.counter++)}\nfunction toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('show')},1600)}\nfunction snap(n){return st.snap?Math.round(n/8)*8:n}\nfunction clamp(n,a,b){return Math.max(a,Math.min(b,n))}\nfunction snapshot(){return JSON.stringify({assets:st.assets,items:st.items,w:st.w,h:st.h,bg:st.bg,transparent:st.transparent,checker:st.checker,grid:st.grid,counter:st.counter})}\nfunction remember(){st.history.push(snapshot());if(st.history.length>60)st.history.shift();st.future=[]}\nfunction restore(s){var d=JSON.parse(s);st.assets=d.assets||[];st.items=d.items||[];st.w=d.w||1030;st.h=d.h||460;st.bg=d.bg||'#ffffff';st.transparent=d.transparent!==false;st.checker=d.checker!==false;st.grid=!!d.grid;st.counter=d.counter||1;st.selected=null;render()}\nfunction undo(){if(!st.history.length)return toast('已经退到底了');st.future.push(snapshot());restore(st.history.pop())}\nfunction redo(){if(!st.future.length)return toast('没有下一步');st.history.push(snapshot());restore(st.future.pop())}\nfunction assetById(aid){return st.assets.find(function(a){return a.id===aid})}\nfunction itemById(iid){return st.items.find(function(i){return i.id===iid})}\nfunction fileToData(file){return new Promise(function(resolve,reject){var r=new FileReader();r.onload=function(){resolve(r.result)};r.onerror=reject;r.readAsDataURL(file)})}\nasync function importFiles(files){\n  var list=Array.prototype.slice.call(files).filter(function(f){return f.type.i
