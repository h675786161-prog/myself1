<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>酒馆美化拼拼乐 · 素材拼图台</title>
<style>
:root{--bg:#10131b;--panel:#171b26;--panel2:#1d2230;--line:#343b50;--text:#eef2fb;--muted:#98a3b9;--accent:#a994ff;--cyan:#7ad7ff;--danger:#ff7e99}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
button,input,select{font:inherit}.app{height:100vh;display:grid;grid-template-columns:270px 1fr 290px;grid-template-rows:58px 1fr}
.top{grid-column:1/4;display:flex;align-items:center;gap:8px;padding:0 12px;background:#11151ecf;border-bottom:1px solid var(--line);backdrop-filter:blur(15px);z-index:30}
.brand{font-weight:800;margin-right:6px}.brand small{font-weight:500;color:var(--muted);margin-left:8px}.spacer{flex:1}
.btn{border:1px solid var(--line);background:#1c2130;color:var(--text);border-radius:10px;padding:8px 10px;cursor:pointer}.btn:hover{background:#252b3d}.btn.primary{border:0;background:linear-gradient(135deg,#8f7dff,#68bfff);font-weight:750}.btn.danger{color:#ff9db0}.btn.active{border-color:#8f80ff;background:#292445}.btn.icon{width:36px;padding:8px 0}
.side{background:#171b26f4;overflow:auto}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}
.section{padding:13px;border-bottom:1px solid var(--line)}.section h3{font-size:12px;margin:0 0 10px;letter-spacing:.08em;color:#d4dbea}.hint{font-size:11px;line-height:1.55;color:var(--muted)}
.dropzone{border:1px dashed #59647f;border-radius:14px;padding:16px 10px;text-align:center;background:#1b2030;cursor:pointer}.dropzone.drag{border-color:var(--cyan);background:#202a3a}.dropzone b{display:block;margin-bottom:5px}
.assetgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.asset{position:relative;border:1px solid var(--line);background:#121620;border-radius:11px;height:104px;overflow:hidden;cursor:grab}.asset img{width:100%;height:76px;object-fit:contain;background-image:linear-gradient(45deg,#252a38 25%,transparent 25%),linear-gradient(-45deg,#252a38 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#252a38 75%),linear-gradient(-45deg,transparent 75%,#252a38 75%);background-size:14px 14px;background-position:0 0,0 7px,7px -7px,-7px 0}.asset span{position:absolute;left:7px;right:7px;bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;color:#cbd3e5}.asset .x{position:absolute;right:5px;top:5px;width:21px;height:21px;border-radius:7px;border:1px solid #4b536a;background:#11151edb;color:#fff;padding:0;cursor:pointer}
.workspace{position:relative;overflow:auto;padding:28px;display:flex;justify-content:center;align-items:flex-start;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:24px 24px}
.stageShell{position:relative}.stage{position:relative;width:1030px;height:460px;overflow:hidden;border:1px solid #4a536c;box-shadow:0 20px 70px rgba(0,0,0,.45);transform-origin:top left;background-color:transparent}
.stage.checker{background-image:linear-gradient(45deg,#e7e7e7 25%,transparent 25%),linear-gradient(-45deg,#e7e7e7 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e7e7e7 75%),linear-gradient(-45deg,transparent 75%,#e7e7e7 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#f7f7f7}
.gridOverlay{position:absolute;inset:0;pointer-events:none;z-index:9997;background-image:linear-gradient(rgba(90,120,170,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(90,120,170,.16) 1px,transparent 1px);background-size:20px 20px;display:none}.stage.grid .gridOverlay{display:block}
.item{position:absolute;user-select:none;touch-action:none;transform-origin:center center}.item.hide{display:none}.item.selected{outline:2px solid #69cfff;outline-offset:2px}.item.locked:after{content:"🔒";position:absolute;right:-10px;top:-12px;font-size:14px}.item img{width:100%;height:100%;display:block;object-fit:fill;pointer-events:none}.handle{display:none;position:absolute;z-index:4}.selected .handle{display:block}.resize{right:-7px;bottom:-7px;width:13px;height:13px;border-radius:4px;background:#fff;border:2px solid #68cfff;cursor:nwse-resize}.rotate{left:50%;top:-29px;transform:translateX(-50%);width:13px;height:13px;border-radius:50%;background:#a994ff;border:2px solid white;cursor:grab}.rotate:after{content:"";position:absolute;width:1px;height:16px;background:#79d5ff;left:4px;top:10px}
.guide{display:none;position:absolute;background:#5ed2ff;z-index:9999;pointer-events:none}.guide.v{top:0;bottom:0;width:1px}.guide.h{left:0;right:0;height:1px}
.floater{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:20;display:flex;gap:6px;padding:6px;border:1px solid #3c455b;border-radius:12px;background:#121722dd;backdrop-filter:blur(10px)}.zoom{padding:7px 8px;font-size:11px;color:#cfd7e9}
.field{display:grid;grid-template-columns:82px 1fr;gap:8px;align-items:center;margin:8px 0}.field label{font-size:11px;color:#aeb8cc}.field input,.field select{width:100%;border:1px solid var(--line);background:#10141d;color:var(--text);border-radius:8px;padding:7px}.field input[type=color]{height:33px;padding:2px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:10px;border:1px solid var(--line);background:#151a25;color:#d4dbea;border-radius:999px;padding:6px 8px;cursor:pointer}.tag.on{border-color:#8d80ff;background:#292445}
.empty{padding:28px 6px;text-align:center;color:var(--muted);font-size:11px;line-height:1.7}
.layers{display:flex;flex-direction:column;gap:6px}.layer{display:grid;grid-template-columns:28px 1fr 28px 28px;align-items:center;gap:5px;padding:6px;border:1px solid var(--line);border-radius:9px;background:#151a25;font-size:10px;cursor:pointer}.layer.sel{border-color:#6ecfff;background:#1d2836}.layer button{border:0;background:transparent;color:#d9e1ef;cursor:pointer}.layer .thumb{width:28px;height:28px;object-fit:contain;background:#0f1219;border-radius:5px}.layer .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(16px);opacity:0;transition:.2s;background:#10141d;border:1px solid #3f4960;border-radius:11px;padding:9px 13px;z-index:99999}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.58);z-index:99990}.modal.show{display:flex}.card{width:min(660px,90vw);background:#171c28;border:1px solid #414a60;border-radius:16px;padding:16px;box-shadow:0 20px 70px rgba(0,0,0,.45)}.card h2{font-size:15px;margin:0 0 12px}.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.preset{padding:10px;border:1px solid var(--line);border-radius:10px;background:#131823;color:#fff;cursor:pointer}.preset b{display:block;font-size:11px}.preset small{font-size:9px;color:var(--muted)}
@media(max-width:1050px){.app{grid-template-columns:230px 1fr}.right{position:fixed;right:0;top:58px;bottom:0;width:285px;z-index:40;box-shadow:-18px 0 50px rgba(0,0,0,.35)}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand">酒馆美化拼拼乐 <small>素材拼图台</small></div>
  <button class="btn icon" id="undo">↶</button><button class="btn icon" id="redo">↷</button>
  <button class="btn" id="dup">复制</button><button class="btn danger" id="del">删除</button>
  <div class="spacer"></div>
  <button class="btn" id="projectOut">保存工程</button><button class="btn" id="projectIn">读取工程</button>
  <button class="btn primary" id="pngOut">导出 PNG</button>
</header>

<aside class="side left">
  <section class="section">
    <h3>导入你的素材</h3>
    <div class="dropzone" id="dropzone"><b>＋ 扔素材进来</b><div class="hint">PNG / WebP / JPG / SVG / GIF<br>可多选，也可直接拖文件到这里</div></div>
    <input id="fileInput" type="file" accept="image/*,.svg" multiple hidden>
    <div class="assetgrid" id="assetgrid"></div>
  </section>
  <section class="section">
    <h3>画布预设</h3>
    <div class="presets">
      <button class="preset" data-size="1030,460"><b>横幅</b><small>1030×460</small></button>
      <button class="preset" data-size="700,860"><b>聊天区</b><small>700×860</small></button>
      <button class="preset" data-size="440,700"><b>手机</b><small>440×700</small></button>
    </div>
    <div class="row2" style="margin-top:8px">
      <div class="field"><label>宽</label><input id="cw" type="number" value="1030"></div>
      <div class="field"><label>高</label><input id="ch" type="number" value="460"></div>
    </div>
  </section>
  <section class="section">
    <h3>玩法</h3>
    <div class="hint">把左侧缩略图拖到画布，也可以直接点素材添加。选中后拖动；右下角缩放；顶部紫点旋转。<br><br>Del 删除，Ctrl/Cmd+D 复制，方向键微调，Shift+方向键每次 8px。</div>
  </section>
</aside>

<main class="workspace" id="workspace">
  <div class="stageShell">
    <div class="floater">
      <button class="btn icon" id="zoomMinus">−</button><span class="zoom" id="zoomText">100%</span><button class="btn icon" id="zoomPlus">＋</button>
      <button class="btn" id="fit">适配</button><button class="btn" id="gridBtn">网格</button><button class="btn active" id="snapBtn">吸附</button>
    </div>
    <div class="stage checker" id="stage">
      <div class="gridOverlay"></div><div class="guide v" id="gv"></div><div class="guide h" id="gh"></div>
    </div>
  </div>
</main>

<aside class="side right">
  <section class="section">
    <h3>画布</h3>
    <div class="field"><label>底色</label><input id="bgColor" type="color" value="#ffffff"></div>
    <div class="tags"><button class="tag on" id="transparentBtn">透明底</button><button class="tag" id="checkerBtn">棋盘预览</button></div>
  </section>
  <section class="section">
    <h3>选中素材</h3>
    <div class="empty" id="empty">抓一个素材过来。<br>让它接受图层社会的残酷教育。</div>
    <div id="props" style="display:none">
      <div class="field"><label>名称</label><input id="pname"></div>
      <div class="row2"><div class="field"><label>X</label><input id="px" type="number"></div><div class="field"><label>Y</label><input id="py" type="number"></div></div>
      <div class="row2"><div class="field"><label>宽</label><input id="pw" type="number"></div><div class="field"><label>高</label><input id="ph" type="number"></div></div>
      <div class="row2"><div class="field"><label>旋转</label><input id="prot" type="number"></div><div class="field"><label>透明</label><input id="pop" type="number" min="0" max="1" step=".05"></div></div>
      <div class="field"><label>混合</label><select id="blend"><option>normal</option><option>multiply</option><option>screen</option><option>overlay</option><option>soft-light</option><option>hard-light</option><option>lighten</option><option>darken</option></select></div>
      <div class="tags">
        <button class="tag" id="flipX">水平镜像</button><button class="tag" id="flipY">垂直镜像</button><button class="tag" id="lock">锁定</button>
        <button class="tag" id="up">上移一层</button><button class="tag" id="down">下移一层</button>
      </div>
    </div>
  </section>
  <section class="section">
    <h3>图层</h3>
    <div class="layers" id="layers"></div>
  </section>
</aside>
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="sizeModal"><div class="card"><h2>工程文件</h2><div class="hint">工程会把素材本体一起存进 JSON，所以文件可能会胖得相当坦率。</div><div style="height:12px"></div><button class="btn primary" id="exportProjectNow">下载 .json 工程</button><button class="btn" id="closeModal">关闭</button></div></div>
<input id="projectFile" type="file" accept=".json,application/json" hidden>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)}, $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
var stage=$('#stage'),workspace=$('#workspace');
var st={assets:[],items:[],selected:null,w:1030,h:460,zoom:1,bg:'#ffffff',transparent:true,checker:true,grid:false,snap:true,history:[],future:[],counter:1};
function id(p){return p+'_'+Date.now().toString(36)+'_'+(st.counter++)}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('show')},1600)}
function snap(n){return st.snap?Math.round(n/8)*8:n}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function snapshot(){return JSON.stringify({assets:st.assets,items:st.items,w:st.w,h:st.h,bg:st.bg,transparent:st.transparent,checker:st.checker,grid:st.grid,counter:st.counter})}
function remember(){st.history.push(snapshot());if(st.history.length>60)st.history.shift();st.future=[]}
function restore(s){var d=JSON.parse(s);st.assets=d.assets||[];st.items=d.items||[];st.w=d.w||1030;st.h=d.h||460;st.bg=d.bg||'#ffffff';st.transparent=d.transparent!==false;st.checker=d.checker!==false;st.grid=!!d.grid;st.counter=d.counter||1;st.selected=null;render()}
function undo(){if(!st.history.length)return toast('已经退到底了');st.future.push(snapshot());restore(st.history.pop())}
function redo(){if(!st.future.length)return toast('没有下一步');st.history.push(snapshot());restore(st.future.pop())}
function assetById(aid){return st.assets.find(function(a){return a.id===aid})}
function itemById(iid){return st.items.find(function(i){return i.id===iid})}
function fileToData(file){return new Promise(function(resolve,reject){var r=new FileReader();r.onload=function(){resolve(r.result)};r.onerror=reject;r.readAsDataURL(file)})}
async function importFiles(files){
  var list=Array.prototype.slice.call(files).filter(function(f){return f.type.indexOf('image/')===0||/\.svg$/i.test(f.name)});
  if(!list.length)return;
  remember();
  for(var i=0;i<list.length;i++){
    var f=list[i],src=await fileToData(f);
    var dims=await imageSize(src);
    st.assets.push({id:id('asset'),name:f.name,src:src,nw:dims.w,nh:dims.h});
  }
  render();toast('导入 '+list.length+' 个素材');
}
function imageSize(src){return new Promise(function(resolve){var im=new Image();im.onload=function(){resolve({w:im.naturalWidth||300,h:im.naturalHeight||300})};im.onerror=function(){resolve({w:300,h:300})};im.src=src})}
function addAsset(aid,x,y){
  var a=assetById(aid);if(!a)return;remember();
  var max=260,scale=Math.min(1,max/Math.max(a.nw,a.nh)),w=Math.max(24,Math.round(a.nw*scale)),h=Math.max(24,Math.round(a.nh*scale));
  var it={id:id('item'),assetId:aid,name:a.name,x:x==null?Math.round((st.w-w)/2):x,y:y==null?Math.round((st.h-h)/2):y,w:w,h:h,rot:0,opacity:1,flipX:false,flipY:false,locked:false,hidden:false,blend:'normal'};
  st.items.push(it);st.selected=it.id;render();
}
function render(){
  $('#cw').value=st.w;$('#ch').value=st.h;$('#bgColor').value=st.bg;
  stage.style.width=st.w+'px';stage.style.height=st.h+'px';
  stage.style.transform='scale('+st.zoom+')';stage.style.backgroundColor=st.transparent?'transparent':st.bg;
  stage.classList.toggle('checker',st.checker);stage.classList.toggle('grid',st.grid);
  $('.stageShell').style.width=(st.w*st.zoom)+'px';$('.stageShell').style.height=(st.h*st.zoom)+'px';
  stage.querySelectorAll('.item').forEach(function(n){n.remove()});
  st.items.forEach(function(it,idx){stage.appendChild(renderItem(it,idx))});
  renderAssets();renderProps();renderLayers();syncButtons();
}
function renderAssets(){
  var g=$('#assetgrid');g.innerHTML='';
  st.assets.forEach(function(a){
    var d=document.createElement('div');d.className='asset';d.draggable=true;d.dataset.id=a.id;
    var im=document.createElement('img');im.src=a.src;var s=document.createElement('span');s.textContent=a.name;var x=document.createElement('button');x.className='x';x.textContent='×';
    x.onclick=function(e){e.stopPropagation();removeAsset(a.id)};d.onclick=function(){addAsset(a.id)};
    d.ondragstart=function(e){e.dataTransfer.setData('text/asset-id',a.id)};
    d.appendChild(im);d.appendChild(s);d.appendChild(x);g.appendChild(d);
  });
}
function removeAsset(aid){
  var used=st.items.some(function(i){return i.assetId===aid});if(used)return toast('这张还在画布上，先删实例');
  remember();st.assets=st.assets.filter(function(a){return a.id!==aid});render();
}
function renderItem(it,idx){
  var a=assetById(it.assetId),d=document.createElement('div');d.className='item'+(st.selected===it.id?' selected':'')+(it.locked?' locked':'')+(it.hidden?' hide':'');d.dataset.id=it.id;
  d.style.left=it.x+'px';d.style.top=it.y+'px';d.style.width=it.w+'px';d.style.height=it.h+'px';d.style.zIndex=idx+1;d.style.opacity=it.opacity;d.style.mixBlendMode=it.blend;
  d.style.transform='rotate('+it.rot+'deg) scaleX('+(it.flipX?-1:1)+') scaleY('+(it.flipY?-1:1)+')';
  var im=document.createElement('img');im.src=a?a.src:'';d.appendChild(im);
  var rz=document.createElement('div');rz.className='handle resize';var rt=document.createElement('div');rt.className='handle rotate';d.appendChild(rz);d.appendChild(rt);
  d.onpointerdown=function(e){
    if(e.target.classList.contains('handle'))return;
    choose(it.id);if(it.locked)return;
    var before=snapshot(),sx=e.clientX,sy=e.clientY,ox=it.x,oy=it.y;d.setPointerCapture(e.pointerId);
    function mv(ev){it.x=clamp(snap(ox+(ev.clientX-sx)/st.zoom),-it.w+12,st.w-12);it.y=clamp(snap(oy+(ev.clientY-sy)/st.zoom),-it.h+12,st.h-12);d.style.left=it.x+'px';d.style.top=it.y+'px';guides(it);renderProps(false)}
    function up(){d.removeEventListener('pointermove',mv);hideGuides();if(before!==snapshot())st.history.push(before);renderLayers()}
    d.addEventListener('pointermove',mv);d.addEventListener('pointerup',up,{once:true});
  };
  rz.onpointerdown=function(e){
    e.stopPropagation();if(it.locked)return;choose(it.id);var before=snapshot(),sx=e.clientX,sy=e.clientY,ow=it.w,oh=it.h,ratio=ow/oh;rz.setPointerCapture(e.pointerId);
    function mv(ev){var nw=Math.max(16,snap(ow+(ev.clientX-sx)/st.zoom));var nh=e.shiftKey?Math.max(16,nw/ratio):Math.max(16,snap(oh+(ev.clientY-sy)/st.zoom));it.w=nw;it.h=nh;d.style.width=nw+'px';d.style.height=nh+'px';renderProps(false)}
    function up(){rz.removeEventListener('pointermove',mv);if(before!==snapshot())st.history.push(before)}
    rz.addEventListener('pointermove',mv);rz.addEventListener('pointerup',up,{once:true});
  };
  rt.onpointerdown=function(e){
    e.stopPropagation();if(it.locked)return;choose(it.id);var before=snapshot(),r=d.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;rt.setPointerCapture(e.pointerId);
    function mv(ev){it.rot=Math.round(Math.atan2(ev.clientY-cy,ev.clientX-cx)*180/Math.PI+90);d.style.transform='rotate('+it.rot+'deg) scaleX('+(it.flipX?-1:1)+') scaleY('+(it.flipY?-1:1)+')';renderProps(false)}
    function up(){rt.removeEventListener('pointermove',mv);if(before!==snapshot())st.history.push(before)}
    rt.addEventListener('pointermove',mv);rt.addEventListener('pointerup',up,{once:true});
  };
  return d;
}
function choose(iid){st.selected=iid;stage.querySelectorAll('.item').forEach(function(n){n.classList.toggle('selected',n.dataset.id===iid)});renderProps();renderLayers()}
function current(){return itemById(st.selected)}
function renderProps(fill){
  var i=current();$('#empty').style.display=i?'none':'block';$('#props').style.display=i?'block':'none';if(!i||fill===false)return;
  $('#pname').value=i.name;$('#px').value=Math.round(i.x);$('#py').value=Math.round(i.y);$('#pw').value=Math.round(i.w);$('#ph').value=Math.round(i.h);$('#prot').value=i.rot;$('#pop').value=i.opacity;$('#blend').value=i.blend;
  $('#flipX').classList.toggle('on',i.flipX);$('#flipY').classList.toggle('on',i.flipY);$('#lock').classList.toggle('on',i.locked);
}
function renderLayers(){
  var box=$('#layers');box.innerHTML='';
  st.items.slice().reverse().forEach(function(i){
    var a=assetById(i.assetId),d=document.createElement('div');d.className='layer'+(i.id===st.selected?' sel':'');d.onclick=function(){choose(i.id)};
    var im=document.createElement('img');im.className='thumb';im.src=a?a.src:'';var n=document.createElement('div');n.className='name';n.textContent=i.name;
    var vis=document.createElement('button');vis.textContent=i.hidden?'○':'◉';vis.title='显示/隐藏';vis.onclick=function(e){e.stopPropagation();remember();i.hidden=!i.hidden;render()};
    var lk=document.createElement('button');lk.textContent=i.locked?'🔒':'◇';lk.title='锁定';lk.onclick=function(e){e.stopPropagation();remember();i.locked=!i.locked;render()};
    d.appendChild(im);d.appendChild(n);d.appendChild(vis);d.appendChild(lk);box.appendChild(d);
  });
}
function syncButtons(){
  $('#gridBtn').classList.toggle('active',st.grid);$('#snapBtn').classList.toggle('active',st.snap);$('#transparentBtn').classList.toggle('on',st.transparent);$('#checkerBtn').classList.toggle('on',st.checker);$('#zoomText').textContent=Math.round(st.zoom*100)+'%';
}
function bind(id,key,num){
  $(id).oninput=function(){var i=current();if(!i)return;if(!this.dataset.old)this.dataset.old=snapshot();i[key]=num?Number(this.value):this.value;render()};
  $(id).onchange=function(){if(this.dataset.old){st.history.push(this.dataset.old);delete this.dataset.old}}
}
bind('#pname','name',false);bind('#px','x',true);bind('#py','y',true);bind('#pw','w',true);bind('#ph','h',true);bind('#prot','rot',true);bind('#pop','opacity',true);bind('#blend','blend',false);
function toggle(k){var i=current();if(!i)return;remember();i[k]=!i[k];render()}
$('#flipX').onclick=function(){toggle('flipX')};$('#flipY').onclick=function(){toggle('flipY')};$('#lock').onclick=function(){toggle('locked')};
function moveLayer(dir){var i=current();if(!i)return;var idx=st.items.indexOf(i),ni=idx+dir;if(ni<0||ni>=st.items.length)return;remember();var t=st.items[idx];st.items[idx]=st.items[ni];st.items[ni]=t;render()}
$('#up').onclick=function(){moveLayer(1)};$('#down').onclick=function(){moveLayer(-1)};
function del(){var i=current();if(!i)return;remember();st.items=st.items.filter(function(x){return x.id!==i.id});st.selected=null;render()}
function dup(){var i=current();if(!i)return;remember();var n=JSON.parse(JSON.stringify(i));n.id=id('item');n.x+=16;n.y+=16;n.locked=false;st.items.push(n);st.selected=n.id;render()}
$('#del').onclick=del;$('#dup').onclick=dup;$('#undo').onclick=undo;$('#redo').onclick=redo;
$('#dropzone').onclick=function(){$('#fileInput').click()};$('#fileInput').onchange=function(){importFiles(this.files);this.value=''};
['dragenter','dragover'].forEach(function(ev){$('#dropzone').addEventListener(ev,function(e){e.preventDefault();this.classList.add('drag')})});
['dragleave','drop'].forEach(function(ev){$('#dropzone').addEventListener(ev,function(e){e.preventDefault();this.classList.remove('drag')})});
$('#dropzone').addEventListener('drop',function(e){importFiles(e.dataTransfer.files)});
window.addEventListener('dragover',function(e){if(e.dataTransfer&&e.dataTransfer.types&&Array.prototype.indexOf.call(e.dataTransfer.types,'Files')>=0)e.preventDefault()});
window.addEventListener('drop',function(e){if(e.target.closest&&e.target.closest('#dropzone'))return;if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length){e.preventDefault();importFiles(e.dataTransfer.files)}});
stage.ondragover=function(e){e.preventDefault()};
stage.ondrop=function(e){e.preventDefault();var aid=e.dataTransfer.getData('text/asset-id');if(!aid)return;var r=stage.getBoundingClientRect(),a=assetById(aid),max=260,scale=Math.min(1,max/Math.max(a.nw,a.nh)),w=a.nw*scale,h=a.nh*scale;addAsset(aid,(e.clientX-r.left)/st.zoom-w/2,(e.clientY-r.top)/st.zoom-h/2)};
stage.onpointerdown=function(e){if(e.target===stage||e.target.classList.contains('gridOverlay')){st.selected=null;render()}};
$$('.preset').forEach(function(b){b.onclick=function(){var p=this.dataset.size.split(',');remember();st.w=Number(p[0]);st.h=Number(p[1]);render();fit()}});
$('#cw').onchange=function(){remember();st.w=clamp(Number(this.value)||1030,200,2400);render()};$('#ch').onchange=function(){remember();st.h=clamp(Number(this.value)||460,200,1800);render()};
$('#bgColor').oninput=function(){st.bg=this.value;if(!st.transparent)stage.style.backgroundColor=st.bg};$('#bgColor').onchange=remember;
$('#transparentBtn').onclick=function(){remember();st.transparent=!st.transparent;render()};$('#checkerBtn').onclick=function(){st.checker=!st.checker;render()};$('#gridBtn').onclick=function(){st.grid=!st.grid;render()};$('#snapBtn').onclick=function(){st.snap=!st.snap;render()};
function setZoom(z){st.zoom=clamp(z,.2,1.5);render()}function fit(){var z=Math.min((workspace.clientWidth-60)/st.w,(workspace.clientHeight-60)/st.h,1);setZoom(z)}
$('#zoomPlus').onclick=function(){setZoom(st.zoom+.1)};$('#zoomMinus').onclick=function(){setZoom(st.zoom-.1)};$('#fit').onclick=fit;
function guides(i){var cx=i.x+i.w/2,cy=i.y+i.h/2,gv=$('#gv'),gh=$('#gh');if(Math.abs(cx-st.w/2)<7){gv.style.left=st.w/2+'px';gv.style.display='block'}else gv.style.display='none';if(Math.abs(cy-st.h/2)<7){gh.style.top=st.h/2+'px';gh.style.display='block'}else gh.style.display='none'}
function hideGuides(){$('#gv').style.display='none';$('#gh').style.display='none'}
document.addEventListener('keydown',function(e){
  if(['INPUT','SELECT','TEXTAREA'].indexOf(document.activeElement.tagName)>=0)return;
  if(e.key==='Delete'||e.key==='Backspace')del();
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){e.preventDefault();dup()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  var i=current();if(!i||i.locked)return;var s=e.shiftKey?8:1;
  if(e.key==='ArrowLeft'){remember();i.x-=s;render()}if(e.key==='ArrowRight'){remember();i.x+=s;render()}if(e.key==='ArrowUp'){remember();i.y-=s;render()}if(e.key==='ArrowDown'){remember();i.y+=s;render()}
});
function download(name,blob){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1500)}
$('#projectOut').onclick=function(){$('#sizeModal').classList.add('show')};$('#closeModal').onclick=function(){$('#sizeModal').classList.remove('show')};
$('#exportProjectNow').onclick=function(){download('tavern-beauty-project.json',new Blob([snapshot()],{type:'application/json'}));$('#sizeModal').classList.remove('show')};
$('#projectIn').onclick=function(){$('#projectFile').click()};$('#projectFile').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{remember();restore(r.result);toast('工程读入完成')}catch(e){toast('工程文件读坏了')}};r.readAsText(f);this.value=''};
$('#pngOut').onclick=async function(){
  var c=document.createElement('canvas');c.width=st.w;c.height=st.h;var ctx=c.getContext('2d');
  if(!st.transparent){ctx.fillStyle=st.bg;ctx.fillRect(0,0,st.w,st.h)}
  for(var k=0;k<st.items.length;k++){
    var i=st.items[k];if(i.hidden)continue;var a=assetById(i.assetId);if(!a)continue;
    var im=await loadImg(a.src);ctx.save();ctx.globalAlpha=i.opacity;ctx.globalCompositeOperation=canvasBlend(i.blend);ctx.translate(i.x+i.w/2,i.y+i.h/2);ctx.rotate(i.rot*Math.PI/180);ctx.scale(i.flipX?-1:1,i.flipY?-1:1);ctx.drawImage(im,-i.w/2,-i.h/2,i.w,i.h);ctx.restore();
  }
  c.toBlob(function(b){download('tavern-beauty.png',b);toast('PNG 导出完成')},'image/png');
};
function loadImg(src){return new Promise(function(resolve,reject){var i=new Image();i.onload=function(){resolve(i)};i.onerror=reject;i.src=src})}
function canvasBlend(b){var m={'normal':'source-over','multiply':'multiply','screen':'screen','overlay':'overlay','soft-light':'soft-light','hard-light':'hard-light','lighten':'lighten','darken':'darken'};return m[b]||'source-over'}
window.addEventListener('resize',fit);
render();setTimeout(fit,60);
})();
</script>
