clipboard.write([new ClipboardItem({'image/png':b})]);return '已复制图片；文字请用“复制文字”'}catch(_){return '图片复制被浏览器拦了，可用“系统分享”'}}}async function shareRich(){if(!imgs.length){return '先上传牌面图'}if(!navigator.share)return '当前浏览器没有系统分享';try{let data={title:cur?cur.n:'塔罗记录',text:txt(),files:imgs};if(navigator.canShare&&!navigator.canShare({files:imgs}))data={title:data.title,text:data.text};await navigator.share(data);return '已打开系统分享'}catch(e){return e&&e.name==='AbortError'?'已取消分享':'系统分享失败'}}let mx=Math.max(...S.map(s=>s.p.length));for(let i=1;i<=mx;i++)$('#cnt').insertAdjacentHTML('beforeend',`<option value="${i}">${i} 张</option>`);$('#q').oninput=e=>{qq=e.target.value.trim();render()};$('#cnt').onchange=e=>{ct=+e.target.value;render()};$('#fo').onclick=()=>{only=!only;$('#fo').textContent=only?'★ 收藏中':'☆ 只看收藏';render()};$('#rnd').onclick=()=>{let a=list();a.length?open(a[Math.floor(Math.random()*a.length)]):toast('当前筛选下没有牌阵')};$('#x').onclick=()=>$('#modal').classList.remove('show');$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').classList.remove('show')};$('#start').onclick=()=>{$('#reading').classList.add('show');$('#reading').scrollIntoView({behavior:'smooth',block:'start'})};$('#img').onchange=blur;$('#favP').onclick=()=>{fav(cur.i);render()};$('#copyP').onclick=async()=>toast(await cp(cur.p.map((p,i)=>`${i+1}. ${p}`).join('\n'))?'牌位已复制':'复制失败');$('#copyR').onclick=async()=>toast(await cp(txt())?'文字已复制':'复制失败');$('#photo').onchange=e=>{imgs=[...(e.target.files||[])].filter(f=>f.type.startsWith('image/')).slice(0,4);renderImgs()};$('#clearImg').onclick=()=>{imgs=[];$('#photo').value='';renderImgs();toast('图片已清空')};$('#copyRI').onclick=async()=>toast(await copyRich());$('#shareRI').onclick=async()=>toast(await shareRich());cats();render();
