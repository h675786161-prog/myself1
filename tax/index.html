<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>私人站点 · 登录</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f3fa;font:18px system-ui;color:#3d3447;display:grid;place-items:center;min-height:100dvh;padding:24px}main{width:min(100%,390px);background:white;border:1px solid #e5ddea;border-radius:24px;padding:30px;box-shadow:0 12px 50px #66507712}h1{font-size:24px}p{font-size:15px;line-height:1.7;color:#776c80}input,button{width:100%;font:inherit;padding:14px;border-radius:12px;border:1px solid #dcd1e4;margin-top:12px}button{background:#806292;color:white;cursor:pointer}button:disabled{opacity:.6}#error{color:#9d3654;min-height:24px;font-size:14px}label{font-size:16px}</style></head><body><main><h1>私人站点</h1><p>输入玲给你的访问码。登录后，这台设备会记住 30 天。</p><form id="gate"><label for="code">访问码</label><input id="code" type="password" autocomplete="current-password" required maxlength="120"><button id="enter">进入</button></form><p id="error" role="status">正在检查登录…</p></main><script>
const endpoint="https://ibpffxzdjvgydnhmvmvc.supabase.co/functions/v1/site-access",key="privateSitesSession";
async function request(body){const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:AbortSignal.timeout(15000)});const d=await r.json();if(!r.ok){const e=new Error(d.error||"暂时无法登录");e.status=r.status;throw e;}return d;}
async function prepareApiConfig(token){
const profile="tax",key="ling_tax_api_v1",endpoint="https://ibpffxzdjvgydnhmvmvc.supabase.co/functions/v1/api-settings";
const request=async body=>{const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json","x-site-access":token},body:JSON.stringify({profile,...body}),signal:AbortSignal.timeout(12000)});const d=await r.json();if(!r.ok)throw new Error(d.error);return d;};
let version=null,message="云配置暂时没连上，保留本机设置";
try{const d=await request({action:"load"});version=d.version;if(d.found){localStorage.setItem(key,JSON.stringify(d.config||{}));message="API 配置已从云端同步";}
else{const local=JSON.parse(localStorage.getItem(key)||"{}");if(local.base||local.key||local.model){const saved=await request({action:"save",version,config:local});version=saved.version;message="原有 API 配置已迁入云端";}else message="填写后保存，API 配置会跨设备同步";}}
catch{}
window.__apiConfigBoot={profile,key,version,message};
}
async function openSite(token){
 const r=await fetch("https://ibpffxzdjvgydnhmvmvc.supabase.co/functions/v1/tax-site-content",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token}),signal:AbortSignal.timeout(15000)});
 const d=await r.json();if(!r.ok){const e=new Error(r.status===401?"登录已过期，请重新输入访问码":d.error||"题本暂时无法载入");e.status=r.status;throw e;}
 if(!d.html||!d.html.includes('玲的三税学习路线'))throw new Error("没有拿到题本内容，请重试");
 localStorage.setItem(key,token);localStorage.setItem("ling_tax_private_token_v1",token);
 await prepareApiConfig(token);document.open();document.write(d.html);document.close();
}
document.getElementById("gate").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("enter"),error=document.getElementById("error");b.disabled=true;error.textContent="正在登录…";try{const d=await request({action:"login",code:document.getElementById("code").value});await openSite(d.token);}catch(e){error.textContent=e.name==="TimeoutError"?"连接超时，请再试一次":e.message;b.disabled=false;}};
(async()=>{const token=localStorage.getItem(key);if(!token){document.getElementById("error").textContent="";return;}try{await request({action:"verify",token});await openSite(token);}catch(e){if(e.status===401)localStorage.removeItem(key);document.getElementById("error").textContent="请重新输入访问码，或检查网络后刷新。";}})();
</script></body></html>
