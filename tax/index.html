led=true;status('正在验证并载入题本…');\n try{\n  let token=payload.token||'';\n  if(!token&&payload.access_code){\n   const auth=await post(AUTH_API,{access_code:payload.access_code});\n   token=auth.token||'';\n   if(!token)throw new Error('登录成功但没有拿到会话令牌');\n   localStorage.setItem(TOKEN_KEY,token);\n  }\n  await renderLatest(token);\n }catch(e){\n  if(payload.token||e.status===401)localStorage.removeItem(TOKEN_KEY);\n  status(e.message||'载入失败',true);btn.disabled=false;\n }\n}\nform.addEventListener('submit',e=>{e.preventDefault();const code=document.getElementById('code').value;if(code)loadSite({access_code:code})});\nconst saved=localStorage.getItem(TOKEN_KEY);\nif(saved)loadSite({token:saved});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n";
