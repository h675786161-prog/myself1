<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>玲的私有学习站</title>
<style>
:root{--bg:#f7f3f5;--panel:#fffdfd;--line:#e7dde2;--text:#29252a;--muted:#7c737b;--accent:#9a6f83;--danger:#a85f67}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text)}
body{min-height:100vh;display:grid;place-items:center;padding:22px}
.card{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 22px 60px rgba(88,61,74,.10)}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#f2ecef;color:#765f6b;font-size:12px;margin-bottom:12px}
h1{font-size:23px;margin:0 0 8px}.sub{color:var(--muted);font-size:13px;line-height:1.75;margin-bottom:18px}
input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;font:inherit;outline:none;background:#fff}
input:focus{border-color:#b79aad;box-shadow:0 0 0 3px rgba(154,111,131,.10)}
button{width:100%;margin-top:10px;padding:11px 13px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}.msg{min-height:18px;margin-top:10px;font-size:12px;color:var(--muted)}.msg.err{color:var(--danger)}
.tiny{font-size:11px;color:#948a91;line-height:1.65;margin-top:13px}
.loading{display:none}.loading.show{display:block}
</style>
</head>
<body>
<main class="card">
  <div class="badge">🔒 私有入口</div>
  <h1>玲的三税学习站</h1>
  <div class="sub">输入访问码，继续学习。登录后读取你的题本和云端进度。</div>
  <form id="loginForm">
    <input id="code" type="password" autocomplete="current-password" placeholder="访问码" required autofocus>
    <button id="loginBtn" type="submit">进入题本</button>
  </form>
  <div id="msg" class="msg"></div>
  <div class="tiny">登录成功后只在此浏览器保存一个 30 天有效的访问令牌，不保存你的原始访问码。</div>
</main>
<script>
const AUTH_API='https://ibpffxzdjvgydnhmvmvc.supabase.co/functions/v1/tax-private-api';
const SITE_API='https://ibpffxzdjvgydnhmvmvc.supabase.co/functions/v1/tax-site-content';
const TOKEN_KEY='ling_tax_private_token_v1';
const form=document.getElementById('loginForm');
const btn=document.getElementById('loginBtn');
const msg=document.getElementById('msg');
function status(text,err=false){msg.textContent=text||'';msg.className='msg'+(err?' err':'')}
async function post(url,body){
 const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 let data={};try{data=await r.json()}catch{}
 if(!r.ok){const e=new Error(r.status===401?'访问码不对或登录已过期':(data.error||'载入失败：'+r.status));e.status=r.status;throw e}
 return data;
}
async function renderLatest(token){
 const data=await post(SITE_API,{token});
 if(!data.html)throw new Error('没有拿到题本内容');
 document.open();document.write(data.html);document.close();
}
async function loadSite(payload){
 btn.disabled=true;status('正在验证并载入题本…');
 try{
  let token=payload.token||'';
  if(!token&&payload.access_code){
   const auth=await post(AUTH_API,{access_code:payload.access_code});
   token=auth.token||'';
   if(!token)throw new Error('登录成功但没有拿到会话令牌');
   localStorage.setItem(TOKEN_KEY,token);
  }
  await renderLatest(token);
 }catch(e){
  if(payload.token||e.status===401)localStorage.removeItem(TOKEN_KEY);
  status(e.message||'载入失败',true);btn.disabled=false;
 }
}
form.addEventListener('submit',e=>{e.preventDefault();const code=document.getElementById('code').value;if(code)loadSite({access_code:code})});
const saved=localStorage.getItem(TOKEN_KEY);
if(saved)loadSite({token:saved});
</script>
</body>
</html>
