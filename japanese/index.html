>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n  \u003cdiv class=\"top\">\n    \u003cdiv class=\"brand\">\u003ch1>玲的日语庭\u003c/h1>\u003cp>不用端坐背书。做着做着，把它们磨熟。\u003c/p>\u003c/div>\n    \u003cdiv class=\"topActions\">\u003cbutton class=\"pill\" id=\"speechBtn\">🔊 发音\u003c/button>\u003cbutton class=\"pill\" id=\"settingsBtn\">⚙ 设置\u003c/button>\u003c/div>\n  \u003c/div>\n\n  \u003csection class=\"hero\">\n    \u003cdiv class=\"heroTop\">\u003cdiv>\u003cdiv class=\"heroTitle\" id=\"heroTitle\">JLPT N5 · 今日训练\u003c/div>\u003cdiv class=\"heroSub\" id=\"heroSub\">错的会换个问法再回来。手动下一题也算“我认识了”。\u003c/div>\u003c/div>\u003cdiv class=\"heroScore\" id=\"heroScore\">0%\u003c/div>\u003c/div>\n    \u003cdiv class=\"bar\">\u003ci id=\"heroBar\">\u003c/i>\u003c/div>\n    \u003cdiv class=\"metrics\">\u003cdiv class=\"metric\">\u003cb id=\"todayCount\">0\u003c/b>\u003cspan>今日答题\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb id=\"familiarCount\">0\u003c/b>\u003cspan>已磨熟\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb id=\"weakCount\">0\u003c/b>\u003cspan>待回访\u003c/span>\u003c/div>\u003c/div>\n  \u003c/section>\n\n  \u003cdiv class=\"tabs\" id=\"tabs\">\n    \u003cbutton class=\"tab active\" data-view=\"practice\">词流\u003c/button>\u003cbutton class=\"tab\" data-view=\"kana\">五十音\u003c/button>\u003cbutton class=\"tab\" data-view=\"grammar\">语法\u003c/button>\u003cbutton class=\"tab\" data-view=\"verbs\">活用\u003c/button>\u003cbutton class=\"tab\" data-view=\"reading\">阅读/字幕\u003c/button>\u003cbutton class=\"tab\" data-view=\"jlpt\">JLPT\u003c/button>\n  \u003c/div>\n\n  \u003csection class=\"view active\" id=\"view-practice\">\n    \u003cdiv class=\"card questionCard\">\n      \u003cdiv class=\"qMeta\">\u003cspan id=\"qType\">双向词流\u003c/span>\u003cspan id=\"qProgress\">N5\u003c/span>\u003c/div>\n      \u003cdiv class=\"prompt\" id=\"qPrompt\">準備中\u003c/div>\u003cdiv class=\"ruby\" id=\"qRuby\">\u003c/div>\u003cdiv class=\"hint\" id=\"qHint\">题型会自动混合：日→中、中→日、假名、听音、例句补词。\u003c/div>\n      \u003cdiv class=\"options\" id=\"qOptions\">\u003c/div>\n      \u003cdiv class=\"field\" id=\"qInputWrap\" hidden>\u003clabel for=\"qInput\">输入答案\u003c/label>\u003cinput id=\"qInput\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" enterkeyhint=\"done\">\u003cbutton class=\"btn primary\" id=\"qCheck\" style=\"width:100%;margin-top:8px\">核对答案\u003c/button>\u003c/div>\n      \u003cdiv id=\"qFeedback\">\u003c/div>\n      \u003cdiv class=\"actionRow\">\u003cbutton class=\"btn soft\" id=\"qSpeak\">🔊 听一下\u003c/button>\u003cbutton class=\"btn soft\" id=\"qAsk\">七，解释这题\u003c/button>\u003cbutton class=\"btn soft\" id=\"qReview\">记待复习\u003c/button>\u003c/div>\n      \u003cdiv class=\"nextBig\">\u003cbutton class=\"btn primary\" id=\"qNext\">认识了 → 下一题\u003c/button>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"card\">\u003cdiv class=\"sectionHead\">\u003cdiv>\u003ch2>训练口味\u003c/h2>\u003cp>不想写就选，想练主动回忆再切输入。它不该因为你懒得手写就罢工。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"miniGrid\" id=\"modeGrid\">\u003cbutton class=\"modeChip active\" data-mode=\"mixed\">\u003cb>自动混合\u003c/b>\u003cspan>各种题型穿插\u003c/span>\u003c/button>\u003cbutton class=\"modeChip\" data-mode=\"choice\">\u003cb>只选一选\u003c/b>\u003cspan>全程选择题\u003c/span>\u003c/button>\u003cbutton class=\"modeChip\" data-mode=\"input\">\u003cb>输入训练\u003c/b>\u003cspan>主动回忆并核对\u003c/span>\u003c/button>\u003cbutton class=\"modeChip\" data-mode=\"audio\">\u003cb>听音模式\u003c/b>\u003cspan>听日语选中文\u003c/span>\u003c/button>\u003c/div>\u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"view\" id=\"view-kana\">\n    \u003cdiv class=\"card questionCard\">\u003cdiv class=\"sectionHead\">\u003cdiv>\u003ch2>五十音反射\u003c/h2>\u003cp>平假名、片假名、罗马音和听音随机切换，不按教科书顺序排队受刑。\u003c/p>\u003c/div>\u003cspan class=\"badge\" id=\"kanaModeLabel\">平→音\u003c/span>\u003c/div>\u003cdiv class=\"prompt\" id=\"kanaPrompt\">あ\u003c/div>\u003cdiv class=\"hint\" id=\"kanaHint\">选出它的读音。\u003c/div>\u003cdiv class=\"options\" id=\"kanaOptions\">\u003c/div>\u003cdiv id=\"kanaFeedback\">\u003c/div>\u003cdiv class=\"actionRow\">\u003cbutton class=\"btn soft\" id=\"kanaSpeak\">🔊 听音\u003c/button>\u003cbutton class=\"btn primary\" id=\"kanaNext\">换一个\u003c/button>\u003c/div>\u003c/div>\n    \u003cdiv class=\"card\">\u003cdiv class=\"sectionHead\">\u003cdiv>\u003ch2>五十音表\u003c/h2>\u003cp>点任意一个直接听。先建立“看见就知道”的反射，再谈漂亮书写。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"kanaGrid\" id=\"kanaGrid\">\u003c/div>\u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"view\" id=\"view-grammar\">\n    \u003cdiv class=\"card\">\u003cdiv class=\"sectionHead\">\u003cdiv>\u003ch2 id=\"grammarTitle\">N5 语法\u003c/h2>\u003cp>每条都能直接做题，也能扔给 AI 追问“为什么不是另一个”。\u003c/p>\u003c/div>\u003cspan class=\"badge\" id=\"grammarCount\">\u003c/span>\u003c/div>\u003cdiv class=\"grammarList\" id=\"grammarList\">\u003c/div>\u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"view\" id=\"view-verbs\">\n    \u003cdiv class=\"card questionCard\">\u003cdiv class=\"sectionHead\">\u003cdiv>\u003ch2>动词活用快打\u003c/h2>\u003cp>辞书形 → ます / て / ない / た / 可能。只背表格非常符合人类把简单事做难的传统。\u003c/p>\u003c/div>\u003cspan class=\"badge\" id=\"verbType\">て形\u003c/span>\u003c/div>\u003cdiv class=\"prompt\" id=\"verbPrompt\">食べる\u003c/div>\u003cdiv class=\"hint\" id=\"verbHint\">请选择正确的て形。\u003c/div>\u003cdiv class=\"options\" id=\"verbOptions\">\u003c/div>\u003cdiv id=\"verbFeedback\">\u003c/div>\u003cdiv class=\"actionRow\">\u003cbutton class=\"btn soft\" id=\"verbSpeak\">🔊 听原形\u003c/button>\u003cbutton class=\"btn primary\" id=\"verbNext\">下一题\u003c/button>\u003c/div>\u003c/div>\n    \u003cdiv class=\"card\">\u003ctable class=\"verbTable\">\u003cthead>\u003ctr>\u003cth>辞书形\u003c/th>\u003cth>ます\u003c/th>\u003cth>て\u003c/th>\u003cth>ない\u003c/th>\u003cth>可能\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"verbTable\">\u003c/tbody>\u003c/table>\u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"view\" id=\"view-reading\">\n    \u003cdiv class=\"card\">\u003cdiv class=\"sectionHead\">\u003cdiv>\u003ch2>一句一句拆\u003c/h2>\u003cp>贴日剧、动漫、游戏台词都行。AI 会按读音、词、语法、自然语感拆，不先给你盖一栋术语大楼。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"subtitleInput\">日语原句\u003c/label>\u003ctextarea id=\"subtitleInput\" placeholder=\"例：今日はちょっと疲れたから、早く寝ようかな。\">\u003c/textarea>\u003c/div>\u003cdiv class=\"actionRow\">\u003cbutton class=\"btn primary\" id=\"subtitleAnalyze\">拆给我看\u003c/button>\u003cbutton class=\"btn soft\" id=\"subtitleSpeak\">🔊 朗读\u003c/button>\u003cbutton class=\"btn soft\" id=\"subtitleSave\">加入记忆池\u003c/button>\u003c/div>\u003cdiv class=\"subtitleOutput markdown\" id=\"subtitleOutput\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"card\">\u003cdiv class=\"sectionHead\">\u003cdiv>\u003ch2>短阅读\u003c/h2>\u003cp>点词会弹小卡；浏览器支持 `Intl.Segmenter` 时会自动按日语词切。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"readingList\" id=\"readingList\">\u003c/div>\u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"view\" id=\"view-jlpt\">\n    \u003cdiv class=\"card\">\u003cdiv class=\"sectionHead\">\u003cdiv>\u003ch2>JLPT 目标\u003c/h2>\u003cp>切等级后，词流、语法、模拟题一起跟着换。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"levelRow\" id=\"levelRow\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"card questionCard\">\u003cdiv class=\"qMeta\">\u003cspan>迷你模拟\u003c/span>\u003cspan id=\"mockIndex\">1 / 5\u003c/span>\u003c/div>\u003cdiv class=\"prompt small\" id=\"mockPrompt\">\u003c/div>\u003cdiv class=\"options\" id=\"mockOptions\">\u003c/div>\u003cdiv id=\"mockFeedback\">\u003c/div>\u003cdiv class=\"actionRow\">\u003cbutton class=\"btn soft\" id=\"mockExplain\">七，讲解析\u003c/button>\u003cbutton class=\"btn primary\" id=\"mockNext\">下一题\u003c/button>\u003c/div>\u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"card settings\" id=\"settingsPanel\">\n    \u003cdiv class=\"sectionHead\">\u003cdiv>\u003ch2>设置\u003c/h2>\u003cp>API Key 只放你本机；学习进度可以用独立同步码进云端。\u003c/p>\u003c/div>\u003cbutton class=\"btn\" id=\"settingsClose\">收起\u003c/button>\u003c/div>\n    \u003cdiv class=\"two\">\u003cdiv class=\"field\">\u003clabel for=\"levelSelect\">JLPT 等级\u003c/label>\u003cselect id=\"levelSelect\">\u003coption>N5\u003c/option>\u003coption>N4\u003c/option>\u003coption>N3\u003c/option>\u003coption>N2\u003c/option>\u003coption>N1\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"dailyGoal\">每日题数\u003c/label>\u003cselect id=\"dailyGoal\">\u003coption value=\"10\">10\u003c/option>\u003coption value=\"20\">20\u003c/option>\u003coption value=\"30\">30\u003c/option>\u003coption value=\"50\">50\u003c/option>\u003c/select>\u003c/div>\u003c/div>\n    \u003ch3 style=\"margin-top:16px\">发音\u003c/h3>\u003cdiv class=\"two\">\u003cdiv class=\"field\">\u003clabel for=\"speechVoice\">日语声音\u003c/label>\u003cselect id=\"speechVoice\">\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"speechRate\">语速\u003c/label>\u003cselect id=\"speechRate\">\u003coption value=\"0.82\">慢一点\u003c/option>\u003coption value=\"0.92\">自然偏慢\u003c/option>\u003coption value=\"1\">正常\u003c/option>\u003c/select>\u003c/div>\u003c/div>\u003cdiv class=\"actionRow\">\u003cbutton class=\"btn soft\" id=\"speechPreview\">试听「おはようございます」\u003c/button>\u003cbutton class=\"btn soft\" id=\"speechStop\">停止\u003c/button>\u003c/div>\n    \u003ch3 style=\"margin-top:16px\">云同步\u003c/h3>\u003cdiv class=\"cloudLine\">\u003cdiv>\u003cb id=\"cloudState\">未连接\u003c/b>\u003cspan id=\"cloudMeta\">英语和日语按 site_id 分开，不会串。\u003c/span>\u003c/div>\u003cspan>☁\u003c/span>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"syncCode\">同步码\u003c/label>\u003cinput id=\"syncCode\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"至少 16 位\">\u003c/div>\u003cdiv class=\"actionRow\">\u003cbutton class=\"btn soft\" id=\"syncGenerate\">生成同步码\u003c/button>\u003cbutton class=\"btn primary\" id=\"syncNow\">立即同步\u003c/button>\u003cbutton class=\"btn soft\" id=\"syncPull\">强制拉云端\u003c/button>\u003c/div>\u003cdiv class=\"notice\">同一个同步码在不同设备填一次就行。这里只同步日语学习状态，不同步 API Key。\u003c/div>\n  \u003c/section>\n\u003c/div>\n\n\u003cdialog class=\"sheet\" id=\"wordSheet\">\u003cdiv class=\"sheetTop\">\u003cdiv>\u003cstrong id=\"wordMain\">\u003c/strong>\u003cdiv class=\"tiny\" id=\"wordReading\">\u003c/div>\u003c/div>\u003cbutton class=\"sheetClose\" id=\"wordClose\">×\u003c/button>\u003c/div>\u003cdiv class=\"sheetText\" id=\"wordMeaning\">\u003c/div>\u003cdiv class=\"actionRow\">\u003cbutton class=\"btn soft\" id=\"wordSpeak\">🔊 听词\u003c/button>\u003cbutton class=\"btn soft\" id=\"wordAsk\">问七这个词\u003c/button>\u003c/div>\u003c/dialog>\n\u003cdiv class=\"toast\" id=\"toast\">\u003c/div>\n\n\u003cdiv class=\"aiRoot\" id=\"aiRoot\">\u003cbutton class=\"aiFab\" id=\"aiFab\" aria-label=\"AI 答疑\">七\u003c/button>\u003cdiv class=\"aiPanel\" id=\"aiPanel\">\u003cdiv class=\"aiHead\">\u003cdiv>\u003cb>七 · 当前页面答疑\u003c/b>\u003cspan id=\"aiContextLabel\">正在读取当前内容\u003c/span>\u003c/div>\u003cbutton class=\"aiClose\" id=\"aiClose\">×\u003c/button>\u003c/div>\u003cdiv class=\"aiBody\">\u003cdiv class=\"aiContext\" id=\"aiContextPreview\">\u003c/div>\u003cdiv class=\"aiQuick\">\u003cbutton data-aiq=\"explain\">解释当前内容\u003c/button>\u003cbutton data-aiq=\"compare\">这个和相似用法差在哪\u003c/button>\u003cbutton data-aiq=\"quiz\">换个问法再考我\u003c/button>\u003c/div>\u003cdiv class=\"aiThread\" id=\"aiThread\">\u003c/div>\u003cdetails class=\"aiSettings\" id=\"aiSettings\">\u003csummary>⚙ API 设置 / 模型\u003c/summary>\u003cdiv class=\"field\">\u003clabel for=\"apiBase\">API Base\u003c/label>\u003cinput id=\"apiBase\" inputmode=\"url\" placeholder=\"https://.../v1\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"apiKey\">API Key\u003c/label>\u003cinput id=\"apiKey\" type=\"password\" autocomplete=\"off\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"apiModel\">模型\u003c/label>\u003cselect id=\"apiModel\">\u003c/select>\u003c/div>\u003cdiv class=\"actionRow\">\u003cbutton class=\"btn soft\" id=\"apiModels\">拉取模型\u003c/button>\u003cbutton class=\"btn primary\" id=\"apiSave\">保存配置\u003c/button>\u003c/div>\u003cdiv class=\"tiny\" id=\"apiStatus\">API 配置在登录后跨设备同步。\u003c/div>\u003c/details>\u003cdiv class=\"aiComposer\">\u003ctextarea id=\"aiInput\" rows=\"1\" placeholder=\"直接问你现在不懂的地方…\">\u003c/textarea>\u003cbutton id=\"aiSend\">发送\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cscript>\n'use strict';\nconst $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];\nconst esc=s=>String(s??'').replace(/[&\u003c>\"']/g,m=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[m]));\nconst dayKey=()=>new Date().toLocaleDateString('en-CA');\nlet toastTimer;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),2200)}\nfunction shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\nfunction sample(a,n=1){const s=shuffle(a);return n===1?s[0]:s.slice(0,n)}\nfunction norm(s){return String(s||'').trim().replace(/[\\s。、，,.!?！？]/g,'').toLowerCase()}\n\nconst KANA=[\n['あ','ア','a'],['い','イ','i'],['う','ウ','u'],['え','エ','e'],['お','オ','o'],['か','カ','ka'],['き','キ','ki'],['く','ク','ku'],['け','ケ','ke'],['こ','コ','ko'],['さ','サ','sa'],['し','シ','shi'],['す','ス','su'],['せ','セ','se'],['そ','ソ','so'],['た','タ','ta'],['ち','チ','chi'],['つ','ツ','tsu'],['て','テ','te'],['と','ト','to'],['な','ナ','na'],['に','ニ','ni'],['ぬ','ヌ','nu'],['ね','ネ','ne'],['の','ノ','no'],['は','ハ','ha'],['ひ','ヒ','hi'],['ふ','フ','fu'],['へ','ヘ','he'],['ほ','ホ','ho'],['ま','マ','ma'],['み','ミ','mi'],['む','ム','mu'],['め','メ','me'],['も','モ','mo'],['や','ヤ','ya'],['ゆ','ユ','yu'],['よ','ヨ','yo'],['ら','ラ','ra'],['り','リ','ri'],['る','ル','ru'],['れ','レ','re'],['ろ','ロ','ro'],['わ','ワ','wa'],['を','ヲ','o'],['ん','ン','n']\n].map(([h,k,r])=>({h,k,r}));\nconst VOCAB={\nN5:[\n['水','みず','水','水を飲みます。','喝水。'],['食べる','たべる','吃','朝ご飯を食べる。','吃早饭。'],['見る','みる','看','映画を見る。','看电影。'],['行く','いく','去','学校へ行く。','去学校。'],['来る','くる','来','友達が家に来る。','朋友来家里。'],['帰る','かえる','回去','六時に家へ帰る。','六点回家。'],['今日','きょう','今天','今日は休みです。','今天休息。'],['明日','あした','明天','明日は雨です。','明天下雨。'],['昨日','きのう','昨天','昨日は忙しかった。','昨天很忙。'],['大きい','おおきい','大的','大きい猫ですね。','是只大猫呢。'],['小さい','ちいさい','小的','小さい店です。','是家小店。'],['新しい','あたらしい','新的','新しい靴を買った。','买了新鞋。'],['古い','ふるい','旧的；老的','古い写真を見つけた。','找到了旧照片。'],['好き','すき','喜欢','猫が好きです。','喜欢猫。'],['嫌い','きらい','讨厌；不喜欢','辛い物は嫌いです。','不喜欢辣的东西。'],['忙しい','いそがしい','忙','今日は少し忙しい。','今天有点忙。'],['暇','ひま','有空；闲','午後は暇です。','下午有空。'],['駅','えき','车站','駅で会いましょう。','在车站见吧。'],['電車','でんしゃ','电车','電車で行きます。','坐电车去。'],['時間','じかん','时间','時間がありません。','没有时间。'],['友達','ともだち','朋友','友達と話します。','和朋友说话。'],['仕事','しごと','工作','仕事が終わりました。','工作结束了。'],['寝る','ねる','睡觉','今日は早く寝る。','今天早点睡。'],['起きる','おきる','起床','七時に起きます。','七点起床。']\n],\nN4:[\n['続ける','つづける','继续','勉強を続けています。','一直在继续学习。'],['決める','きめる','决定','来月行くことに決めた。','决定下个月去。'],['慣れる','なれる','习惯','新しい生活に慣れた。','习惯了新生活。'],['間に合う','まにあう','赶得上','電車に間に合いました。','赶上电车了。'],['必要','ひつよう','必要','予約が必要です。','需要预约。'],['予定','よてい','计划；预定','週末の予定はまだない。','周末还没计划。'],['説明','せつめい','说明；解释','もう一度説明してください。','请再解释一次。'],['連絡','れんらく','联系','後で連絡します。','之后联系。'],['理由','りゆう','理由','理由を教えてください。','请告诉我理由。'],['経験','けいけん','经验','日本で働いた経験があります。','有在日本工作的经验。'],['最近','さいきん','最近','最近よく眠れます。','最近睡得很好。'],['途中','とちゅう','途中','帰る途中で雨が降った。','回去途中下雨了。'],['準備','じゅんび','准备','旅行の準備をする。','做旅行准备。'],['相談','そうだん','商量；咨询','先生に相談した。','和老师商量了。'],['残念','ざんねん','遗憾','行けなくて残念です。','不能去很遗憾。']\n],\nN3:[\n['確かめる','たしかめる','确认','時間をもう一度確かめる。','再确认一次时间。'],['影響','えいきょう','影响','生活に大きな影響がある。','对生活有很大影响。'],['意外','いがい','意外','結果は意外だった。','结果很意外。'],['状態','じょうたい','状态','機械の状態を確認する。','确认机器状态。'],['増える','ふえる','增加','外国人観光客が増えた。','外国游客增加了。'],['減る','へる','减少','最近、残業が減った。','最近加班减少了。'],['比べる','くらべる','比较','二つの商品を比べる。','比较两个商品。'],['期待','きたい','期待','新しい作品に期待している。','期待新作品。'],['判断','はんだん','判断','すぐに判断するのは難しい。','很难马上判断。'],['原因','げんいん','原因','遅れた原因を調べる。','调查迟到的原因。'],['結果','けっか','结果','結果をメールで知らせる。','通过邮件通知结果。'],['条件','じょうけん','条件','条件をよく確認してください。','请仔细确认条件。']\n],\nN2:[\n['維持','いじ','维持','品質を維持する。','维持品质。'],['傾向','けいこう','倾向','価格は上がる傾向にある。','价格有上涨倾向。'],['対応','たいおう','应对；处理','問題にすぐ対応した。','马上处理了问题。'],['負担','ふたん','负担','費用の負担が大きい。','费用负担很大。'],['伴う','ともなう','伴随','成長には変化が伴う。','成长伴随着变化。'],['適切','てきせつ','恰当','適切な方法を選ぶ。','选择恰当的方法。'],['把握','はあく','掌握','状況を正確に把握する。','准确掌握情况。'],['見直す','みなおす','重新审视','計画を見直す必要がある。','有必要重新审视计划。'],['促す','うながす','促使','参加を促す。','促进参与。'],['著しい','いちじるしい','显著的','技術の進歩が著しい。','技术进步显著。']\n],\nN1:[\n['踏まえる','ふまえる','基于；考虑到','調査結果を踏まえて判断する。','基于调查结果判断。'],['余儀なくされる','よぎなくされる','被迫','計画の変更を余儀なくされた。','被迫修改计划。'],['見込む','みこむ','预计','来年の増加を見込んでいる。','预计明年会增加。'],['顕著','けんちょ','显著','地域差が顕著に表れた。','地区差异显著呈现。'],['妥当','だとう','妥当；合理','その判断は妥当だ。','那个判断是合理的。'],['概ね','おおむね','大体上','結果は概ね良好だった。','结果总体良好。'],['免れる','まぬがれる','免于','責任を免れることはできない。','无法免除责任。'],['遂げる','とげる','完成；实现','大きな成長を遂げた。','取得了巨大成长。'],['著しく','いちじるしく','显著地','状況が著しく改善した。','情况显著改善。'],['鑑みる','かんがみる','鉴于；考虑到','事情に鑑みて延期した。','鉴于情况而延期。']\n]};\nfor(const [level,list] of Object.entries(VOCAB)) list.forEach((x,i)=>{x.id=level+'-v'+i;x.jp=x[0];x.kana=x[1];x.zh=x[2];x.ex=x[3];x.exZh=x[4]});\nconst GRAMMAR={\nN5:[['は','提示主题','私は玲です。','“说到我……”；重点在后面。'],['が','标记主语/新信息','猫がいます。','回答“谁/什么”的时候很常见。'],['を','动作对象','水を飲みます。','表示动作直接作用的对象。'],['に','时间/到达点/存在点','七時に起きます。','把动作钉在某个点上。'],['で','动作发生场所/手段','家で勉強します。','在某处做某动作，或用某种手段。'],['〜たい','想做……','日本へ行きたいです。','接动词ます形去ます。'],['〜てください','请做……','もう一度言ってください。','礼貌请求对方做某事。'],['〜てもいい','可以做……','ここに座ってもいいです。','询问或表示许可。'],['〜てはいけない','不可以……','ここで写真を撮ってはいけません。','表示禁止。']],\nN4:[['〜たことがある','曾经做过','京都へ行ったことがあります。','经历表达。'],['〜ながら','一边……一边……','音楽を聞きながら勉強します。','两个动作同时进行，后项通常是主要动作。'],['〜そうだ','看起来要……','雨が降りそうです。','根据眼前样子判断。'],['〜なければならない','必须……','薬を飲まなければなりません。','“不做不行”。'],['〜と思う','我觉得……','明日は寒いと思います。','表达判断、想法。']],\nN3:[['〜ようにする','尽量做到……','毎日日本語を読むようにしています。','把某行为变成习惯或努力目标。'],['〜ことになっている','规定/安排为……','ここでは靴を脱ぐことになっています。','不是个人临时决定，而是规则或安排。'],['〜ばかり','净是；刚刚','甘い物ばかり食べています。','强调偏多、偏向某一类。'],['〜わけではない','并不是说……','嫌いなわけではありません。','部分否定，避免把话说绝。'],['〜おかげで','多亏……','友達のおかげで助かりました。','通常接积极结果。']],\nN2:[['〜わけにはいかない','不能……（受立场/常
